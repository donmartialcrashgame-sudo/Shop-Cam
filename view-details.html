<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Product Details | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f6f7;color:#171717}.page{max-width:1120px;margin:auto;padding:22px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:22px;font-weight:800;text-decoration:none;color:#171717}.logo span{color:#d71920}.back{color:#d71920;text-decoration:none;font-size:12px;font-weight:700}.card{background:#fff;border:1px solid #eee;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;box-shadow:0 15px 50px #00000008}.gallery{padding:14px;background:#fafafa}.hero{height:500px;border-radius:14px;background:#eee;position:relative;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:#fff;color:#222;font-size:22px;cursor:pointer;box-shadow:0 5px 20px #0002}.prev{left:12px}.next{right:12px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumb{width:70px;height:62px;flex:0 0 auto;border:2px solid transparent;border-radius:9px;object-fit:cover;cursor:pointer}.thumb.active{border-color:#d71920}.details{padding:38px}.brand-label{display:inline-flex;background:#fff0f0;color:#d71920;border-radius:999px;padding:7px 12px;font-size:9px;font-weight:900;text-transform:uppercase}.product-name{font-size:36px;line-height:1.05;margin:15px 0 12px}.description-card{background:#fff;border:1px solid #e7e7e7;border-left:4px solid #d71920;border-radius:14px;padding:15px 16px;color:#666;font-size:13px;line-height:1.8;box-shadow:0 5px 18px #00000008}.price{font-size:29px;font-weight:900;margin:22px 0 5px}.compare{text-decoration:line-through;color:#999;font-size:12px}.status{display:inline-flex;align-items:center;gap:5px;margin-top:13px;padding:7px 10px;border-radius:20px;background:#eaf9ef;color:#16713b;font-size:9px;font-weight:900}.flash{background:#fff1f1;color:#c4161c}.upcoming{background:#fff6df;color:#875900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:20px 0}.info{border:1px solid #eee;border-radius:12px;padding:12px;background:#fff;display:flex;gap:10px;align-items:flex-start}.info-icon{width:28px;height:28px;flex:none;border-radius:8px;background:#fff0f0;color:#d71920;display:grid;place-items:center;font-size:14px;font-weight:900}.info span{display:block;color:#888;font-size:9px;text-transform:uppercase;letter-spacing:.5px}.info b{display:block;margin-top:5px;font-size:11px;line-height:1.4}.section{border-top:1px solid #eee;padding-top:17px;margin-top:17px}.section h3{font-size:13px;margin:0 0 8px}.longdesc{font-size:12px;line-height:1.8;color:#555}.countdown{display:flex;gap:7px;margin:10px 0}.time{background:#171717;color:#fff;border-radius:8px;padding:9px 7px;min-width:48px;text-align:center}.time b{display:block;font-size:15px}.time span{font-size:7px;color:#ccc}.qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:8px;width:max-content;overflow:hidden}.qty button{width:38px;height:40px;border:0;background:#f5f5f5;cursor:pointer;font-size:18px}.qty span{width:42px;text-align:center;font-weight:700}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}.cart,.buy,.book,.wishlist{border:0;border-radius:8px;padding:14px 18px;font-size:11px;font-weight:800;cursor:pointer}.cart{background:#d71920;color:#fff}.buy{background:#b9151b;color:#fff}.book{background:#171717;color:#fff}.wishlist{background:#fff;border:1px solid #d71920;color:#d71920;display:inline-flex;align-items:center;gap:7px}.wishlist.active{background:#d71920;color:#fff}.wishlist svg{width:17px;height:17px}.wishlist.active svg{fill:currentColor}.message{margin-top:13px;padding:11px;border-radius:8px;background:#f0fff4;color:#176b36;font-size:11px;display:none}.loading,.error{text-align:center;padding:100px 20px;color:#777;background:#fff;border:1px solid #eee;border-radius:15px}.error{color:#b9151b}@media(max-width:750px){.card{grid-template-columns:1fr}.hero{height:340px}.details{padding:25px 20px}.product-name{font-size:30px}.actions{flex-direction:column}.cart,.buy,.book,.wishlist{width:100%;justify-content:center}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.info{min-height:64px}.info-icon{width:25px;height:25px;font-size:12px}}</style></head><body><main class="page"><div class="top"><a class="logo" href="dashboard.html"><span>Shop</span> Camzon</a><a class="back" href="dashboard.html">← Back to products</a></div><div id="root" class="loading">Loading product...</div></main><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const root=document.getElementById('root'),id=new URLSearchParams(location.search).get('id');const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));if(!id){root.className='error';root.textContent='Product was not specified.'}else{try{const{data:p,error}=await supabase.from('products').select('*').eq('id',id).single();if(error)throw error;if(!p||p.is_active===false)throw new Error('This product is no longer available.');const images=[p.main_image_url,p.image_url_2,p.image_url_3,p.image_url_4,p.image_url_5,p.image_url_6].filter(Boolean);if(!images.length)images.push('images/shop-1.jpg');const kind=String(p.product_type||p.sale_type||p.status||'regular').toLowerCase(),upcoming=['upcoming','preorder','pre-order'].includes(kind)||!!p.is_upcoming,flash=['flash','flash_sale','flash-sale'].includes(kind)||!!p.is_flash_sale,release=p.upcoming_at||p.preorder_at||p.available_at||p.release_at,currency=p.currency||'USD',name=String(p.name||'').trim(),showName=name&&name.toLowerCase()!=='shop camzon product';root.className='card';root.innerHTML=`<div class="gallery"><div class="hero"><img id="heroImg" src="${safe(images[0])}" alt="${safe(name)}"><button class="arrow prev" id="prev">‹</button><button class="arrow next" id="next">›</button></div><div class="thumbs">${images.map((x,i)=>`<img class="thumb ${i?'':'active'}" src="${safe(x)}" data-i="${i}" alt="Product image ${i+1}">`).join('')}</div></div><section class="details"><span class="brand-label">Shop Camzon Product</span>${showName?`<h1 class="product-name">${safe(name)}</h1>`:''}<div class="description-card">${safe(p.short_description||p.description||'No product description is available.')}</div><div class="price">${App.formatCurrency(p.price,currency)}</div>${p.compare_price?`<div class="compare">${App.formatCurrency(p.compare_price,currency)}</div>`:''}<span class="status ${flash?'flash':''} ${upcoming?'upcoming':''}">${upcoming?'🔮 Coming Soon — Pre-booking':flash?'⚡ Flash Sale':'✓ Available Now'}</span>${upcoming?`<div class="section"><h3>Pre-booking</h3><div class="longdesc">Reserve this upcoming product now. It cannot be purchased until the release time.</div><div class="countdown" id="countdown"><div class="time"><b>--</b><span>DAYS</span></div><div class="time"><b>--</b><span>HOURS</span></div><div class="time"><b>--</b><span>MIN</span></div><div class="time"><b>--</b><span>SEC</span></div></div></div>`:''}<div class="grid"><div class="info"><div class="info-icon">⌂</div><div><span>Market Status</span><b>${safe(p.market_status||p.market||(upcoming?'Upcoming':'Active'))}</b></div></div><div class="info"><div class="info-icon">▣</div><div><span>Wholesale Stock</span><b>${p.wholesale_stock??p.stock??'Not specified'}</b></div></div><div class="info"><div class="info-icon">↗</div><div><span>Delivery Channel</span><b>${safe(p.delivery_channel||p.delivery_method||'Standard delivery')}</b></div></div><div class="info"><div class="info-icon">⚙</div><div><span>Core Tech</span><b>${safe(p.core_tech||p.technology||p.tech||'Not specified')}</b></div></div><div class="info"><div class="info-icon">▣</div><div><span>Product Added</span><b>${p.created_at?new Date(p.created_at).toLocaleDateString():'Not specified'}</b></div></div><div class="info"><div class="info-icon">✓</div><div><span>Availability</span><b>${p.stock>0?`${p.stock} in stock`:upcoming?'Pre-book only':'Out of stock'}</b></div></div></div><div class="qty"><button id="minus">−</button><span id="quantity">1</span><button id="plus">+</button></div><div class="actions">${upcoming?`<button class="book" id="book">Book Product</button>`:`<button class="cart" id="add">Add to cart</button><button class="buy" id="buy">Buy now</button>`}<button class="wishlist" id="wishlist" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.2-4.35-9.3-8.25C.8 8.95 2.65 5 6.5 5c2.2 0 3.8 1.25 5.5 3.1C13.7 6.25 15.3 5 17.5 5c3.85 0 5.7 3.95 3.8 7.75C19.2 16.65 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Add to wishlist</span></button></div><div class="message" id="message"></div></section>`;let idx=0,q=1;const hero=document.getElementById('heroImg'),thumbs=[...document.querySelectorAll('.thumb')],quantity=document.getElementById('quantity'),wishlist=document.getElementById('wishlist');const saved=()=>App.isSaved(p.id);const syncWishlist=()=>{const active=saved();wishlist.classList.toggle('active',active);wishlist.querySelector('span').textContent=active?'Saved to wishlist':'Add to wishlist';wishlist.setAttribute('aria-pressed',String(active))};syncWishlist();wishlist.onclick=()=>{App.toggleWishlist({id:p.id,name:p.name,price:Number(p.price),image:images[0],currency});syncWishlist()};const msg=t=>{const m=document.getElementById('message');m.textContent=t;m.style.display='block'};const setImage=i=>{idx=(i+images.length)%images.length;hero.src=images[idx];thumbs.forEach((t,n)=>t.classList.toggle('active',n===idx))};document.getElementById('prev').onclick=()=>setImage(idx-1);document.getElementById('next').onclick=()=>setImage(idx+1);thumbs.forEach(t=>t.onclick=()=>setImage(Number(t.dataset.i)));document.getElementById('minus').onclick=()=>{q=Math.max(1,q-1);quantity.textContent=q};document.getElementById('plus').onclick=()=>{const max=Number(p.stock);if(upcoming||!max||q<max)q++;quantity.textContent=q};const add=()=>{const c=JSON.parse(localStorage.getItem('shopcamzon_cart')||'[]'),f=c.find(x=>x.id===p.id);if(f)f.quantity=(Number(f.quantity)||0)+q;else c.push({id:p.id,name:p.name,price:Number(p.price),image:images[0],quantity:q,currency});localStorage.setItem('shopcamzon_cart',JSON.stringify(c));msg('Added '+q+' item(s) to your cart.')};if(!upcoming){document.getElementById('add').onclick=add;document.getElementById('buy').onclick=()=>{add();setTimeout(()=>location.href='cart.html',100)}}else document.getElementById('book').onclick=()=>{const b=JSON.parse(localStorage.getItem('shopcamzon_preorders')||'[]');b.push({product_id:p.id,name:p.name,quantity:q,booked_at:new Date().toISOString()});localStorage.setItem('shopcamzon_preorders',JSON.stringify(b));msg('Your pre-booking has been saved.')};if(upcoming&&release){const target=new Date(release).getTime(),el=document.getElementById('countdown'),tick=()=>{let d=Math.max(0,target-Date.now()),days=Math.floor(d/86400000);d%=86400000;let h=Math.floor(d/3600000);d%=3600000;let m=Math.floor(d/60000),s=Math.floor(d/1000)%60;el.innerHTML=`<div class="time"><b>${days}</b><span>DAYS</span></div><div class="time"><b>${h}</b><span>HOURS</span></div><div class="time"><b>${m}</b><span>MIN</span></div><div class="time"><b>${s}</b><span>SEC</span></div>`};tick();setInterval(tick,1000)}}catch(e){root.className='error';root.textContent='Unable to load product: '+e.message}}</script></body></html>
