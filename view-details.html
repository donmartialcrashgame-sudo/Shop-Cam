<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Product Details | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}.page{max-width:1120px;margin:auto;padding:22px 18px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.logo{font-size:22px;font-weight:800;text-decoration:none;color:#171717}.logo span{color:#d71920}.back{color:#d71920;text-decoration:none;font-size:12px;font-weight:700}.card{background:#fff;border:1px solid #eee;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 15px 50px #00000008}.image{min-height:540px;background:#eee center/cover no-repeat;position:relative}.details{padding:45px}.tag{display:inline-block;background:#fff0f0;color:#d71920;border-radius:20px;padding:7px 11px;font-size:9px;font-weight:800;text-transform:uppercase}.details h1{font-size:38px;line-height:1.05;margin:18px 0 10px}.description{color:#777;font-size:14px;line-height:1.8}.price{font-size:30px;font-weight:800;margin:25px 0 7px}.stock{font-size:11px;color:#555;margin-bottom:25px}.qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:8px;width:max-content;overflow:hidden}.qty button{width:38px;height:40px;border:0;background:#f5f5f5;cursor:pointer;font-size:18px}.qty span{width:42px;text-align:center;font-weight:700}.actions{display:flex;gap:10px;margin-top:15px}.cart,.buy{border:0;border-radius:8px;padding:14px 20px;font-size:12px;font-weight:800;cursor:pointer}.cart{background:#171717;color:#fff}.buy{background:#d71920;color:#fff}.message{margin-top:15px;padding:11px;border-radius:8px;background:#f0fff4;color:#176b36;font-size:11px;display:none}.loading,.error{text-align:center;padding:100px 20px;color:#777;background:#fff;border:1px solid #eee;border-radius:15px}.error{color:#b9151b}@media(max-width:750px){.card{grid-template-columns:1fr}.image{min-height:340px}.details{padding:28px 22px}.details h1{font-size:31px}.actions{flex-direction:column}.cart,.buy{width:100%}}</style></head><body><main class="page"><div class="top"><a class="logo" href="dashboard.html"><span>Shop</span> Camzon</a><a class="back" href="dashboard.html">← Back to products</a></div><div id="root" class="loading">Loading product...</div></main><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const root=document.getElementById('root'),id=new URLSearchParams(location.search).get('id');if(!id){root.className='error';root.textContent='Product was not specified.'}else{try{const{data:p,error}=await supabase.from('products').select('id,name,description,price,compare_price,stock,main_image_url,is_active').eq('id',id).single();if(error)throw error;if(!p||!p.is_active)throw new Error('This product is no longer available.');root.className='card';root.innerHTML=`<div class="image" style="background-image:url('${String(p.main_image_url||'images/shop-1.jpg').replace(/'/g,"%27")}')"></div><section class="details"><span class="tag">Shop Camzon Product</span><h1>${safe(p.name)}</h1><div class="description">${safe(p.description||'No product description is available.')}</div><div class="price">${App.formatCurrency(p.price,'USD')}</div><div class="stock">${Number(p.stock)>0?Number(p.stock)+' item(s) available':'Currently out of stock'}</div><div class="qty"><button id="minus">−</button><span id="quantity">1</span><button id="plus">+</button></div><div class="actions"><button class="cart" id="add">Add to cart</button><button class="buy" id="buy">Buy now</button></div><div class="message" id="message"></div></section>`;let q=1;const quantity=document.getElementById('quantity');document.getElementById('minus').onclick=()=>{q=Math.max(1,q-1);quantity.textContent=q};document.getElementById('plus').onclick=()=>{if(Number(p.stock)>0&&q<Number(p.stock))q++;quantity.textContent=q};const show=t=>{const m=document.getElementById('message');m.textContent=t;m.style.display='block'};document.getElementById('add').onclick=()=>{const cart=JSON.parse(localStorage.getItem('shopcamzon_cart')||'[]'),found=cart.find(x=>x.id===p.id);if(found)found.quantity+=q;else cart.push({id:p.id,name:p.name,price:Number(p.price),image:p.main_image_url||'images/shop-1.jpg',quantity:q});localStorage.setItem('shopcamzon_cart',JSON.stringify(cart));show('Added '+q+' item(s) to your cart.')};document.getElementById('buy').onclick=()=>{document.getElementById('add').click();location.href='cart.html'}}catch(e){root.className='error';root.textContent='Unable to load product: '+e.message}}function safe(v){return String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</script></body></html>
