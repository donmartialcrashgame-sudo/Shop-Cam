<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#d71920"><title>My Orders | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f8;color:#171717}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:linear-gradient(180deg,#080808aa,#080808dd),url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=900&q=85') center/cover;color:#fff;position:fixed;inset:0 auto 0 0;padding:25px 16px;z-index:10;box-shadow:5px 0 25px #0002}.logo{display:block;color:#fff;text-decoration:none;font-size:25px;font-weight:800;padding:0 12px 28px}.logo span{color:#d71920}.label{font-size:9px;color:#fff;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:10px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav a{color:#fff;text-shadow:0 1px 3px #000;text-decoration:none;padding:12px;border-radius:8px;font-size:13px;font-weight:600;display:flex;gap:11px;align-items:center}.nav a:hover,.nav a.active{background:#d71920;text-shadow:none}.icon{width:20px;text-align:center}.bottom{position:absolute;left:16px;right:16px;bottom:22px}.signout{width:100%;padding:11px;border:1px solid #fff8;border-radius:8px;background:#000a;color:#fff;font-size:12px;font-weight:700;cursor:pointer}.main{margin-left:250px;width:calc(100% - 250px);min-height:100vh}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 35px}.header h1{font-size:18px;margin:0}.email{font-size:12px;color:#777}.content{width:min(1100px,100%);margin:auto;padding:35px}.intro h2{font-size:28px;margin:0 0 8px}.intro p{color:#777;font-size:13px;margin:0 0 25px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{border:1px solid #ddd;background:#fff;border-radius:7px;padding:10px 15px;font-size:11px;color:#666}.tab.active{background:#171717;color:#fff;border-color:#171717}.orders{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden}.order-head{padding:18px 20px;border-bottom:1px solid #eee;font-size:13px;font-weight:800}.empty{padding:70px 20px;text-align:center;color:#888;font-size:13px}.empty-icon{font-size:35px;margin-bottom:12px;color:#bbb}.shop{display:inline-block;margin-top:16px;background:#d71920;color:#fff;text-decoration:none;padding:11px 18px;border-radius:7px;font-size:12px;font-weight:700}.mobile{display:none;border:0;background:none;font-size:22px;cursor:pointer}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.header{padding:0 18px}.mobile{display:block}.email{display:none}.content{padding:22px 15px}.intro h2{font-size:25px}}</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><a class="logo" href="index.html"><span>Shop</span> Camzon</a><div class="label">Account</div><nav class="nav"><a href="dashboard.html"><span class="icon">⌂</span>Home</a><a class="active" href="orders.html"><span class="icon">▣</span>My Orders</a><a href="saved.html"><span class="icon">♡</span>Saved Items</a><a href="profile.html"><span class="icon">♙</span>Profile</a><a href="settings.html"><span class="icon">⚙</span>Settings</a></nav><div class="label">Store</div><nav class="nav"><a href="index.html"><span class="icon">🛍</span>Shop</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside><section class="main"><header class="header"><button class="mobile" id="menu">☰</button><h1>My Orders</h1><span class="email" id="email">Loading...</span></header><main class="content"><section class="intro"><h2>My Orders</h2><p>Track your Shop Camzon purchases and order history.</p></section><div class="tabs"><button class="tab active">All Orders</button><button class="tab">Pending</button><button class="tab">Delivered</button></div><section class="orders"><div class="order-head">Order history</div><div class="empty"><div class="empty-icon">▣</div><div>You don't have any orders yet.</div><a class="shop" href="index.html">Start shopping →</a></div></section></main></section></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://xgxmnhqdxhvguoplbpjv.supabase.co','REPLACE_WITH_YOUR_SUPABASE_PUBLISHABLE_KEY');const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='login.html'}else document.getElementById('email').textContent=session.user.email||'';document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();location.href='login.html'});document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));supabase.auth.onAuthStateChange((_event,s)=>{if(!s)location.href='login.html'});</script></body></html>
