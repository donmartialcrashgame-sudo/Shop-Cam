<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>My Orders | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f8;color:#171717}.app{min-height:100vh;display:flex}.slider{position:absolute;inset:0;overflow:hidden}.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}.slide.active{opacity:1}.shade{position:absolute;inset:0;background:#0009}.dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}.dot{width:6px;height:6px;border-radius:50%;background:#ffffff66}.dot.active{background:#d71920;width:18px;border-radius:5px}.sidebar{width:250px;background:#111;color:#fff;position:fixed;inset:0 auto 0 0;padding:25px 16px;z-index:10;box-shadow:5px 0 25px #0002;overflow:hidden}.sidebar>*:not(.slider):not(.shade):not(.dots){position:relative;z-index:4}.logo{display:block;color:#fff;text-decoration:none;font-size:25px;font-weight:800;padding:0 12px 28px}.logo span{color:#d71920}.label{font-size:9px;color:#fff;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:10px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav a{color:#fff;text-shadow:0 1px 3px #000;text-decoration:none;padding:12px;border-radius:8px;font-size:13px;font-weight:600;display:flex;gap:11px;align-items:center}.nav a:hover,.nav a.active{background:#d71920;text-shadow:none}.icon{width:20px;text-align:center}.bottom{position:absolute;left:16px;right:16px;bottom:22px}.signout{width:100%;padding:11px;border:1px solid #fff8;border-radius:8px;background:#0009;color:#fff;font-size:12px;font-weight:700;cursor:pointer}.main{margin-left:250px;width:calc(100% - 250px);min-height:100vh}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 35px}.header h1{font-size:18px;margin:0}.header-right{display:flex;align-items:center;gap:8px}.header-btn{position:relative;width:40px;height:40px;border:1px solid #eee;background:#fff;border-radius:9px;display:grid;place-items:center;color:#333;text-decoration:none;font-size:18px}.badge{position:absolute;right:5px;top:4px;min-width:15px;height:15px;padding:0 4px;border-radius:10px;background:#d71920;color:#fff;font-size:8px;font-weight:800;display:grid;place-items:center}.email{font-size:12px;color:#777;margin-left:7px}.content{width:min(1100px,100%);margin:auto;padding:35px}.intro h2{font-size:28px;margin:0 0 8px}.intro p{color:#777;font-size:13px;margin:0 0 25px}.orders{display:grid;gap:13px}.order{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px}.order-head{display:flex;justify-content:space-between;gap:10px}.order-no{font-size:13px;font-weight:900}.date{font-size:10px;color:#888;margin-top:4px}.status{padding:7px 10px;border-radius:20px;background:#fff3d0;font-size:9px;font-weight:800;text-transform:capitalize;height:max-content}.items{margin:14px 0;border-top:1px solid #eee}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.item img{width:50px;height:50px;border-radius:8px;object-fit:cover;background:#eee}.item-main{flex:1}.item-main b{font-size:11px}.item-main small{display:block;color:#888;font-size:9px;margin-top:4px}.price{font-size:10px;font-weight:800}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}.total{font-size:15px;font-weight:900}.actions{display:flex;gap:7px}.btn{border:0;border-radius:8px;padding:10px 12px;font-size:10px;font-weight:800;text-decoration:none;cursor:pointer}.details{background:#171717;color:#fff}.receipt{background:#eee;color:#171717}.empty{background:#fff;padding:70px 20px;text-align:center;border-radius:14px;color:#888;font-size:13px}.shop{display:inline-block;margin-top:16px;background:#d71920;color:#fff;text-decoration:none;padding:11px 18px;border-radius:7px;font-size:12px;font-weight:700}.mobile{display:none;border:0;background:none;font-size:22px;cursor:pointer}.error{background:#fff0f0;color:#b71920;border-radius:10px;padding:14px;font-size:11px}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.header{padding:0 18px}.mobile{display:block}.email{display:none}.content{padding:22px 15px}.foot{align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{flex:1;text-align:center}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="slider"><div class="slide active" style="background-image:url('images/shop-1.jpg')"></div><div class="slide" style="background-image:url('images/shop-2.jpg')"></div><div class="slide" style="background-image:url('images/shop-3.jpg')"></div></div><div class="shade"></div><div class="dots"><i class="dot active"></i><i class="dot"></i><i class="dot"></i></div><a class="logo" href="index.html"><span>Shop</span> Camzon</a><div class="label">Account</div><nav class="nav"><a href="dashboard.html"><span class="icon">⌂</span>Home</a><a href="cart.html"><span class="icon">🛒</span>Cart</a><a class="active" href="orders.html"><span class="icon">▣</span>My Orders</a><a href="saved.html"><span class="icon">♡</span>Saved Items</a><a href="profile.html"><span class="icon">♙</span>Profile</a><a href="notifications.html"><span class="icon">🔔</span>Notifications</a><a href="settings.html"><span class="icon">⚙</span>Settings</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside><section class="main"><header class="header"><button class="mobile" id="menu">☰</button><h1>My Orders</h1><div class="header-right"><a class="header-btn" href="cart.html">🛒</a><a class="header-btn" href="notifications.html">🔔</a><span class="email" id="email">Loading...</span></div></header><main class="content"><section class="intro"><h2>Order History</h2><p>View your purchases, receipts and complete order details.</p></section><div id="message"></div><section class="orders" id="orders"></section></main></section></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://xgxmnhqdxhvguoplbpjv.supabase.co','REPLACE_WITH_YOUR_SUPABASE_PUBLISHABLE_KEY');const msg=document.getElementById('message'),box=document.getElementById('orders'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),symbols={USD:'$',NGN:'₦',CFA:'FCFA '},money=(n,c)=>symbols[c]+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='login.html'}else{document.getElementById('email').textContent=session.user.email||'';try{const{data:orders,error}=await supabase.from('orders').select('*').eq('user_id',session.user.id).order('created_at',{ascending:false});if(error)throw error;if(!orders?.length){box.innerHTML='<div class="empty">You don\'t have any orders yet.<br><a class="shop" href="index.html">Start shopping →</a></div>'}else{const{data:items,error:ie}=await supabase.from('order_items').select('*').in('order_id',orders.map(o=>o.id));if(ie)throw ie;box.innerHTML=orders.map(o=>{const its=(items||[]).filter(x=>x.order_id===o.id);return `<article class="order"><div class="order-head"><div><div class="order-no">${esc(o.order_number||o.id)}</div><div class="date">${new Date(o.created_at).toLocaleString()}</div></div><span class="status">${esc(o.status||'pending').replaceAll('_',' ')}</span></div><div class="items">${its.map(x=>`<div class="item"><img src="${esc(x.image_url||'images/shop-1.jpg')}" onerror="this.src='images/shop-1.jpg'"><div class="item-main"><b>${esc(x.product_name)}</b><small>Qty ${Number(x.quantity||1)} × ${money(x.unit_price,o.currency)}</small></div><span class="price">${money(x.total_price,o.currency)}</span></div>`).join('')}</div><div class="foot"><span class="total">${money(o.total,o.currency)}</span><div class="actions"><a class="btn receipt" href="receipt.html?id=${encodeURIComponent(o.id)}">View Receipt</a><a class="btn details" href="order-details.html?id=${encodeURIComponent(o.id)}">View Details</a></div></div></article>`}).join('')}}catch(e){msg.innerHTML='<div class="error">Unable to load order history: '+esc(e.message)+'</div>'}}}document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.querySelectorAll('.sidebar .slider').forEach(s=>{const a=[...s.querySelectorAll('.slide')],d=[...s.parentElement.querySelectorAll('.dot')];let i=0;setInterval(()=>{a[i].classList.remove('active');d[i]?.classList.remove('active');i=(i+1)%a.length;a[i].classList.add('active');d[i]?.classList.add('active')},4500)});supabase.auth.onAuthStateChange((_e,s)=>{if(!s)location.href='login.html'});</script></body></html>
