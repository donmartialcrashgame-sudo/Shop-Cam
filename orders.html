<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#171717;font-family:Arial,sans-serif}main{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:30}.menu{display:none;border:0;background:#fff;font-size:23px;margin-right:12px}.title{font-size:18px;font-weight:800}.right{margin-left:auto;display:flex;gap:8px}.iconbtn{width:40px;height:40px;border:1px solid #eee;border-radius:9px;background:#fff;text-decoration:none;color:#222;display:grid;place-items:center}.content{width:min(1050px,100%);margin:auto;padding:28px 20px}.hero{background:#171717;color:#fff;border-radius:16px;padding:25px;margin-bottom:17px}.hero h1{margin:0;font-size:25px}.hero p{margin:7px 0 0;color:#bbb;font-size:11px}.loading,.empty,.error{background:#fff;border-radius:14px;padding:55px 20px;text-align:center}.loading{color:#888}.empty{border:1px dashed #ddd;color:#888}.error{color:#b71920}.order{background:#fff;border:1px solid #e8e8e8;border-radius:15px;padding:19px;margin-bottom:13px}.head{display:flex;justify-content:space-between;gap:10px}.number{font-size:13px;font-weight:900}.date{font-size:9px;color:#888;margin-top:5px}.status{font-size:9px;font-weight:800;padding:7px 10px;border-radius:20px;background:#fff3d0;text-transform:capitalize}.status.delivered{background:#e8f6ec;color:#137333}.status.cancelled{background:#ffe9e9;color:#b71920}.items{border-top:1px solid #eee;margin-top:14px}.item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #eee;align-items:center}.item:last-child{border-bottom:0}.item img{width:58px;height:58px;border-radius:9px;object-fit:cover;background:#eee}.itemmain{flex:1}.itemmain b{font-size:11px}.itemmain small{display:block;color:#888;font-size:9px;margin-top:4px}.itemprice{font-size:10px;font-weight:800}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eee;padding-top:15px}.total{font-size:16px;font-weight:900}.actions{display:flex;gap:7px}.btn{border:0;border-radius:8px;padding:10px 12px;font-size:9px;font-weight:800;text-decoration:none;cursor:pointer}.receipt{background:#eee;color:#171717}.details{background:#171717;color:#fff}@media(max-width:700px){.top{padding:0 14px}.menu{display:block}.content{padding:18px 13px}.head,.footer{align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{flex:1;text-align:center}.item img{width:50px;height:50px}}
</style></head><body><main><header class="top"><button class="menu" id="menu">☰</button><div class="title">My Orders</div><div class="right"><a class="iconbtn" href="cart.html">🛒</a><a class="iconbtn" href="notifications.html">🔔</a></div></header><div class="content"><section class="hero"><h1>Order History</h1><p>Every purchase you make on Shop Camzon stays here with its receipt and full details.</p></section><div id="state" class="loading">Loading your orders...</div><div id="orders"></div></div></main><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const user=session.user,$=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const currency=localStorage.getItem('shopcamzon_currency')||'USD';const rates={USD:1,NGN:1500,XAF:560},symbols={USD:'$',NGN:'₦',XAF:'FCFA '};const money=v=>symbols[currency]+(Number(v||0)*rates[currency]).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});async function load(){try{const{data:orders,error}=await supabase.from('orders').select('id,order_number,status,payment_status,payment_method,subtotal,delivery_fee,discount,total,created_at').eq('user_id',user.id).order('created_at',{ascending:false});if(error)throw error;if(!orders?.length){$('state').className='empty';$('state').innerHTML='📦<br><br>You have no past orders yet.<br><a href="dashboard.html" style="display:inline-block;margin-top:14px;background:#d71920;color:#fff;text-decoration:none;padding:11px 16px;border-radius:8px;font-size:10px;font-weight:800">Start Shopping</a>';return}const ids=orders.map(o=>o.id);const{data:items,error:itemError}=await supabase.from('order_items').select('id,order_id,product_id,product_name,quantity,unit_price,total_price').in('order_id',ids);if(itemError)throw itemError;const productIds=[...(new Set((items||[]).map(x=>x.product_id).filter(Boolean)))];let products=[];if(productIds.length){const p=await supabase.from('products').select('id,main_image_url').in('id',productIds);if(!p.error)products=p.data||[]}const imageMap=new Map(products.map(p=>[p.id,p.main_image_url]));$('state').remove();$('orders').innerHTML=orders.map(o=>{const its=(items||[]).filter(x=>x.order_id===o.id);const status=String(o.status||'pending').toLowerCase();return `<article class="order"><div class="head"><div><div class="number">${safe(o.order_number)}</div><div class="date">${new Date(o.created_at).toLocaleString()}</div></div><span class="status ${status}">${safe(status)}</span></div><div class="items">${its.length?its.map(x=>`<div class="item"><img src="${safe(imageMap.get(x.product_id)||'images/shop-1.jpg')}" alt="${safe(x.product_name)}" onerror="this.onerror=null;this.src='images/shop-1.jpg'"><div class="itemmain"><b>${safe(x.product_name)}</b><small>Quantity: ${Number(x.quantity||1)} × ${money(x.unit_price)}</small></div><span class="itemprice">${money(x.total_price)}</span></div>`).join(''):'<div style="padding:18px 0;color:#888;font-size:10px">No items were found for this order.</div>'}</div><div class="footer"><span class="total">${money(o.total)}</span><div class="actions"><a class="btn receipt" href="receipt.html?id=${encodeURIComponent(o.id)}">View Receipt</a><a class="btn details" href="order-details.html?id=${encodeURIComponent(o.id)}">View Details</a></div></div></article>`}).join('')}catch(e){$('state').className='error';$('state').innerHTML='<b>Unable to load your orders.</b><br><small>'+safe(e.message)+'</small><br><br><button id="retry" style="border:0;background:#d71920;color:#fff;border-radius:8px;padding:10px 15px;font-weight:800">Try Again</button>';$('retry').onclick=load}}load();</script></body></html>
