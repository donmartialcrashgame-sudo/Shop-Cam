<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Care | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6f8;color:#171717}.page{max-width:900px;margin:auto;padding:25px 16px}.chat{background:#fff;border:1px solid #eee;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #00000010}.head{background:#d71920;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}.head .icon{width:44px;height:44px;border-radius:50%;background:#fff2;display:grid;place-items:center;font-size:21px}.head b{font-size:16px}.head small{display:block;margin-top:4px;color:#ffe5e5}.messages{height:58vh;min-height:420px;padding:20px;background:#fafafa;overflow:auto}.bubble{max-width:75%;padding:12px 14px;border-radius:16px;margin:9px 0;font-size:12px;line-height:1.5;box-shadow:0 3px 12px #00000008}.agent{background:#fff;border:1px solid #eee;border-bottom-left-radius:4px}.me{background:#d71920;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.meta{display:block;font-size:8px;margin-top:5px;opacity:.68}.bubble a{color:inherit}.bubble img{max-width:230px;border-radius:10px;margin-top:5px;display:block}.bubble audio{max-width:230px}.composer{display:flex;gap:7px;padding:12px;border-top:1px solid #eee;align-items:center}.composer input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:12px;outline:none}.tool,.send{width:44px;height:44px;border:0;border-radius:12px;cursor:pointer;font-size:19px}.tool{background:#f1f1f1}.send{background:#d71920;color:#fff}.recording{background:#171717;color:#fff}.empty{text-align:center;color:#999;padding:70px 20px;font-size:12px}.error{text-align:center;color:#b00008;padding:20px;font-size:12px}.file-name{padding:7px 12px;background:#fff4f4;color:#b9151b;font-size:9px;display:none}.skeleton{display:flex;gap:9px;flex-direction:column}.sk{height:55px;border-radius:14px;background:#eee;position:relative;overflow:hidden}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:sh 1.3s infinite}@keyframes sh{100%{transform:translateX(100%)}}@media(max-width:600px){.page{padding:65px 9px 12px}.messages{height:57vh;min-height:350px}.bubble{max-width:88%}.composer{gap:5px}.tool,.send{width:42px;height:42px}.composer input{min-width:0}}</style></head><body><main class="page"><section class="chat"><header class="head"><div class="icon">💬</div><div><b>Shop Camzon Customer Care</b><small id="presence">● Connecting...</small></div></header><div class="messages" id="messages"><div class="skeleton"><div class="sk"></div><div class="sk" style="width:75%"></div><div class="sk" style="width:55%;align-self:flex-end"></div></div></div><div class="file-name" id="fileName"></div><form class="composer" id="form"><input id="input" placeholder="Write a message..." maxlength="2000" autocomplete="off"><button type="button" class="tool" id="attach" title="Attach file">📎</button><button type="button" class="tool" id="voice" title="Voice note">🎙️</button><button class="send" id="send" title="Send">➤</button></form><input id="file" type="file" hidden accept="image/*,application/pdf,.doc,.docx,.txt,.zip"></section></main><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const messages=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),attach=document.getElementById('attach'),voice=document.getElementById('voice'),file=document.getElementById('file'),fileName=document.getElementById('fileName'),presence=document.getElementById('presence');let user,conversation,selectedFile=null,recorder=null,chunks=[],recordStarted=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const tm=v=>new Date(v).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});function bubble(m){const d=document.createElement('div');d.className='bubble '+(m.sender_id===user.id?'me':'agent');d.dataset.id=m.id;let body=m.message?`<div>${esc(m.message)}</div>`:'';if(m.attachment_url){if((m.mime_type||'').startsWith('image/'))body+=`<img src="${esc(m.attachment_url)}" alt="Attachment">`;else if(m.message_type==='voice')body+=`<audio controls src="${esc(m.attachment_url)}"></audio>`;else body+=`<a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">📎 ${esc(m.attachment_name||'Attachment')}</a>`}d.innerHTML=body+`<span class="meta">${m.sender_id===user.id?'You':'Shop Camzon Support'} · ${tm(m.created_at)}</span>`;return d}function render(list){messages.innerHTML='';if(!list.length)messages.innerHTML='<div class="empty">💬 No messages yet. How can we help?</div>';else list.forEach(m=>messages.appendChild(bubble(m)));messages.scrollTop=messages.scrollHeight}async function reload(){const{data,error}=await supabase.from('support_messages').select('*').eq('conversation_id',conversation.id).order('created_at',{ascending:true});if(error)throw error;render(data||[])}async function uploadAndSend(blob,name,type,kind,durationSeconds=null){const safeName=(name||'attachment').replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${user.id}/${conversation.id}/${Date.now()}-${crypto.randomUUID()}-${safeName}`;const{error:ue}=await supabase.storage.from('support-attachments').upload(path,blob,{contentType:type||'application/octet-stream',upsert:false});if(ue)throw ue;const{data:su,error:se}=await supabase.storage.from('support-attachments').createSignedUrl(path,60*60*24*7);if(se||!su?.signedUrl)throw se||new Error('Could not create attachment URL');const payload={conversation_id:conversation.id,sender_id:user.id,sender_type:'customer',message:'',message_type:kind,attachment_url:su.signedUrl,attachment_name:name||safeName,mime_type:type||'application/octet-stream'};if(kind==='voice'&&Number.isFinite(durationSeconds)&&durationSeconds>=0)payload.duration_seconds=Math.round(durationSeconds);const{error}=await supabase.from('support_messages').insert(payload);if(error)throw error}async function init(){const s=await App.requireAuth();if(!s)return;user=s.user;const{data:c,error:ce}=await supabase.from('support_conversations').select('*').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(ce)throw ce;if(c)conversation=c;else{const{data:n,error}=await supabase.from('support_conversations').insert({user_id:user.id,status:'open',category:'General Support'}).select().single();if(error)throw error;conversation=n}await reload();presence.textContent='● Support is live';supabase.channel('support-chat-'+conversation.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+conversation.id},p=>{if(!messages.querySelector(`[data-id="${p.new.id}"]`)){messages.querySelector('.empty')?.remove();messages.appendChild(bubble(p.new));messages.scrollTop=messages.scrollHeight}}).subscribe(st=>{presence.textContent=st==='SUBSCRIBED'?'● Support is live':'● Reconnecting...'});form.onsubmit=async e=>{e.preventDefault();if(selectedFile){send.disabled=true;try{await uploadAndSend(selectedFile,selectedFile.name,selectedFile.type,'file');selectedFile=null;file.value='';fileName.style.display='none';await reload()}catch(x){alert('Unable to attach file: '+x.message)}finally{send.disabled=false}return}const text=input.value.trim();if(!text)return;send.disabled=true;try{const{error}=await supabase.from('support_messages').insert({conversation_id:conversation.id,sender_id:user.id,sender_type:'customer',message:text,message_type:'text'});if(error)throw error;input.value='';await reload()}catch(x){alert('Unable to send message: '+x.message)}finally{send.disabled=false}};attach.onclick=()=>file.click();file.onchange=()=>{selectedFile=file.files[0]||null;if(selectedFile){fileName.textContent='📎 '+selectedFile.name;fileName.style.display='block'}};voice.onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();voice.classList.remove('recording');voice.textContent='🎙️';voice.disabled=true;return}if(!navigator.mediaDevices?.getUserMedia){alert('Voice recording is not supported on this device/browser.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recordStarted=Date.now();const options=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{};recorder=new MediaRecorder(stream,options);const current=recorder;recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());voice.disabled=false;const duration=(Date.now()-recordStarted)/1000;const mime=current.mimeType||'audio/webm';const blob=new Blob(chunks,{type:mime});chunks=[];try{send.disabled=true;await uploadAndSend(blob,'voice-note.webm',mime,'voice',duration);await reload()}catch(x){alert('Unable to send voice note: '+x.message)}finally{send.disabled=false;recorder=null}};recorder.start();voice.classList.add('recording');voice.textContent='⏹️'}catch(x){alert('Microphone permission is required for voice notes.')}}}init().catch(e=>{messages.innerHTML='<div class="error">Unable to connect to customer care: '+esc(e.message)+'</div>';presence.textContent='● Offline'});</script></body></html>
