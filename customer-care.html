<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Care | Shop Camzon</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f6f8;color:#171717}.page{max-width:900px;margin:auto;padding:28px 16px}.chat{background:#fff;border:1px solid #eee;border-radius:22px;overflow:hidden;box-shadow:0 15px 50px #0000000b}.head{background:#d71920;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}.head .icon{width:42px;height:42px;border-radius:50%;background:#fff2;display:grid;place-items:center;font-size:20px}.head b{font-size:16px}.head small{display:block;margin-top:5px;color:#ffe4e4}.messages{height:500px;padding:20px;background:#fafafa;overflow:auto}.bubble{max-width:76%;padding:11px 14px;border-radius:16px;margin:10px 0;font-size:12px;line-height:1.5;box-shadow:0 3px 12px #00000008}.agent{background:#fff;border:1px solid #eee}.me{background:#d71920;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.agent{border-bottom-left-radius:4px}.meta{display:block;font-size:8px;margin-top:5px;opacity:.65}.composer{display:flex;gap:8px;padding:13px;border-top:1px solid #eee;background:#fff}.composer input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:12px;outline:none}.composer input:focus{border-color:#d71920}.composer button{width:48px;height:46px;border:0;background:#d71920;color:#fff;border-radius:12px;font-size:18px;cursor:pointer}.composer button:disabled{opacity:.5}.empty{text-align:center;color:#999;padding:60px 20px;font-size:12px}.error{text-align:center;color:#b00008;padding:20px;font-size:12px}@media(max-width:600px){.page{padding:70px 10px 15px}.messages{height:58vh}.bubble{max-width:86%}}</style></head><body><main class="page"><section class="chat"><header class="head"><div class="icon">💬</div><div><b>Shop Camzon Customer Care</b><small id="presence">● Connecting to support...</small></div></header><div class="messages" id="messages"><div class="empty">Connecting to your support conversation...</div></div><form class="composer" id="form"><input id="input" placeholder="Type your message..." autocomplete="off" maxlength="2000"><button id="send" title="Send">➤</button></form></section></main><script type="module">import{supabase}from'./js/supabase.js';const messages=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),presence=document.getElementById('presence');let user,conversation;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const time=v=>new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});function render(list){messages.innerHTML='';if(!list.length){messages.innerHTML='<div class="empty">💬 No messages yet. Tell us how we can help.</div>';return}list.forEach(m=>{const d=document.createElement('div');d.className='bubble '+(m.sender_id===user.id?'me':'agent');d.innerHTML=esc(m.message)+'<span class="meta">'+(m.sender_id===user.id?'You':'Shop Camzon Support')+' · '+time(m.created_at)+'</span>';messages.appendChild(d)});messages.scrollTop=messages.scrollHeight}async function init(){const{data:{session},error:se}=await supabase.auth.getSession();if(se||!session){location.href='login.html';return}user=session.user;const{data:c,error:ce}=await supabase.from('support_conversations').select('id,status,created_at,updated_at').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(ce)throw ce;if(c)conversation=c;else{const{data:n,error:ne}=await supabase.from('support_conversations').insert({user_id:user.id,status:'open',category:'General Support'}).select().single();if(ne)throw ne;conversation=n}const{data:list,error:me}=await supabase.from('support_messages').select('id,conversation_id,sender_id,sender_type,message,attachment_url,read_at,created_at').eq('conversation_id',conversation.id).order('created_at',{ascending:true});if(me)throw me;render(list||[]);presence.textContent='● Support is live';const channel=supabase.channel('support-chat-'+conversation.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+conversation.id},payload=>{const m=payload.new;if(m.sender_id!==user.id){const existing=[...messages.querySelectorAll('.bubble')].some(x=>x.dataset?.id===m.id);if(!existing){const d=document.createElement('div');d.className='bubble agent';d.dataset.id=m.id;d.innerHTML=esc(m.message)+'<span class="meta">Shop Camzon Support · '+time(m.created_at)+'</span>';messages.querySelector('.empty')?.remove();messages.appendChild(d);messages.scrollTop=messages.scrollHeight}}}).subscribe(status=>{if(status==='SUBSCRIBED')presence.textContent='● Support is live';else if(status==='CHANNEL_ERROR')presence.textContent='● Reconnecting...' });form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||!conversation)return;send.disabled=true;const{error}=await supabase.from('support_messages').insert({conversation_id:conversation.id,sender_id:user.id,sender_type:'customer',message:text});if(error)alert('Unable to send message: '+error.message);else{input.value='';const{data:list}=await supabase.from('support_messages').select('id,conversation_id,sender_id,sender_type,message,created_at').eq('conversation_id',conversation.id).order('created_at',{ascending:true});render(list||[])}send.disabled=false});}init().catch(e=>{messages.innerHTML='<div class="error">Unable to connect to customer care: '+esc(e.message)+'</div>';presence.textContent='● Offline'});</script></body></html>
