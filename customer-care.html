<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Customer Care | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f5f6f8;color:#171717}.page{max-width:900px;margin:auto;padding:25px 16px}.chat{background:#fff;border:1px solid #eee;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #00000010}.head{background:#d71920;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}.head .icon{width:44px;height:44px;border-radius:50%;background:#fff2;display:grid;place-items:center;font-size:21px}.head b{font-size:15px}.head small{display:block;margin-top:4px;color:#ffe5e5;font-size:9px}.head-actions{margin-left:auto;display:flex;gap:6px}.callBtn{border:0;border-radius:10px;padding:10px 11px;background:#fff;color:#d71920;font-size:9px;font-weight:950;cursor:pointer}.callBtn:disabled{opacity:.55}.resolved{background:#fff;border:1px solid #eee;border-radius:14px;padding:13px;margin:12px;font-size:10px;color:#666}.resolved b{display:block;color:#16803c;margin-bottom:5px}.newChat{border:0;border-radius:10px;background:#d71920;color:#fff;padding:9px 12px;font-size:9px;font-weight:900;margin-top:8px}.messages{height:58vh;min-height:420px;padding:20px;background:#fafafa;overflow:auto}.bubble{max-width:75%;padding:12px 14px;border-radius:16px;margin:9px 0;font-size:12px;line-height:1.5;box-shadow:0 3px 12px #00000008}.agent{background:#fff;border:1px solid #eee;border-bottom-left-radius:4px}.me{background:#d71920;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.meta{display:block;font-size:8px;margin-top:5px;opacity:.68}.bubble a{color:inherit}.bubble img{max-width:230px;border-radius:10px;margin-top:5px;display:block}.bubble audio{max-width:230px}.composer{display:flex;gap:6px;padding:12px;border-top:1px solid #eee;align-items:center}.composer input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:12px;outline:none}.tool,.send{width:43px;height:43px;border:0;border-radius:12px;cursor:pointer;font-size:18px}.tool{background:#f1f1f1}.send{background:#d71920;color:#fff}.recording{background:#171717;color:#fff}.empty{text-align:center;color:#999;padding:70px 20px;font-size:12px}.error{text-align:center;color:#b00008;padding:20px;font-size:12px}.file-name{padding:7px 12px;background:#fff4f4;color:#b9151b;font-size:9px;display:none}.skeleton{display:flex;gap:9px;flex-direction:column}.sk{height:55px;border-radius:14px;background:#eee;position:relative;overflow:hidden}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:sh 1.3s infinite}@keyframes sh{100%{transform:translateX(100%)}}.incoming{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(390px,calc(100vw - 24px));z-index:999;background:#fff;border-left:4px solid #d71920;border-radius:16px;box-shadow:0 20px 55px #0004;padding:15px;animation:drop .25s ease}.incoming strong{font-size:12px;display:block}.incoming small{display:block;color:#777;font-size:9px;margin:5px 0 12px}.incoming button{border:0;border-radius:9px;padding:10px;font-size:9px;font-weight:950;margin-right:5px}.ans{background:#16a34a;color:#fff}.rej{background:#ffe8e8;color:#b71920}@keyframes drop{from{top:0;opacity:0}to{top:16px;opacity:1}}@media(max-width:600px){.page{padding:65px 9px 12px}.messages{height:57vh;min-height:350px}.bubble{max-width:88%}.composer{gap:4px}.tool,.send{width:41px;height:41px}.composer input{min-width:0}.head-actions .callBtn{padding:9px;font-size:8px}}</style></head><body><main class="page"><section class="chat"><header class="head"><div class="icon">💬</div><div><b>Shop Camzon Customer Care</b><small id="presence">● Checking availability...</small></div><div class="head-actions"><button class="callBtn" id="callBtn" disabled>📞 Call</button></div></header><div id="resolvedBox" class="resolved" style="display:none"></div><div class="messages" id="messages"><div class="skeleton"><div class="sk"></div><div class="sk" style="width:75%"></div><div class="sk" style="width:55%;align-self:flex-end"></div></div></div><div class="file-name" id="fileName"></div><form class="composer" id="form"><input id="input" placeholder="Write a message..." maxlength="2000" autocomplete="off"><button type="button" class="tool" id="attach">📎</button><button type="button" class="tool" id="cameraBtn">📷</button><button type="button" class="tool" id="voice">🎙️</button><button class="send" id="send">➤</button></form><input id="file" type="file" hidden accept="image/*,application/pdf,.doc,.docx,.txt,.zip"></section></main><div class="incoming" id="incoming" style="display:none"></div><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';import{createVoiceCall}from'./js/voice-call.js';const messages=$('messages'),form=$('form'),input=$('input'),send=$('send'),attach=$('attach'),voice=$('voice'),file=$('file'),fileName=$('fileName'),presence=$('presence'),callBtn=$('callBtn'),resolvedBox=$('resolvedBox'),incoming=$('incoming');function $(x){return document.getElementById(x)}let user,conversation,callApi,presenceChannel,msgChannel,selectedFile=null,recorder=null,chunks=[],recordStarted=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const tm=v=>new Date(v).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});function bubble(m){const d=document.createElement('div');d.className='bubble '+(m.sender_id===user.id?'me':'agent');d.dataset.id=m.id;let body=m.message?`<div>${esc(m.message)}</div>`:'';if(m.attachment_url){if((m.mime_type||'').startsWith('image/'))body+=`<img src="${esc(m.attachment_url)}" alt="Attachment">`;else if(m.message_type==='voice')body+=`<audio controls src="${esc(m.attachment_url)}"></audio>`;else body+=`<a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">📎 ${esc(m.attachment_name||'Attachment')}</a>`}d.innerHTML=body+`<span class="meta">${m.sender_id===user.id?'You':'Shop Camzon Support'} · ${tm(m.created_at)}</span>`;return d}function render(list){messages.innerHTML='';if(!list.length)messages.innerHTML='<div class="empty">💬 No messages yet. How can we help?</div>';else list.forEach(m=>messages.appendChild(bubble(m)));messages.scrollTop=messages.scrollHeight}async function loadMessages(){const{data,error}=await supabase.from('support_messages').select('*').eq('conversation_id',conversation.id).order('created_at',{ascending:true});if(error)throw error;render(data||[])}function applyConversationState(){const resolved=conversation.status==='resolved';resolvedBox.style.display=resolved?'block':'none';resolvedBox.innerHTML=resolved?`<b>✓ Conversation resolved</b>Your Customer Care conversation was resolved on ${conversation.resolved_at?new Date(conversation.resolved_at).toLocaleString():'recently'}.<br><button class="newChat" id="newChat">Start New Conversation</button>`:'';if(resolved){form.style.display='none';callBtn.disabled=true;document.getElementById('newChat')?.addEventListener('click',newConversation)}else form.style.display='flex'}async function newConversation(){const{data,error}=await supabase.from('support_conversations').insert({user_id:user.id,status:'open',category:'General Support',call_status:'idle'}).select().single();if(error)throw error;conversation=data;await connectChat();applyConversationState()}async function connectChat(){if(msgChannel)await supabase.removeChannel(msgChannel);await loadMessages();msgChannel=supabase.channel('support-chat-'+conversation.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+conversation.id},p=>{if(!messages.querySelector(`[data-id="${p.new.id}"]`)){messages.querySelector('.empty')?.remove();messages.appendChild(bubble(p.new));messages.scrollTop=messages.scrollHeight}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'support_conversations',filter:'id=eq.'+conversation.id},p=>{conversation=p.new;applyConversationState();updateCallStatus()}).subscribe()}function updateCallStatus(){const st=conversation.call_status||'idle';if(st==='calling')presence.textContent='📞 Customer Care is calling you...';else if(st==='connected')presence.textContent='🟢 Voice call connected';else if(st==='declined')presence.textContent='⚪ Call declined';else if(st==='ended')presence.textContent='⚪ Call ended'}async function checkPresence(){const{data}=await supabase.from('support_agent_presence').select('is_online').order('updated_at',{ascending:false}).limit(1).maybeSingle();const on=!!data?.is_online;if(!conversation||conversation.status!=='resolved')callBtn.disabled=!on;presence.textContent=on?'🟢 Customer Care Online':'⚪ Customer Care Offline';presenceChannel=supabase.channel('care-presence').on('postgres_changes',{event:'*',schema:'public',table:'support_agent_presence'},p=>{const online=!!p.new?.is_online;callBtn.disabled=!online||conversation?.status==='resolved';if(conversation?.call_status==='idle'||conversation?.call_status==='ended')presence.textContent=online?'🟢 Customer Care Online':'⚪ Customer Care Offline'}).subscribe()}async function uploadAndSend(blob,name,type,kind,durationSeconds=null){if(conversation.status==='resolved')return;const safe=(name||'attachment').replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${user.id}/${conversation.id}/${Date.now()}-${crypto.randomUUID()}-${safe}`;const{error:ue}=await supabase.storage.from('support-attachments').upload(path,blob,{contentType:type||'application/octet-stream',upsert:false});if(ue)throw ue;const{data:su,error:se}=await supabase.storage.from('support-attachments').createSignedUrl(path,604800);if(se)throw se;const payload={conversation_id:conversation.id,sender_id:user.id,sender_type:'customer',message:'',message_type:kind,attachment_url:su.signedUrl,attachment_name:name||safe,mime_type:type||'application/octet-stream',duration_seconds:durationSeconds?Math.round(durationSeconds):null};const{error}=await supabase.from('support_messages').insert(payload);if(error)throw error}form.onsubmit=async e=>{e.preventDefault();if(conversation.status==='resolved')return;if(selectedFile){send.disabled=true;try{await uploadAndSend(selectedFile,selectedFile.name,selectedFile.type,'file');selectedFile=null;file.value='';fileName.style.display='none';await loadMessages()}catch(x){alert('Unable to attach file: '+x.message)}finally{send.disabled=false}return}const text=input.value.trim();if(!text)return;send.disabled=true;try{const{error}=await supabase.from('support_messages').insert({conversation_id:conversation.id,sender_id:user.id,sender_type:'customer',message:text,message_type:'text'});if(error)throw error;input.value=''}catch(x){alert('Unable to send message: '+x.message)}finally{send.disabled=false}};attach.onclick=()=>file.click();file.onchange=()=>{selectedFile=file.files?.[0]||null;if(selectedFile){fileName.textContent='📎 '+selectedFile.name;fileName.style.display='block'}};voice.onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();voice.textContent='🎙️';voice.classList.remove('recording');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recordStarted=Date.now();recorder=new MediaRecorder(stream);const r=recorder;r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:r.mimeType||'audio/webm'});try{await uploadAndSend(b,'voice-note.webm',b.type,'voice',(Date.now()-recordStarted)/1000);await loadMessages()}catch(x){alert('Unable to send voice note: '+x.message)}recorder=null};r.start();voice.textContent='⏹️';voice.classList.add('recording')}catch(x){alert('Microphone permission is required for voice notes.')}};callBtn.onclick=async()=>{if(!callApi){callApi=await createVoiceCall({role:'customer',userId:user.id,callButton:callBtn,statusEl:presence,onIncoming:handleIncoming})}try{await callApi.startCall()}catch(e){callBtn.disabled=false;alert('Unable to start voice call: '+e.message)}};function handleIncoming(d){if(d.direction!=='admin-to-customer')return;incoming.style.display='block';incoming.innerHTML=`<strong>📞 Customer Care is calling</strong><small>${esc(d.callerName||'Customer Care')} is calling you now.</small><button class="ans">✓ Answer</button><button class="rej">✕ Decline</button>`;incoming.querySelector('.ans').onclick=async()=>{incoming.style.display='none';conversation.call_status='connected';await supabase.from('support_conversations').update({call_status:'connected',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',conversation.id);await callApi.acceptCall(d.callId)};incoming.querySelector('.rej').onclick=async()=>{incoming.style.display='none';await supabase.from('support_conversations').update({call_status:'declined',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',conversation.id);callApi.rejectCall(d.callId)}}async function init(){const s=await App.requireAuth();if(!s)return;user=s.user;const{data:c,error:ce}=await supabase.from('support_conversations').select('*').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(ce)throw ce;if(c)conversation=c;else{const{data:n,error}=await supabase.from('support_conversations').insert({user_id:user.id,status:'open',category:'General Support',call_status:'idle'}).select().single();if(error)throw error;conversation=n}callApi=await createVoiceCall({role:'customer',userId:user.id,callButton:callBtn,statusEl:presence,onIncoming:handleIncoming});callBtn.onclick=async()=>{try{await callApi.startCall()}catch(e){callBtn.disabled=false;alert('Unable to start voice call: '+e.message)}};applyConversationState();await connectChat();await checkPresence();updateCallStatus()}init().catch(e=>{messages.innerHTML='<div class="error">Unable to connect to customer care: '+esc(e.message)+'</div>';presence.textContent='● Offline'});</script></body></html>
