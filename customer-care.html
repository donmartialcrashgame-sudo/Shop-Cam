<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Care | Shop Camzon</title><style>body{font-family:Arial;margin:0;background:#f6f7f9;color:#171717}.page{max-width:850px;margin:auto;padding:35px}.chat{background:#fff;border:1px solid #eee;border-radius:18px;overflow:hidden}.chat-head{background:#171717;color:#fff;padding:20px}.chat-head b{font-size:15px}.chat-head span{display:block;color:#8ee49c;font-size:10px;margin-top:6px}.messages{height:420px;padding:20px;background:#fafafa;overflow:auto}.bubble{max-width:75%;padding:11px 13px;border-radius:13px;margin:9px 0;font-size:11px;line-height:1.5}.agent{background:#fff;border:1px solid #eee}.me{background:#d71920;color:#fff;margin-left:auto}.composer{display:flex;gap:8px;padding:13px;border-top:1px solid #eee}.composer input{flex:1;border:1px solid #ddd;border-radius:9px;padding:12px}.composer button{border:0;background:#d71920;color:#fff;border-radius:9px;padding:0 18px;font-weight:800}@media(max-width:700px){.page{padding:75px 12px 20px}.messages{height:55vh}}</style></head><body><main class="page"><section class="chat"><header class="chat-head"><b>Shop Camzon Customer Care</b><span>● Support team</span></header><div class="messages" id="messages"><div class="bubble agent">Hello! Welcome to Shop Camzon. How can we help you today?</div></div><form class="composer" id="form"><input id="input" placeholder="Type your message..." autocomplete="off"><button>Send</button></form></section></main><script type="module" src="./js/app.js"></script><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('input'),m=document.getElementById('messages');if(!i.value.trim())return;const b=document.createElement('div');b.className='bubble me';b.textContent=i.value.trim();m.appendChild(b);i.value='';m.scrollTop=m.scrollHeight})</script></body></html>
