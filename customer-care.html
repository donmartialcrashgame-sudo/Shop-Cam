<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Customer Care | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f5f6f8;color:#171717}.page{max-width:900px;margin:auto;padding:25px 16px}.chat{background:#fff;border:1px solid #eee;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #00000010}.head{background:#d71920;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}.brandLogo{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:cover}.head b{font-size:15px}.head small{display:block;margin-top:4px;color:#ffe5e5;font-size:9px}.head-actions{margin-left:auto}.callBtn{border:0;border-radius:11px;padding:10px 13px;background:#fff;color:#d71920;font-size:10px;font-weight:950;cursor:pointer}.callBtn:disabled{opacity:.55;cursor:not-allowed}.resolved{background:#fff;border:1px solid #eee;border-radius:14px;padding:13px;margin:12px;font-size:10px;color:#666}.resolved b{display:block;color:#16803c;margin-bottom:5px}.newChat{border:0;border-radius:10px;background:#d71920;color:#fff;padding:9px 12px;font-size:9px;font-weight:900;margin-top:8px}.messages{height:58vh;min-height:420px;padding:20px;background:#fafafa;overflow:auto}.bubble{max-width:75%;padding:12px 14px;border-radius:16px;margin:9px 0;font-size:12px;line-height:1.5;box-shadow:0 3px 12px #00000008}.agent{background:#fff;border:1px solid #eee;border-bottom-left-radius:4px}.me{background:#d71920;color:#fff;margin-left:auto;border-bottom-right-radius:4px}.meta{display:block;font-size:8px;margin-top:5px;opacity:.68}.bubble a{color:inherit}.bubble img{max-width:230px;border-radius:10px;margin-top:5px;display:block}.bubble audio{max-width:230px}.composer{display:flex;gap:6px;padding:12px;border-top:1px solid #eee;align-items:center}.composer input{flex:1;border:1px solid #ddd;border-radius:12px;padding:13px;font-size:12px;outline:none}.tool,.send{width:43px;height:43px;border:0;border-radius:12px;cursor:pointer;font-size:18px}.tool{background:#f1f1f1}.send{background:#d71920;color:#fff}.recording{background:#171717;color:#fff}.empty{text-align:center;color:#999;padding:70px 20px;font-size:12px}.error{text-align:center;color:#b00008;padding:20px;font-size:12px}.file-name{padding:7px 12px;background:#fff4f4;color:#b9151b;font-size:9px;display:none}.skeleton{display:flex;gap:9px;flex-direction:column}.sk{height:55px;border-radius:14px;background:#eee;position:relative;overflow:hidden}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:sh 1.3s infinite}@keyframes sh{100%{transform:translateX(100%)}}.callOverlay{position:fixed;inset:0;z-index:9999;background:rgba(215,25,32,.97);display:none;align-items:center;justify-content:center;color:#fff;text-align:center}.callOverlay.show{display:flex}.callPanel{width:min(420px,92vw);display:flex;flex-direction:column;align-items:center}.callLogo{width:116px;height:116px;border-radius:50%;background:#fff;object-fit:cover;border:5px solid #ffffff55;box-shadow:0 0 0 18px #ffffff10,0 0 0 38px #ffffff08;animation:pulse 1.8s infinite}.callTitle{font-size:22px;font-weight:950;margin-top:25px}.callSub{font-size:12px;margin-top:7px;color:#ffe8e8}.callStatus{font-size:10px;margin-top:8px;color:#fff5f5;min-height:15px}.callActions{display:flex;gap:18px;margin-top:45px}.circleBtn{width:64px;height:64px;border:0;border-radius:50%;font-size:25px;cursor:pointer;box-shadow:0 8px 25px #0003}.endBtn{background:#171717;color:#fff}.answerBtn{background:#19a957;color:#fff}.declineBtn{background:#fff;color:#d71920}@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 18px #ffffff10,0 0 0 38px #ffffff08}50%{transform:scale(1.04);box-shadow:0 0 0 25px #ffffff10,0 0 0 52px #ffffff05}}@media(max-width:600px){.page{padding:65px 9px 12px}.messages{height:57vh;min-height:350px}.bubble{max-width:88%}.composer{gap:4px}.tool,.send{width:41px;height:41px}.composer input{min-width:0}}</style></head><body><main class="page"><section class="chat"><header class="head"><img class="brandLogo" src="https://shopcamzon.com/favicon.png" alt="Shop Camzon"><div><b>Shop Camzon Customer Care</b><small id="presence">● Checking availability...</small></div><div class="head-actions"><button class="callBtn" id="callBtn" disabled>📞 Call</button></div></header><div id="resolvedBox" class="resolved" style="display:none"></div><div class="messages" id="messages"><div class="skeleton"><div class="sk"></div><div class="sk" style="width:75%"></div><div class="sk" style="width:55%;align-self:flex-end"></div></div></div><div class="file-name" id="fileName"></div><form class="composer" id="form"><input id="input" placeholder="Write a message..." maxlength="2000" autocomplete="off"><button type="button" class="tool" id="attach">📎</button><button type="button" class="tool" id="cameraBtn">📷</button><button type="button" class="tool" id="voice">🎙️</button><button class="send" id="send">➤</button></form><input id="file" type="file" hidden accept="image/*,application/pdf,.doc,.docx,.txt,.zip"></section></main><div class="callOverlay" id="callOverlay"><div class="callPanel"><img class="callLogo" src="https://shopcamzon.com/favicon.png" alt="Shop Camzon"><div class="callTitle">Shop Camzon</div><div class="callSub">Customer Care</div><div class="callStatus" id="callStatus">Calling Customer Care...</div><div class="callActions"><button class="circleBtn endBtn" id="endCall" title="End call">📵</button><button class="circleBtn answerBtn" id="answerCall" title="Answer" style="display:none">✓</button><button class="circleBtn declineBtn" id="declineCall" title="Decline" style="display:none">✕</button></div></div></div><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';import{createVoiceCall}from'./js/voice-call.js';const $=x=>document.getElementById(x),messages=$('messages'),form=$('form'),input=$('input'),send=$('send'),attach=$('attach'),voice=$('voice'),file=$('file'),fileName=$('fileName'),presence=$('presence'),callBtn=$('callBtn'),resolvedBox=$('resolvedBox'),overlay=$('callOverlay'),callStatus=$('callStatus'),endCall=$('endCall'),answerCall=$('answerCall'),declineCall=$('declineCall');let user,conversation,callApi,msgChannel,presenceChannel,selectedFile=null,recorder=null,chunks=[],recordStarted=0,incomingCall=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const tm=v=>new Date(v).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});function bubble(m){const d=document.createElement('div');d.className='bubble '+(m.sender_id===user.id?'me':'agent');d.dataset.id=m.id;let body=m.message?`<div>${esc(m.message)}</div>`:'';if(m.attachment_url){if((m.mime_type||'').startsWith('image/'))body+=`<img src="${esc(m.attachment_url)}" alt="Attachment">`;else if(m.message_type==='voice')body+=`<audio controls src="${esc(m.attachment_url)}"></audio>`;else body+=`<a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">📎 ${esc(m.attachment_name||'Attachment')}</a>`}d.innerHTML=body+`<span class="meta">${m.sender_id===user.id?'You':'Shop Camzon Support'} · ${tm(m.created_at)}</span>`;return d}async function loadMessages(){const{data,error}=await supabase.from('support_messages').select('*').eq('conversation_id',conversation.id).order('created_at',{ascending:true});if(error)throw error;messages.innerHTML='';if(!data?.length)messages.innerHTML='<div class="empty">💬 No messages yet. How can we help?</div>';else data.forEach(m=>messages.appendChild(bubble(m)));messages.scrollTop=messages.scrollHeight}function applyState(){const r=conversation.status==='resolved';resolvedBox.style.display=r?'block':'none';resolvedBox.innerHTML=r?`<b>✓ Conversation resolved</b>Your conversation was resolved by Customer Care.<br><button class="newChat" id="newChat">Start New Conversation</button>`:'';form.style.display=r?'none':'flex';callBtn.disabled=r||!callApi||callBtn.dataset.online!=='1';if(r)overlay.classList.remove('show');$('newChat')?.addEventListener('click',newConversation)}async function newConversation(){const{data,error}=await supabase.from('support_conversations').insert({user_id:user.id,status:'open',category:'General Support',call_status:'idle'}).select().single();if(error)throw error;conversation=data;await connectChat();applyState()}async function connectChat(){if(msgChannel)await supabase.removeChannel(msgChannel);await loadMessages();msgChannel=supabase.channel('customer-support-'+conversation.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+conversation.id},p=>{if(!messages.querySelector(`[data-id="${p.new.id}"]`)){messages.querySelector('.empty')?.remove();messages.appendChild(bubble(p.new));messages.scrollTop=messages.scrollHeight}}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'support_conversations',filter:'id=eq.'+conversation.id},p=>{conversation=p.new;applyState();updateStatus()}).subscribe()}function updateStatus(){const s=conversation?.call_status||'idle';if(s==='calling')presence.textContent='📞 Calling Customer Care...';else if(s==='connected')presence.textContent='🟢 Voice call connected';else if(s==='declined')presence.textContent='⚪ Call declined';else if(s==='ended')presence.textContent='⚪ Call ended'}async function checkPresence(){const{data}=await supabase.from('support_agent_presence').select('is_online').order('updated_at',{ascending:false}).limit(1).maybeSingle();const on=!!data?.is_online;callBtn.dataset.online=on?'1':'0';presence.textContent=on?'🟢 Customer Care Online':'⚪ Customer Care Offline';callBtn.disabled=!on||conversation.status==='resolved';if(presenceChannel)await supabase.removeChannel(presenceChannel);presenceChannel=supabase.channel('customer-care-presence').on('postgres_changes',{event:'*',schema:'public',table:'support_agent_presence'},p=>{const online=!!p.new?.is_online;callBtn.dataset.online=online?'1':'0';if(conversation.status!=='resolved')callBtn.disabled=!online;if(!['calling','connected'].includes(conversation.call_status))presence.textContent=online?'🟢 Customer Care Online':'⚪ Customer Care Offline'}).subscribe()}function showOutgoing(){overlay.classList.add('show');callStatus.textContent='Calling Customer Care...';answerCall.style.display='none';declineCall.style.display='none';endCall.style.display='block'}function showIncoming(){overlay.classList.add('show');callStatus.textContent='Incoming call from Customer Care';answerCall.style.display='block';declineCall.style.display='block';endCall.style.display='none'}function hideCall(){overlay.classList.remove('show');answerCall.style.display='none';declineCall.style.display='none';endCall.style.display='block'}async function ensureCall(){if(callApi)return callApi;callApi=await createVoiceCall({role:'customer',userId:user.id,callButton:null,statusEl:callStatus,onIncoming:d=>{if(d.direction==='admin-to-customer'){incomingCall=d;showIncoming()}}});return callApi}callBtn.onclick=async()=>{try{await ensureCall();showOutgoing();await supabase.from('support_conversations').update({call_status:'calling',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',conversation.id);await callApi.startCall()}catch(e){hideCall();alert('Unable to start voice call: '+e.message)}};endCall.onclick=async()=>{callApi?.end();hideCall();await supabase.from('support_conversations').update({call_status:'ended',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',conversation.id)};answerCall.onclick=async()=>{if(!incomingCall)return;try{await ensureCall();await callApi.acceptCall(incomingCall.callId);incomingCall=null;callStatus.textContent='🟢 Voice call connected';endCall.style.display='block';answerCall.style.display='none';declineCall.style.display='none';await supabase.from('support_conversations').update({call_status:'connected',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',conversation.id)}catch(e){alert('Unable to answer call: '+e.message)}};declineCall.onclick=async()=>{if(incomingCall){callApi?.rejectCall(incomingCall.callId);incomingCall=null}hideCall();await supabase.from('support_conversations').update({call_status:'declined',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',conversation.id)};attach.onclick=()=>file.click();file.onchange=()=>{selectedFile=file.files?.[0]||null;if(selectedFile){fileName.textContent='📎 '+selectedFile.name;fileName.style.display='block'}};async function uploadAndSend(blob,name,type,kind,duration=null){const safe=(name||'attachment').replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${user.id}/${conversation.id}/${Date.now()}-${crypto.randomUUID()}-${safe}`;const{error:up}=await supabase.storage.from('support-attachments').upload(path,blob,{contentType:type||'application/octet-stream',upsert:false});if(up)throw up;const{data:u,error:su}=await supabase.storage.from('support-attachments').createSignedUrl(path,604800);if(su)throw su;const{error}=await supabase.from('support_messages').insert({conversation_id:conversation.id,sender_id:user.id,sender_type:'customer',message:'',message_type:kind,attachment_url:u.signedUrl,attachment_name:name,mime_type:type,duration_seconds:duration});if(error)throw error}form.onsubmit=async e=>{e.preventDefault();if(conversation.status==='resolved')return;if(selectedFile){send.disabled=true;try{await uploadAndSend(selectedFile,selectedFile.name,selectedFile.type,'file');selectedFile=null;file.value='';fileName.style.display='none';await loadMessages()}catch(x){alert('Unable to attach file: '+x.message)}finally{send.disabled=false}return}const text=input.value.trim();if(!text)return;send.disabled=true;try{const{error}=await supabase.from('support_messages').insert({conversation_id:conversation.id,sender_id:user.id,sender_type:'customer',message:text,message_type:'text'});if(error)throw error;input.value=''}catch(x){alert('Unable to send message: '+x.message)}finally{send.disabled=false}};voice.onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();voice.textContent='🎙️';voice.classList.remove('recording');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recordStarted=Date.now();recorder=new MediaRecorder(stream);const r=recorder;r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:r.mimeType||'audio/webm'});try{await uploadAndSend(b,'voice-note.webm',b.type,'voice',Math.max(1,Math.round((Date.now()-recordStarted)/1000)));await loadMessages()}catch(x){alert('Unable to send voice note: '+x.message)}recorder=null};r.start();voice.textContent='⏹️';voice.classList.add('recording')}catch(x){alert('Microphone permission is required for voice notes.')}};async function init(){const s=await App.requireAuth();if(!s)return;user=s.user;const{data:c,error}=await supabase.from('support_conversations').select('*').eq('user_id',user.id).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;if(c)conversation=c;else{const{data:n,error:ne}=await supabase.from('support_conversations').insert({user_id:user.id,status:'open',category:'General Support',call_status:'idle'}).select().single();if(ne)throw ne;conversation=n}await ensureCall();applyState();await connectChat();await checkPresence();updateStatus()}init().catch(e=>{messages.innerHTML='<div class="error">Unable to connect to customer care: '+esc(e.message)+'</div>';presence.textContent='⚪ Offline'});</script></body></html>
