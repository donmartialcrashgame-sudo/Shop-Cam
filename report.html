<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Issue | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}.page{max-width:820px;margin:auto;padding:34px 18px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:26px;box-shadow:0 10px 35px rgba(0,0,0,.04)}.head{margin-bottom:24px}.head h1{margin:0;font-size:26px}.head p{font-size:11px;color:#777;line-height:1.7;margin:8px 0 0}.field{margin:17px 0}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;background:#fff;outline:none;font:inherit;font-size:12px}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#d71920;box-shadow:0 0 0 3px rgba(215,25,32,.08)}.btn{width:100%;background:#d71920;color:#fff;border:0;border-radius:10px;padding:14px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.message{display:none;padding:12px;border-radius:9px;font-size:10px;margin-bottom:14px}.error{display:block;background:#fff0f0;color:#b71920}.success{display:block;background:#effaf2;color:#207238}.loading{text-align:center;padding:20px;color:#888;font-size:11px}.order-preview{display:none;margin-top:10px;border:1px solid #eee;border-radius:12px;padding:13px;background:#fafafa}.order-preview.show{display:block}.order-preview b{font-size:11px}.order-preview small{display:block;color:#777;font-size:9px;margin-top:5px}.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.category{border:1px solid #ddd;border-radius:10px;padding:11px;font-size:10px;cursor:pointer;background:#fff}.category.active{border-color:#d71920;background:#fff7f7}.category input{display:none}.hidden{display:none}@media(max-width:600px){.page{padding:75px 14px 25px}.card{padding:20px}.category-grid{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="card"><div class="head"><h1>Report an Issue</h1><p>Select the order you booked, tell us what happened, and choose the category that best describes the problem. Our support team can then investigate the exact order.</p></div><div id="message" class="message"></div><div id="loading" class="loading">Loading your orders...</div><div id="form" class="hidden"><div class="field"><label>SELECT ORDER</label><select id="order"><option value="">Select an order</option></select><div id="orderPreview" class="order-preview"></div><div style="font-size:9px;color:#888;margin-top:6px">Only orders belonging to your account are shown.</div></div><div class="field"><label>WHAT IS THE PROBLEM?</label><div class="category-grid" id="categories"><label class="category"><input type="radio" name="category" value="Order not delivered">Order not delivered</label><label class="category"><input type="radio" name="category" value="Delivery is late">Delivery is late</label><label class="category"><input type="radio" name="category" value="Wrong product received">Wrong product received</label><label class="category"><input type="radio" name="category" value="Item missing from order">Item missing from order</label><label class="category"><input type="radio" name="category" value="Product arrived damaged">Product arrived damaged</label><label class="category"><input type="radio" name="category" value="Product quality problem">Product quality problem</label><label class="category"><input type="radio" name="category" value="Product does not match description">Product does not match description</label><label class="category"><input type="radio" name="category" value="Product is defective">Product is defective</label><label class="category"><input type="radio" name="category" value="Payment problem">Payment problem</label><label class="category"><input type="radio" name="category" value="Payment not reflected">Payment not reflected</label><label class="category"><input type="radio" name="category" value="Wrong amount charged">Wrong amount charged</label><label class="category"><input type="radio" name="category" value="Refund problem">Refund problem</label><label class="category"><input type="radio" name="category" value="Refund not received">Refund not received</label><label class="category"><input type="radio" name="category" value="Delivery address problem">Delivery address problem</label><label class="category"><input type="radio" name="category" value="Courier / delivery agent problem">Courier / delivery agent problem</label><label class="category"><input type="radio" name="category" value="I want to cancel this order">I want to cancel this order</label><label class="category"><input type="radio" name="category" value="Missing receipt">Missing receipt</label><label class="category"><input type="radio" name="category" value="Account or order information problem">Account or order information problem</label><label class="category"><input type="radio" name="category" value="Other issue">Other issue</label></div></div><div class="field"><label>DETAILS</label><textarea id="details" placeholder="Please describe what happened..." maxlength="2000"></textarea></div><div class="field"><label>PHONE / CONTACT (OPTIONAL)</label><input id="contact" placeholder="How can our support team reach you?"></div><button class="btn" id="submit">Submit Report</button></div></section></main><script type="module">import{supabase}from'./js/supabase.js';import{App}from'./js/app.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const loading=document.getElementById('loading'),form=document.getElementById('form'),orderSelect=document.getElementById('order'),preview=document.getElementById('orderPreview'),message=document.getElementById('message'),submit=document.getElementById('submit');let orders=[];function money(n){const value=Number(n);return Number.isFinite(value)?value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'—'}function showMessage(text,type){message.textContent=text;message.className='message '+type}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}try{const{data,error}=await supabase.from('orders').select('id,order_number,status,total,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false});if(error)throw error;orders=data||[];loading.remove();form.classList.remove('hidden');if(!orders.length){orderSelect.disabled=true;submit.disabled=true;showMessage('You do not have any orders to report yet.','error')}else orders.forEach(o=>{const option=document.createElement('option');option.value=o.id;option.textContent=`${o.order_number||'Order'} · ${new Date(o.created_at).toLocaleDateString()} · ${money(o.total)}`;orderSelect.appendChild(option)})}catch(e){loading.textContent='Unable to load your orders: '+e.message;showMessage('Please refresh the page and try again.','error')}orderSelect.addEventListener('change',()=>{const o=orders.find(x=>x.id===orderSelect.value);if(!o){preview.classList.remove('show');return}preview.innerHTML=`<b>${esc(o.order_number||'Order')}</b><small>${new Date(o.created_at).toLocaleString()} · Status: ${esc(o.status||'pending')} · Total: ${money(o.total)}</small>`;preview.classList.add('show')});document.querySelectorAll('.category').forEach(label=>label.addEventListener('click',()=>{document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));label.classList.add('active')}));submit.addEventListener('click',async()=>{message.className='message';const orderId=orderSelect.value,category=document.querySelector('input[name="category"]:checked')?.value,details=document.getElementById('details').value.trim();if(!orderId)return showMessage('Please select the order you want to report.','error');if(!category)return showMessage('Please select an issue category.','error');if(!details)return showMessage('Please describe the issue before submitting.','error');submit.disabled=true;submit.textContent='Submitting...';try{const{error}=await supabase.from('order_reports').insert({order_id:orderId,user_id:session.user.id,category,details,contact_phone:document.getElementById('contact').value.trim()||null});if(error)throw error;showMessage('Your report has been submitted successfully. Our support team will review it.','success');document.getElementById('details').value='';document.getElementById('contact').value='';document.querySelectorAll('.category').forEach(x=>x.classList.remove('active'));document.querySelectorAll('input[name="category"]').forEach(x=>x.checked=false)}catch(e){showMessage('Your report could not be submitted: '+e.message,'error')}finally{submit.disabled=false;submit.textContent='Submit Report'}});</script></body></html>
