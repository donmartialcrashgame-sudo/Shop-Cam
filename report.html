<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Issue | Shop Camzon</title><style>body{font-family:Arial;margin:0;background:#f6f7f9;color:#171717}.page{max-width:750px;margin:auto;padding:40px}.card{background:#fff;border-radius:18px;padding:25px}.field{margin:14px 0}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.field textarea{min-height:130px;resize:vertical}.btn{background:#d71920;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:800;cursor:pointer}@media(max-width:700px){.page{padding:75px 18px 25px}}</style></head><body><main class="page"><section class="card"><h1>Report an Issue</h1><p style="font-size:11px;color:#777">Tell us what went wrong and our support team will review it.</p><div class="field"><label>Order number</label><input id="order" placeholder="e.g. SC-ABC123"></div><div class="field"><label>Reason</label><select id="reason"><option>Product not received</option><option>Wrong product</option><option>Damaged product</option><option>Payment problem</option><option>Delivery problem</option><option>Other</option></select></div><div class="field"><label>Details</label><textarea id="details" placeholder="Describe the issue..."></textarea></div><button class="btn" onclick="alert('Your report form is ready. Database submission will be connected with the support system.')">Submit Report</button></section></main><script type="module" src="./js/app.js"></script></body></html>
