<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}.wrap{max-width:900px;margin:auto;padding:30px 18px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.back{color:#d71920;text-decoration:none;font-size:13px;font-weight:700}.top h1{margin:0;font-size:26px}.list{display:grid;gap:12px}.notice{background:#fff;border:1px solid #e8e8e8;border-radius:13px;padding:18px;display:flex;gap:14px;align-items:flex-start;transition:.2s}.notice.unread{border-left:4px solid #d71920}.dot{width:38px;height:38px;border-radius:50%;background:#fff0f0;display:grid;place-items:center;flex:none}.body{flex:1}.body h3{margin:0 0 5px;font-size:14px}.body p{margin:0;color:#777;font-size:12px;line-height:1.6}.time{font-size:10px;color:#aaa;margin-top:8px}.actions{display:flex;gap:7px;margin-top:12px}.action,.dismiss{border:0;border-radius:7px;padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer}.action{background:#d71920;color:#fff;text-decoration:none}.dismiss{background:#f1f1f1;color:#555}@media(max-width:600px){.notice{padding:14px}.actions{flex-wrap:wrap}}</style></head><body><main class="wrap"><div class="top"><h1>Notifications</h1><a class="back" href="dashboard.html">← Dashboard</a></div><div id="list" class="list"><div class="empty">Loading notifications...</div></div></main><script type="module">import{App}from'./js/app.js';import{loadNotifications,markNotificationRead,dismissNotification,subscribeToNotifications}from'./js/notifications.js';await App.requireAuth();const list=document.getElementById('list');const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const time=s=>new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(s));async function render(){try{const items=await loadNotifications();if(!items.length){list.innerHTML='<div class="empty">You have no notifications right now.</div>';return}list.innerHTML=items.map(n=>`<article class="notice ${n.is_read?'':'unread'}" data-id="${n.id}"><div class="dot">${n.type==='order'?'▣':n.type==='promotion'?'★':'🔔'}</div><div class="body"><h3>${esc(n.title)}</h3><p>${esc(n.message)}</p><div class="time">${time(n.created_at)}</div><div class="actions">${n.action_url?`<a class="action" href="${esc(n.action_url)}" data-read="${n.id}">${esc(n.action_label||'View')}</a>`:''}<button class="dismiss" data-dismiss="${n.id}">Dismiss</button></div></div></article>`).join('');list.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=async()=>{await dismissNotification(b.dataset.dismiss);document.querySelector(`[data-id="${b.dataset.dismiss}"]`)?.remove();if(!list.children.length)list.innerHTML='<div class="empty">You have no notifications right now.</div>'});list.querySelectorAll('[data-read]').forEach(a=>a.onclick=async()=>{await markNotificationRead(a.dataset.read)});list.querySelectorAll('.notice.unread').forEach(async el=>{try{await markNotificationRead(el.dataset.id)}catch{}})}catch(e){list.innerHTML=`<div class="empty">Unable to load notifications. ${esc(e.message)}</div>`}}await render();subscribeToNotifications(()=>render());</script></body></html>
