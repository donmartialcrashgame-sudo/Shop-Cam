<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#171717;font-family:Arial,sans-serif}main{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:30}.menu{display:none;border:0;background:#fff;font-size:23px;margin-right:12px}.title{font-size:18px;font-weight:800}.right{margin-left:auto;display:flex;gap:8px}.iconbtn{width:40px;height:40px;border:1px solid #eee;border-radius:9px;background:#fff;text-decoration:none;color:#222;display:grid;place-items:center}.content{width:min(950px,100%);margin:auto;padding:28px 20px}.hero{background:#171717;color:#fff;border-radius:16px;padding:25px;margin-bottom:17px}.hero h1{margin:0;font-size:25px}.hero p{margin:7px 0 0;color:#bbb;font-size:11px}.tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.count{font-size:10px;color:#888}.clear{border:0;background:#eee;border-radius:8px;padding:9px 12px;font-size:9px;font-weight:800;cursor:pointer}.list{display:grid;gap:12px}.notification{background:#fff;border:1px solid #e8e8e8;border-radius:15px;overflow:hidden;display:grid;grid-template-columns:180px 1fr;position:relative}.notification.unread{border-left:4px solid #d71920}.image{min-height:155px;background:#eee}.image img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:18px}.type{font-size:8px;color:#d71920;font-weight:900;text-transform:uppercase;letter-spacing:1px}.body h3{font-size:15px;margin:6px 0}.body p{font-size:11px;color:#777;line-height:1.6;margin:0}.time{font-size:9px;color:#aaa;margin-top:10px}.actions{display:flex;gap:7px;margin-top:13px}.actions a,.actions button{border:0;border-radius:7px;padding:9px 12px;font-size:9px;font-weight:800;text-decoration:none;cursor:pointer}.actions a{background:#d71920;color:#fff}.actions button{background:#eee;color:#555}.loading,.empty,.error{background:#fff;border-radius:14px;padding:55px 20px;text-align:center}.loading{color:#888}.empty{border:1px dashed #ddd;color:#888}.error{color:#b71920}@media(max-width:700px){.top{padding:0 14px}.menu{display:block}.content{padding:18px 13px}.notification{grid-template-columns:1fr}.image{height:170px;min-height:0}.body{padding:15px}}
</style></head><body><main><header class="top"><button class="menu" id="menu">☰</button><div class="title">Notifications</div><div class="right"><a class="iconbtn" href="cart.html">🛒</a><a class="iconbtn" href="dashboard.html">⌂</a></div></header><div class="content"><section class="hero"><h1>Your Notifications</h1><p>Important updates, order alerts and Shop Camzon messages appear here.</p></section><div class="tools"><span class="count" id="count">Loading notifications...</span><button class="clear" id="clear">Clear dismissed</button></div><div class="list" id="list"><div class="loading">Loading notifications...</div></div></div></main><script type="module">import{App}from'./js/app.js';import{loadNotifications,getUnreadCount,markNotificationRead,dismissNotification,subscribeToNotifications}from'./js/notifications.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const user=session.user,$=id=>document.getElementById(id),safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function render(){try{const rows=await loadNotifications({limit:50,userId:user.id});const unread=await getUnreadCount(user.id);$('count').textContent=rows.length+' notification'+(rows.length===1?'':'s')+' · '+unread+' unread';if(!rows.length){$('list').innerHTML='<div class="empty">🔔<br><br>You have no notifications right now.</div>';return}$('list').innerHTML=rows.map(n=>`<article class="notification ${n.is_read?'':'unread'}"><div class="image"><img src="${safe(n.image_url||'images/shop-1.jpg')}" alt="Notification" onerror="this.onerror=null;this.src='images/shop-1.jpg'"></div><div class="body"><div class="type">${safe(n.type||'update')}</div><h3>${safe(n.title)}</h3><p>${safe(n.message)}</p><div class="time">${new Date(n.created_at).toLocaleString()}</div><div class="actions">${n.action_url?`<a href="${safe(n.action_url)}" data-read="${n.id}">${safe(n.action_label||'Take Action')}</a>`:''}<button data-dismiss="${n.id}">Dismiss</button></div></div></article>`).join('');$('list').querySelectorAll('[data-read]').forEach(a=>a.onclick=async()=>{try{await markNotificationRead(a.dataset.read,user.id)}catch(_){} });$('list').querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=async()=>{try{await dismissNotification(b.dataset.dismiss,user.id)}catch(e){App.toast(e.message,'error');return}render()})}catch(e){$('list').innerHTML='<div class="error"><b>Unable to load notifications.</b><br><small>'+safe(e.message)+'</small><br><br><button id="retry" style="border:0;background:#d71920;color:#fff;border-radius:8px;padding:10px 15px;font-weight:800">Try Again</button></div>';$('retry').onclick=render}}$('clear').onclick=async()=>{try{const rows=await loadNotifications({limit:50,userId:user.id});for(const n of rows.filter(x=>x.is_dismissed))await dismissNotification(n.id,user.id);render()}catch(_){render()}};render();try{subscribeToNotifications(()=>render(),user.id)}catch(_){} </script></body></html>
