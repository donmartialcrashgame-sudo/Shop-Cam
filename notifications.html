<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#111;color:#fff;padding:25px 16px;overflow:hidden;z-index:20}.slides,.shade{position:absolute;inset:0}.slide{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:1s}.slide.active{opacity:1}.shade{background:#000b}.sidebar>*:not(.slides):not(.shade){position:relative;z-index:2}.logo{display:block;color:#fff;text-decoration:none;font-size:25px;font-weight:800;padding:0 12px 25px}.logo span{color:#d71920}.label{font-size:9px;color:#ddd;text-transform:uppercase;letter-spacing:1.5px;padding:8px 12px}.nav{display:flex;flex-direction:column;gap:4px}.nav a{display:flex;gap:10px;color:#fff;text-decoration:none;padding:11px 12px;border-radius:8px;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#d71920}.bottom{position:absolute!important;left:16px;right:16px;bottom:22px}.signout{width:100%;padding:11px;background:#0008;color:#fff;border:1px solid #fff5;border-radius:8px;font-weight:700}.main{margin-left:250px;min-height:100vh}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 35px;position:sticky;top:0;z-index:10}.header h1{font-size:18px;margin:0}.right{margin-left:auto;display:flex;gap:8px;align-items:center}.headbtn{position:relative;width:40px;height:40px;border:1px solid #eee;border-radius:9px;background:#fff;display:grid;place-items:center;text-decoration:none}.badge{position:absolute;right:3px;top:3px;background:#d71920;color:#fff;border-radius:10px;font-size:8px;min-width:15px;height:15px;display:grid;place-items:center}.menu{display:none;border:0;background:none;font-size:22px;margin-right:15px}.content{max-width:1000px;margin:auto;padding:32px 20px}.hero{background:#111;color:#fff;border-radius:15px;padding:30px;position:relative;overflow:hidden;margin-bottom:20px}.hero-bg{position:absolute;inset:0;background:url('images/shop-2.jpg') center/cover;opacity:.22}.hero>*{position:relative}.hero h2{margin:0 0 7px;font-size:27px}.hero p{margin:0;color:#ddd;font-size:12px}.tools{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.tool{border:1px solid #ddd;background:#fff;border-radius:8px;padding:10px 13px;font-size:11px;font-weight:700;cursor:pointer}.tool.active{background:#d71920;color:#fff;border-color:#d71920}.list{display:grid;gap:13px}.notice{background:#fff;border:1px solid #e8e8e8;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:150px 1fr;transition:.2s}.notice:hover{box-shadow:0 10px 35px #0001;transform:translateY(-2px)}.notice.unread{border-left:4px solid #d71920}.notice-img{min-height:150px;background:#eee center/cover no-repeat}.body{padding:18px}.type{display:inline-block;color:#d71920;background:#fff0f0;padding:5px 8px;border-radius:15px;font-size:8px;font-weight:800;text-transform:uppercase}.body h3{margin:9px 0 5px;font-size:15px}.body p{margin:0;color:#777;font-size:12px;line-height:1.65}.time{font-size:10px;color:#aaa;margin-top:9px}.actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}.action,.dismiss{border:0;border-radius:7px;padding:9px 12px;font-size:10px;font-weight:700;cursor:pointer;text-decoration:none}.action{background:#d71920;color:#fff}.dismiss{background:#f1f1f1;color:#555}.empty{padding:60px 20px;text-align:center;background:#fff;border:1px dashed #ddd;border-radius:12px;color:#888;font-size:13px}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.main{margin-left:0}.menu{display:block}.header{padding:0 15px}.content{padding:20px 14px}.notice{grid-template-columns:1fr}.notice-img{min-height:170px}}
</style></head><body><aside class="sidebar" id="sidebar"><div class="slides"><div class="slide active" style="background-image:url('images/shop-1.jpg')"></div><div class="slide" style="background-image:url('images/shop-2.jpg')"></div><div class="slide" style="background-image:url('images/shop-3.jpg')"></div></div><div class="shade"></div><a class="logo" href="dashboard.html"><span>Shop</span> Camzon</a><div class="label">Account</div><nav class="nav"><a href="dashboard.html">⌂ Home</a><a href="cart.html">🛒 Cart</a><a href="orders.html">▣ My Orders</a><a href="saved.html">♡ Saved Items</a><a href="profile.html">♙ Profile</a><a class="active" href="notifications.html">🔔 Notifications</a><a href="settings.html">⚙ Settings</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside><main class="main"><header class="header"><button class="menu" id="menu">☰</button><h1>Notifications</h1><div class="right"><a class="headbtn" href="cart.html">🛒</a><a class="headbtn" href="notifications.html">🔔<span class="badge" id="badge">0</span></a></div></header><section class="content"><section class="hero"><div class="hero-bg"></div><h2>Stay up to date</h2><p>Orders, promotions, account updates and important Shop Camzon messages.</p></section><div class="tools"><button class="tool active" data-filter="all">All</button><button class="tool" data-filter="unread">Unread</button><button class="tool" data-filter="order">Orders</button><button class="tool" data-filter="promotion">Promotions</button><button class="tool" id="readAll">Mark all read</button></div><div id="list" class="list"><div class="empty">Loading notifications...</div></div></section></main><script type="module">import{App}from'./js/app.js';import{loadNotifications,markNotificationRead,dismissNotification,getUnreadCount,subscribeToNotifications}from'./js/notifications.js';await App.requireAuth();const list=document.getElementById('list'),badge=document.getElementById('badge');let filter='all',items=[];const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const time=s=>new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(s));async function count(){const n=await getUnreadCount();badge.textContent=n>99?'99+':n;badge.style.display=n?'grid':'none'}async function render(){try{items=await loadNotifications({limit:50});let shown=items.filter(n=>filter==='all'||filter==='unread'?!filter||filter==='all':filter==='unread'? !n.is_read:n.type===filter);if(filter==='all')shown=items;if(!shown.length){list.innerHTML='<div class="empty">No notifications found.</div>';return}list.innerHTML=shown.map(n=>`<article class="notice ${n.is_read?'':'unread'}" data-id="${n.id}"><div class="notice-img" style="background-image:url('${esc(n.image_url||'images/shop-2.jpg')}')"></div><div class="body"><span class="type">${esc(n.type||'general')}</span><h3>${esc(n.title)}</h3><p>${esc(n.message)}</p><div class="time">${time(n.created_at)}</div><div class="actions">${n.action_url?`<a class="action" href="${esc(n.action_url)}" data-read="${n.id}">${esc(n.action_label||'Take action')}</a>`:''}<button class="dismiss" data-dismiss="${n.id}">Dismiss</button></div></div></article>`).join('');list.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=async()=>{await dismissNotification(b.dataset.dismiss);render();count()});list.querySelectorAll('[data-read]').forEach(a=>a.onclick=async()=>{await markNotificationRead(a.dataset.read);count()})}catch(e){list.innerHTML='<div class="empty">Unable to load notifications. '+esc(e.message)+'</div>'}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.getElementById('readAll').onclick=async()=>{for(const n of items.filter(x=>!x.is_read))await markNotificationRead(n.id);render();count()};document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('logout').onclick=()=>App.signOut();const slides=[...document.querySelectorAll('.slide')];let i=0;setInterval(()=>{slides[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active')},4500);await render();await count();const channel=subscribeToNotifications(()=>{render();count()});window.addEventListener('beforeunload',()=>channel&&App.supabase?.removeChannel(channel));</script></body></html>
