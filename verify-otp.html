<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Verify Email | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;min-height:100vh;display:grid;place-items:center;color:#171717}.card{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #eee;border-radius:18px;padding:30px;box-shadow:0 15px 45px #0000000d}.logo{font-size:23px;font-weight:900;text-decoration:none;color:#171717}.logo span{color:#d71920}.icon{width:58px;height:58px;border-radius:50%;background:#fff0f0;display:grid;place-items:center;font-size:26px;margin:28px 0 18px}.card h1{font-size:29px;margin:0 0 8px}.sub{color:#777;font-size:12px;line-height:1.6}.email{font-weight:800;color:#171717;word-break:break-all}.otp{width:100%;height:58px;border:1px solid #ddd;border-radius:10px;text-align:center;font-size:26px;letter-spacing:10px;font-weight:900;margin:20px 0;outline:none}.otp:focus{border-color:#d71920}.verify{width:100%;height:50px;border:0;border-radius:9px;background:#d71920;color:#fff;font-weight:900;cursor:pointer}.verify:disabled{opacity:.6}.links{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.links button,.links a{border:0;background:none;color:#d71920;font-size:11px;font-weight:800;text-decoration:none;cursor:pointer}.msg{display:none;padding:11px;border-radius:8px;font-size:11px;line-height:1.5;margin-top:14px}.msg.show{display:block}.error{background:#fff0f0;color:#b9151b}.success{background:#f0fff5;color:#176b36}</style></head><body><main class="card"><a class="logo" href="index.html"><span>Shop</span> Camzon</a><div class="icon">✉️</div><h1>Verify your email</h1><p class="sub">We sent a one-time verification code to <span class="email" id="email">your email</span>. Enter the 6-digit code below to continue.</p><form id="form"><input class="otp" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required><button class="verify" id="verify" type="submit">Verify & Continue →</button></form><div class="msg" id="msg"></div><div class="links"><button id="resend" type="button">Resend OTP</button><a href="login.html">Use another email</a></div></main><script type="module">import{supabase}from'./js/supabase.js';const email=sessionStorage.getItem('shopcamzon_otp_email')||'';const mode=sessionStorage.getItem('shopcamzon_otp_mode')||'login';document.getElementById('email').textContent=email||'your email';const form=document.getElementById('form'),otp=document.getElementById('otp'),btn=document.getElementById('verify'),msg=document.getElementById('msg');function show(t,type='error'){msg.textContent=t;msg.className='msg show '+type}form.addEventListener('submit',async e=>{e.preventDefault();const token=otp.value.replace(/\D/g,'');if(token.length!==6)return show('Enter the 6-digit OTP.');btn.disabled=true;btn.textContent='Verifying...';const{data,error}=await supabase.auth.verifyOtp({email,token,type:mode==='signup'?'signup':'email'});if(error){show(error.message);btn.disabled=false;btn.textContent='Verify & Continue →';return}sessionStorage.removeItem('shopcamzon_otp_email');sessionStorage.removeItem('shopcamzon_otp_mode');if(mode==='signup'){const name=sessionStorage.getItem('shopcamzon_pending_name');if(name){await supabase.from('profiles').update({full_name:name}).eq('id',data.user.id);sessionStorage.removeItem('shopcamzon_pending_name')}}show('Verified successfully. Welcome to Shop Camzon!','success');setTimeout(()=>location.href='dashboard.html',650)});document.getElementById('resend').onclick=async()=>{if(!email)return show('No email was found. Please return to sign in.');const{error}=mode==='signup'?await supabase.auth.resend({type:'signup',email}):await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)show(error.message);else show('A new OTP has been sent to your email.','success')};</script></body></html>
