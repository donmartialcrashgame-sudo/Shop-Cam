<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Receipt | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#171717;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.receipt{width:min(620px,100%);background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 25px 70px #0002;animation:pop .45s ease both}.head{background:#d71920;color:#fff;padding:25px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px}.brand img{width:38px;height:38px;border-radius:10px;background:#fff;object-fit:contain}.title{font-size:27px;font-weight:900;margin-top:20px}.sub{font-size:11px;opacity:.9;margin-top:5px}.body{padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.label{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#999;font-weight:800}.value{font-size:12px;font-weight:800;margin-top:5px;word-break:break-word}.section{margin-top:23px}.section h3{font-size:13px;margin:0 0 8px}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.item img{width:68px;height:68px;border-radius:12px;object-fit:cover;background:#eee}.grow{flex:1}.grow b{font-size:12px}.grow small{display:block;color:#888;font-size:10px;margin-top:5px}.amount{font-weight:900;font-size:11px}.line{display:flex;justify-content:space-between;font-size:11px;margin:10px 0}.total{border-top:1px dashed #ddd;margin-top:15px;padding-top:14px;font-size:19px;font-weight:900}.status{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;font-size:9px;font-weight:900;text-transform:capitalize}.pending,.processing,.confirmed{background:#fff4d6;color:#9a6500}.shipped{background:#eaf1ff;color:#1d5dcc}.delivered{background:#e9f8ee;color:#16803c}.declined,.cancelled{background:#ffe8e8;color:#bd1d1d}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:23px}.btn{border:0;border-radius:11px;padding:13px 8px;font-weight:900;font-size:10px;cursor:pointer}.save{background:#d71920;color:#fff}.close{background:#eee}.delete{background:#fff0f0;color:#b71920}.error{text-align:center;color:#b71920;font-size:10px;margin-top:12px}.note{text-align:center;color:#999;font-size:9px;line-height:1.5;margin-top:15px}@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}@media(max-width:500px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.title{font-size:23px}}@media print{body{background:#fff}.wrap{padding:0}.receipt{box-shadow:none}.actions,.note,.error{display:none}}</style></head><body><div class="wrap"><article class="receipt"><header class="head"><div class="brand"><img src="https://shopcamzon.com/favicon.png" alt="Shop Camzon"><span>Shop Camzon</span></div><div class="title" id="heading">🧾 Order Receipt</div><div class="sub" id="subheading">Thank you for shopping with us.</div></header><main class="body"><div class="grid"><div><div class="label">Order number</div><div class="value" id="number">Loading...</div></div><div><div class="label">Order date</div><div class="value" id="date">Loading...</div></div><div><div class="label">Payment method</div><div class="value" id="payment">—</div></div><div><div class="label">Payment status</div><div class="value" id="paymentStatus">—</div></div><div><div class="label">Order status</div><div class="value"><span id="status" class="status pending">⏳ Pending</span></div></div><div><div class="label">Customer</div><div class="value" id="customer">—</div></div></div><section class="section"><h3>🛍️ Products</h3><div id="items"></div></section><section class="section"><div class="line"><span>Subtotal</span><b id="subtotal">—</b></div><div class="line"><span>Delivery</span><b id="delivery">—</b></div><div class="line"><span>Discount</span><b id="discount">—</b></div><div class="line total"><span>Total</span><b id="total">—</b></div></section><section class="section"><h3>📍 Delivery</h3><div class="value" id="deliveryInfo">—</div></section><div class="actions"><button class="btn save" id="save">💾 Save / Print</button><button class="btn close" id="close">✕ Close</button><button class="btn delete" id="delete">🗑️ Delete</button></div><div class="error" id="error"></div><div class="note">Shop Camzon receipt • Keep this receipt for your records.</div></main></article></div><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const s=await App.requireAuth();if(!s)throw Error('Not authenticated');const id=new URLSearchParams(location.search).get('id');if(!id){location.href='orders.html';throw Error('Missing order id')}const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₦'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});try{const{data:o,error}=await supabase.from('orders').select('*').eq('id',id).eq('user_id',s.user.id).single();if(error)throw error;const{data:items,error:ie}=await supabase.from('order_items').select('*').eq('order_id',id).order('created_at',{ascending:true});if(ie)throw ie;$('number').textContent=o.order_number||id;$('date').textContent=o.created_at?new Date(o.created_at).toLocaleString():'—';$('payment').textContent=String(o.payment_method||'Not specified').replaceAll('_',' ');$('paymentStatus').textContent=String(o.payment_status||'Not specified').replaceAll('_',' ');$('customer').textContent=o.delivery_name||'Customer';$('deliveryInfo').textContent=[o.delivery_name,o.delivery_phone,o.delivery_address,o.delivery_city,o.delivery_state,o.delivery_country].filter(Boolean).join(' • ')||'Not specified';$('items').innerHTML=(items||[]).map(x=>`<div class="item"><img src="${esc(x.image_url||'images/shop-1.jpg')}" onerror="this.onerror=null;this.src='images/shop-1.jpg'" alt=""><div class="grow"><b>${esc(x.product_name||'Product')}</b><small>Qty ${Number(x.quantity||0)} × ${money(x.unit_price)}</small></div><span class="amount">${money(x.total_price)}</span></div>`).join('')||'<div class="value">No products found.</div>';$('subtotal').textContent=money(o.subtotal);$('delivery').textContent=money(o.delivery_fee);$('discount').textContent='−'+money(o.discount);$('total').textContent=money(o.total);const st=String(o.status||'pending').toLowerCase().replaceAll('_',' '),cls=st.replaceAll(' ','-');$('status').textContent=st;$('status').className='status '+cls;$('heading').textContent=st==='delivered'?'🎉 Order Delivered':(st==='declined'||st==='cancelled'?'⚠️ Order Not Completed':'🧾 Order Receipt');$('subheading').textContent=st==='delivered'?'Your order has been delivered.':(st==='declined'||st==='cancelled'?'This order was declined or cancelled.':'Your order has been received and is being processed.');$('save').onclick=()=>window.print();$('close').onclick=()=>location.href='orders.html';$('delete').onclick=async()=>{if(!confirm('Delete this receipt and remove this order from your order history?'))return;const b=$('delete');b.disabled=true;try{const{error:e1}=await supabase.from('order_items').delete().eq('order_id',id);if(e1)throw e1;const{error:e2}=await supabase.from('orders').delete().eq('id',id).eq('user_id',s.user.id);if(e2)throw e2;location.href='orders.html'}catch(e){$('error').textContent='Unable to delete receipt: '+e.message;b.disabled=false}}}catch(e){$('error').textContent='Unable to load receipt: '+e.message}</script></body></html>
