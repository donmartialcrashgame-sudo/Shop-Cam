<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Inter,Arial,sans-serif;color:#171717}.overlay{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.receipt{width:min(520px,100%);background:#fff;border-radius:24px;box-shadow:0 24px 70px #0002;overflow:hidden}.head{padding:28px;background:#171717;color:#fff}.brand{font-size:20px;font-weight:900}.brand span{color:#e31b23}.ok{margin-top:22px;font-size:28px;font-weight:900}.sub{color:#bbb;font-size:12px;margin-top:6px}.body{padding:24px}.meta{display:flex;justify-content:space-between;gap:15px;padding-bottom:18px;border-bottom:1px solid #eee;font-size:11px}.meta b{display:block;font-size:13px;margin-top:5px}.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.item img{width:52px;height:52px;border-radius:9px;object-fit:cover}.item-main{flex:1}.item-main b{font-size:12px}.item-main small{display:block;color:#888;font-size:10px;margin-top:5px}.price{font-weight:800;font-size:11px}.line{display:flex;justify-content:space-between;margin:13px 0;font-size:11px}.total{font-size:19px;font-weight:900;border-top:1px solid #eee;padding-top:17px}.status{display:inline-block;padding:6px 9px;border-radius:20px;background:#fff4d6;font-size:9px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.actions button{padding:13px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.save{background:#171717;color:#fff}.close{background:#eee;color:#171717}.note{text-align:center;color:#999;font-size:9px;line-height:1.5;margin-top:16px}@media print{body{background:#fff}.overlay{padding:0}.receipt{box-shadow:none}.actions,.note{display:none}}</style></head><body><div class="overlay"><article class="receipt"><header class="head"><div class="brand"><span>Shop</span> Camzon</div><div class="ok">Order confirmed ✓</div><div class="sub">Thank you for shopping with us.</div></header><main class="body"><div class="meta"><div>ORDER NUMBER<b id="number">—</b></div><div>DATE<b id="date">—</b></div></div><div id="items"></div><div class="line"><span>Subtotal</span><b id="subtotal">—</b></div><div class="line"><span>Delivery</span><b id="delivery">—</b></div><div class="line"><span>Discount</span><b id="discount">—</b></div><div class="line total"><span>Total</span><b id="total">—</b></div><div class="line"><span>Payment</span><span id="payment">—</span></div><div class="line"><span>Status</span><span class="status" id="status">Pending</span></div><div class="actions"><button class="save" id="save">Save & Continue</button><button class="close" id="close">Close</button></div><div class="note">Keep this receipt for your records. You can view this order again from My Orders.</div></main></article></div><script type="module">import{supabase}from'./js/supabase.js';import{App}from'./js/app.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const symbols={USD:'$',NGN:'₦',CFA:'FCFA '};const money=(n,c)=>symbols[c]+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});if(!id)location.href='orders.html';const{data:o,error}=await supabase.from('orders').select('*').eq('id',id).eq('user_id',session.user.id).single();if(error)throw error;const{data:items}=await supabase.from('order_items').select('*').eq('order_id',id);document.getElementById('number').textContent=o.order_number||id;document.getElementById('date').textContent=new Date(o.created_at||Date.now()).toLocaleDateString();document.getElementById('items').innerHTML=(items||[]).map(x=>`<div class="item"><img src="${esc(x.image_url||'images/shop-1.jpg')}" onerror="this.src='images/shop-1.jpg'" alt=""><div class="item-main"><b>${esc(x.product_name)}</b><small>Qty ${Number(x.quantity||1)} × ${money(x.unit_price,o.currency)}</small></div><span class="price">${money(x.total_price,o.currency)}</span></div>`).join('');document.getElementById('subtotal').textContent=money(o.subtotal,o.currency);document.getElementById('delivery').textContent=money(o.delivery_fee,o.currency);document.getElementById('discount').textContent=money(o.discount,o.currency);document.getElementById('total').textContent=money(o.total,o.currency);document.getElementById('payment').textContent=String(o.payment_method||'').toUpperCase();document.getElementById('status').textContent=String(o.status||'pending').replaceAll('_',' ');document.getElementById('save').onclick=()=>location.href='orders.html';document.getElementById('close').onclick=()=>location.href='orders.html';</script></body></html>
