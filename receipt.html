<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Receipt | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f7;font-family:Inter,Arial,sans-serif;color:#191919}.overlay{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.receipt{width:min(560px,100%);background:#fff;border:1px solid #eee;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #0001}.head{padding:25px;background:#d71920;color:#fff}.brand{font-size:20px;font-weight:900}.ok{font-size:25px;font-weight:900;margin-top:18px}.sub{font-size:11px;opacity:.9;margin-top:5px}.body{padding:23px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:17px;border-bottom:1px solid #eee}.meta label,.section-title{display:block;color:#8a8a8a;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.meta b{display:block;font-size:12px;margin-top:5px;word-break:break-word}.items{margin-top:5px}.item{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid #eee}.item img{width:56px;height:56px;border-radius:9px;object-fit:cover;background:#eee}.item-main{flex:1}.item-main b{font-size:12px}.item-main small{display:block;color:#888;font-size:10px;margin-top:5px}.price{font-size:11px;font-weight:800}.summary{padding:16px 0;border-bottom:1px solid #eee}.line{display:flex;justify-content:space-between;gap:15px;margin:9px 0;font-size:11px}.total{font-size:18px;font-weight:900;margin-top:15px;padding-top:13px;border-top:1px dashed #ddd}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:17px 0}.detail{background:#fafafa;border-radius:10px;padding:11px}.detail span{display:block;color:#888;font-size:9px}.detail b{display:block;margin-top:4px;font-size:11px;text-transform:capitalize;word-break:break-word}.status{display:inline-flex;padding:6px 9px;border-radius:20px;background:#fff1f1;color:#c4151b;font-size:9px;font-weight:900}.status.pending,.status.processing,.status.confirmed,.status.shipped{background:#fff6df;color:#8a5b00}.status.delivered{background:#eaf9ef;color:#14753b}.status.cancelled,.status.declined{background:#fff0f0;color:#b71920}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:5px}.actions button{border:0;border-radius:9px;padding:12px 7px;font-weight:800;font-size:10px;cursor:pointer}.save{background:#d71920;color:#fff}.close{background:#eee;color:#222}.delete{background:#fff0f0;color:#b71920}.error{color:#b71920;font-size:10px;text-align:center;margin-top:12px}.note{text-align:center;color:#999;font-size:9px;line-height:1.5;margin-top:14px}@media(max-width:430px){.actions{grid-template-columns:1fr}.details{grid-template-columns:1fr}.ok{font-size:22px}}@media print{body{background:#fff}.overlay{padding:0}.receipt{box-shadow:none;border:0}.actions,.note,.error{display:none}}</style></head><body><div class="overlay"><article class="receipt"><header class="head"><div class="brand">Shop Camzon</div><div class="ok" id="heading">Order Receipt</div><div class="sub" id="subheading">Your order information</div></header><main class="body"><div class="meta"><div><label>Order number</label><b id="number">—</b></div><div><label>Order date</label><b id="date">—</b></div></div><div id="items"></div><div class="summary"><div class="line"><span>Subtotal</span><b id="subtotal">—</b></div><div class="line"><span>Delivery</span><b id="delivery">—</b></div><div class="line"><span>Discount</span><b id="discount">—</b></div><div class="line total"><span>Total</span><b id="total">—</b></div></div><div class="details"><div class="detail"><span>Payment method</span><b id="payment">Not specified</b></div><div class="detail"><span>Payment status</span><b id="paymentStatus">Not specified</b></div><div class="detail"><span>Order status</span><b id="status" class="status pending">Pending</b></div><div class="detail"><span>Customer</span><b id="customer">Not specified</b></div></div><div class="actions"><button class="save" id="save">Save / Print</button><button class="close" id="close">Close</button><button class="delete" id="delete">Delete Receipt</button></div><div class="error" id="error"></div><div class="note">Keep this receipt for your records. Order and payment status are updated from your Shop Camzon order.</div></main></article></div><script type="module">import{supabase}from'./js/supabase.js';import{App}from'./js/app.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const id=new URLSearchParams(location.search).get('id');if(!id){location.href='orders.html';throw new Error('Missing order id')}const err=document.getElementById('error'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),symbols={USD:'$',NGN:'₦',CFA:'FCFA '},money=(n,c)=>{const value=Number(n);return Number.isFinite(value)?(symbols[c]||'')+value.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):'—'};try{const{data:o,error}=await supabase.from('orders').select('*').eq('id',id).eq('user_id',session.user.id).single();if(error)throw error;const{data:items,error:itemError}=await supabase.from('order_items').select('*').eq('order_id',id);if(itemError)throw itemError;document.getElementById('number').textContent=o.order_number||id;document.getElementById('date').textContent=o.created_at?new Date(o.created_at).toLocaleString():'—';document.getElementById('items').innerHTML=(items||[]).length?(items||[]).map(x=>`<div class="item"><img src="${esc(x.image_url||'images/shop-1.jpg')}" onerror="this.src='images/shop-1.jpg'" alt=""><div class="item-main"><b>${esc(x.product_name||'Product')}</b><small>Qty ${Number(x.quantity||1)} × ${money(x.unit_price,o.currency)}</small></div><span class="price">${money(x.total_price,o.currency)}</span></div>`).join(''):'<p style="color:#888;font-size:11px">No item details available.</p>';document.getElementById('subtotal').textContent=money(o.subtotal,o.currency);document.getElementById('delivery').textContent=money(o.delivery_fee,o.currency);document.getElementById('discount').textContent=money(o.discount,o.currency);document.getElementById('total').textContent=money(o.total,o.currency);document.getElementById('payment').textContent=String(o.payment_method||'Not specified').replaceAll('_',' ');document.getElementById('paymentStatus').textContent=String(o.payment_status||'Not specified').replaceAll('_',' ');document.getElementById('customer').textContent=String(o.full_name||o.customer_name||o.email||'Customer');const status=String(o.status||'pending').toLowerCase().replaceAll('_',' '),statusEl=document.getElementById('status');statusEl.textContent=status;statusEl.className='status '+status.replaceAll(' ','-');document.getElementById('heading').textContent=status==='delivered'?'Order Delivered ✓':status==='declined'||status==='cancelled'?'Order Not Completed':'Order Receipt';document.getElementById('subheading').textContent=status==='delivered'?'Your order has been delivered.':status==='declined'||status==='cancelled'?'This order was declined or cancelled.':'Your order has been received and is being processed.';document.getElementById('save').onclick=()=>window.print();document.getElementById('close').onclick=()=>location.href='orders.html';document.getElementById('delete').onclick=async()=>{if(!confirm('Delete this receipt and remove this order from your order history? This cannot be undone.'))return;const b=document.getElementById('delete');b.disabled=true;b.textContent='Deleting...';try{const{error:ie}=await supabase.from('order_items').delete().eq('order_id',id);if(ie)throw ie;const{error:oe}=await supabase.from('orders').delete().eq('id',id).eq('user_id',session.user.id);if(oe)throw oe;location.href='orders.html'}catch(e){err.textContent='Unable to delete receipt: '+e.message;b.disabled=false;b.textContent='Delete Receipt'}}}catch(e){err.textContent='Unable to load receipt: '+e.message}</script></body></html>
