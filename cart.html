<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d71920">
<title>Cart | Shop Camzon</title>
<link rel="icon" type="image/png" href="https://shopcamzon.com/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#171717}.main{min-height:100vh;margin-left:0!important}.header{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 34px;position:sticky;top:0;z-index:10}.header h1{font-size:20px;margin:0;font-weight:800}.right{margin-left:auto;display:flex;gap:8px}.headbtn{width:42px;height:42px;border:1px solid #e8e8e8;border-radius:10px;display:grid;place-items:center;text-decoration:none;color:#222;background:#fff;font-size:17px}.content{max-width:1180px;margin:auto;padding:30px 24px 55px}.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#d71920;font-weight:900}.toolbar h2{margin:5px 0 4px;font-size:28px}.muted{color:#888;font-size:11px;line-height:1.5}.currency{display:flex;gap:7px;flex-wrap:wrap}.currency button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:10px 14px;font-size:11px;font-weight:800;cursor:pointer}.currency button.active{background:#d71920;color:#fff;border-color:#d71920}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.cart,.summary{background:#fff;border:1px solid #e9e9e9;border-radius:18px;box-shadow:0 8px 30px #00000006}.cart{padding:22px}.cart-title{display:flex;align-items:center;justify-content:space-between;padding-bottom:15px;border-bottom:1px solid #eee}.cart-title h3{font-size:15px;margin:0}.item{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:16px;align-items:center;padding:17px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.thumb{width:92px;height:92px;border-radius:12px;background:#f1f1f1 center/cover no-repeat}.item h3{font-size:14px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:14px;font-weight:900}.item-total{text-align:right}.controls{display:flex;align-items:center;gap:9px;margin-top:12px}.qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff}.qty button{width:30px;height:30px;border:0;background:#f6f6f6;font-size:16px;cursor:pointer}.qty span{min-width:30px;text-align:center;font-size:11px;font-weight:800}.remove{border:0;background:none;color:#d71920;font-size:10px;font-weight:800;cursor:pointer}.summary{padding:23px;height:max-content;position:sticky;top:92px}.summary h2{font-size:18px;margin:0 0 20px}.line{display:flex;justify-content:space-between;gap:15px;font-size:12px;margin:14px 0;color:#666}.line strong{color:#222}.total{border-top:1px solid #eee;padding-top:17px;margin-top:18px;font-size:17px;color:#171717;font-weight:900}.checkout{width:100%;border:0;background:#d71920;color:#fff;border-radius:10px;padding:14px;margin-top:17px;font-weight:900;font-size:12px;cursor:pointer;transition:.2s}.checkout:hover{background:#b9151b;transform:translateY(-1px)}.checkout:disabled{opacity:.55;cursor:not-allowed;transform:none}.continue{display:block;text-align:center;color:#d71920;text-decoration:none;font-size:10px;font-weight:800;margin-top:14px}.secure{margin-top:17px;padding:11px;border-radius:9px;background:#fafafa;color:#888;text-align:center;font-size:9px}.empty{text-align:center;padding:80px 20px;color:#888;font-size:12px}.empty-icon{font-size:38px;margin-bottom:13px}.empty a{display:inline-block;margin-top:15px;background:#d71920;color:#fff;text-decoration:none;padding:11px 17px;border-radius:8px;font-size:11px;font-weight:800}.notice{padding:11px 13px;border-radius:9px;background:#fff1f1;color:#b9151b;font-size:10px;margin-bottom:14px;display:none}.skeleton{display:grid;grid-template-columns:92px 1fr 90px;gap:16px;padding:17px 0;border-bottom:1px solid #eee}.sk{background:linear-gradient(90deg,#eee 25%,#f7f7f7 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:9px}.sk-img{height:92px}.sk-lines{height:15px;margin:8px 0;width:75%}.sk-small{height:11px;width:45%}.sk-price{height:16px;width:70px;margin-left:auto}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{position:static}.header{padding:0 16px}.content{padding:22px 14px 45px}}@media(max-width:520px){.toolbar h2{font-size:24px}.cart{padding:15px}.item{grid-template-columns:68px minmax(0,1fr);gap:12px}.thumb{width:68px;height:68px}.item-total{grid-column:2;text-align:left}.skeleton{grid-template-columns:68px 1fr}.sk-img{height:68px}.sk-price{display:none}.right{gap:5px}.headbtn{width:38px;height:38px}.summary{padding:18px}}
</style>
</head>
<body>
<main class="main">
<header class="header"><h1>Shopping Cart</h1><div class="right"><a class="headbtn" href="notifications.html" aria-label="Notifications">🔔</a><a class="headbtn" href="dashboard.html" aria-label="Home">⌂</a></div></header>
<section class="content">
<div class="toolbar"><div><div class="eyebrow">Shop Camzon</div><h2>Your Cart</h2><span class="muted" id="count">Loading your items...</span></div><div class="currency"><button data-currency="USD">🇺🇸 USD</button><button data-currency="NGN">🇳🇬 NGN</button><button data-currency="XAF">🇨🇲 CFA</button></div></div>
<div class="layout">
<section class="cart"><div class="cart-title"><h3>Cart Items</h3><span class="muted" id="itemCount">—</span></div><div class="notice" id="notice"></div><div id="items"><div class="skeleton"><div class="sk sk-img"></div><div><div class="sk sk-lines"></div><div class="sk sk-small"></div></div><div class="sk sk-price"></div></div><div class="skeleton"><div class="sk sk-img"></div><div><div class="sk sk-lines"></div><div class="sk sk-small"></div></div><div class="sk sk-price"></div></div></div></section>
<aside class="summary"><h2>Order Summary</h2><div class="line"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div><div class="line"><span>Shipping</span><strong id="shipping">$0.00</strong></div><div class="line"><span>Discount</span><strong id="discount">$0.00</strong></div><div class="line total"><span>Total</span><strong id="total">$0.00</strong></div><button class="checkout" id="checkout" type="button">Proceed to Checkout</button><a class="continue" href="dashboard.html">← Continue Shopping</a><div class="secure">🔒 Secure checkout · Your cart is saved to your account</div></aside>
</div></section></main>
<script type="module">
import {App} from './js/app.js';
const session=await App.requireAuth();
if(!session) throw new Error('Not authenticated');
const key='shopcamzon_cart';
let currency=localStorage.getItem('shopcamzon_currency')||'USD';
const rates={USD:1,NGN:1500,XAF:560},symbols={USD:'$',NGN:'₦',XAF:'FCFA '};
const money=v=>symbols[currency]+(Number(v||0)*rates[currency]).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const items=document.getElementById('items'),notice=document.getElementById('notice');
let cart=[];
try{cart=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(cart))cart=[]}catch{cart=[]}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(cart))}
function render(){
const qty=cart.reduce((s,x)=>s+Math.max(1,Number(x.quantity)||1),0);document.getElementById('count').textContent=qty+' item(s)';document.getElementById('itemCount').textContent=qty+' item(s)';
if(!cart.length){items.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><strong>Your cart is empty</strong><br><span>Discover products and add something you love.</span><br><a href="dashboard.html">Continue Shopping →</a></div>';['subtotal','shipping','discount','total'].forEach(id=>document.getElementById(id).textContent=money(0));return}
items.innerHTML=cart.map((x,i)=>{const q=Math.max(1,Number(x.quantity)||1);return `<article class="item"><div class="thumb" style="background-image:url('${esc(x.image||'images/shop-1.jpg')}')"></div><div><h3>${esc(x.name||'Product')}</h3><div class="muted">${money(x.price)} each</div><div class="controls"><div class="qty"><button type="button" data-minus="${i}">−</button><span>${q}</span><button type="button" data-plus="${i}">+</button></div><button type="button" class="remove" data-remove="${i}">Remove</button></div></div><div class="item-total"><div class="price">${money(Number(x.price||0)*q)}</div></div></article>`}).join('');
const sub=cart.reduce((s,x)=>s+Number(x.price||0)*(Math.max(1,Number(x.quantity)||1)),0),ship=sub>=100?0:10,total=sub+ship;document.getElementById('subtotal').textContent=money(sub);document.getElementById('shipping').textContent=money(ship);document.getElementById('discount').textContent=money(0);document.getElementById('total').textContent=money(total);
items.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.minus;cart[i].quantity=Math.max(1,(Number(cart[i].quantity)||1)-1);save();render()});items.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.plus;cart[i].quantity=(Number(cart[i].quantity)||1)+1;save();render()});items.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save();render()})}
document.querySelectorAll('[data-currency]').forEach(b=>b.onclick=()=>{currency=b.dataset.currency;localStorage.setItem('shopcamzon_currency',currency);document.querySelectorAll('[data-currency]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector(`[data-currency="${currency}"]`)?.classList.add('active');
document.getElementById('checkout').onclick=()=>{if(!cart.length){notice.textContent='Your cart is empty. Add a product before checking out.';notice.style.display='block';return}if(!session?.user){location.href='login.html?next=checkout.html';return}save();location.href='checkout.html'};
render();
</script>
</body></html>
