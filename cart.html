<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#d71920"><title>Cart | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#111;color:#fff;padding:25px 16px;overflow:hidden}.slides{position:absolute;inset:0;z-index:0}.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}.slide.active{opacity:1}.sidebar:after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.68);z-index:1}.sidebar>*:not(.slides){position:relative;z-index:2}.dots{position:absolute!important;bottom:72px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3!important}.dot{width:6px;height:6px;border-radius:50%;background:#fff7}.dot.active{width:17px;border-radius:5px;background:#d71920}.logo{display:block;color:#fff;text-decoration:none;font-size:25px;font-weight:800;padding:0 12px 28px}.logo span{color:#d71920}.nav{display:flex;flex-direction:column;gap:5px}.nav a{color:#fff;text-decoration:none;padding:12px;border-radius:8px;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#d71920}.bottom{position:absolute;left:16px;right:16px;bottom:22px}.signout{width:100%;padding:11px;background:#0009;color:#fff;border:1px solid #fff5;border-radius:8px}.main{margin-left:250px}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 35px}.content{max-width:1100px;margin:auto;padding:35px}.currency{display:flex;gap:7px;margin:20px 0}.currency button{background:#fff;border:1px solid #ddd;border-radius:7px;padding:10px 16px;font-size:11px;cursor:pointer}.currency button.active{background:#d71920;color:#fff;border-color:#d71920}.cart{background:#fff;border:1px solid #eee;border-radius:12px;padding:25px}.empty{text-align:center;padding:70px 15px;color:#888;font-size:13px}.shop{display:inline-block;margin-top:18px;background:#d71920;color:#fff;text-decoration:none;padding:12px 20px;border-radius:7px;font-size:12px;font-weight:700}.mobile{display:none;border:0;background:none;font-size:22px;cursor:pointer}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile{display:block}.content{padding:20px 15px}.currency{flex-wrap:wrap}}</style></head><body><aside class="sidebar" id="sidebar"><div class="slides"><div class="slide active" style="background-image:url('images/shop-1.jpg')"></div><div class="slide" style="background-image:url('images/shop-2.jpg')"></div><div class="slide" style="background-image:url('images/shop-3.jpg')"></div></div><div class="dots"><i class="dot active"></i><i class="dot"></i><i class="dot"></i></div><a class="logo" href="index.html"><span>Shop</span> Camzon</a><nav class="nav"><a href="dashboard.html">⌂ &nbsp; Home</a><a class="active" href="cart.html">🛒 &nbsp; Cart</a><a href="orders.html">▣ &nbsp; My Orders</a><a href="saved.html">♡ &nbsp; Saved Items</a><a href="profile.html">♙ &nbsp; Profile</a><a href="notifications.html">🔔 &nbsp; Notifications</a><a href="settings.html">⚙ &nbsp; Settings</a><a href="index.html">🛍 &nbsp; Shop</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside><main class="main"><header class="header"><button class="mobile" id="menu">☰</button><b>Shopping Cart</b><span id="email">Loading...</span></header><section class="content"><h1>Your Cart</h1><p>Review your products before checkout.</p><div class="currency"><button class="active" data-currency="USD">🇺🇸 USD</button><button data-currency="NGN">🇳🇬 NGN</button><button data-currency="XAF">🇨🇲 CFA</button></div><section class="cart"><div class="empty">🛒<br><br>Your cart is empty.<br><a class="shop" href="index.html">Continue Shopping →</a></div></section></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://xgxmnhqdxhvguoplbpjv.supabase.co','REPLACE_WITH_YOUR_SUPABASE_PUBLISHABLE_KEY');const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='login.html';else document.getElementById('email').textContent=session.user.email||'';document.querySelectorAll('[data-currency]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-currency]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');localStorage.setItem('shopcamzon_currency',btn.dataset.currency)});const saved=localStorage.getItem('shopcamzon_currency');if(saved){const b=document.querySelector(`[data-currency="${saved}"]`);if(b){document.querySelectorAll('[data-currency]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}}document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');const slides=[...document.querySelectorAll('.slide')],dots=[...document.querySelectorAll('.dot')];let i=0;setInterval(()=>{slides[i].classList.remove('active');dots[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active');dots[i].classList.add('active')},4500);</script></body></html>
