<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Cart | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#111;color:#fff;padding:25px 16px;overflow:hidden;z-index:20}.slides,.shade{position:absolute;inset:0}.slide{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:1s}.slide.active{opacity:1}.shade{background:#000b}.sidebar>*:not(.slides):not(.shade){position:relative;z-index:2}.logo{display:block;color:#fff;text-decoration:none;font-size:25px;font-weight:800;padding:0 12px 25px}.logo span{color:#d71920}.label{font-size:9px;color:#ddd;text-transform:uppercase;letter-spacing:1.5px;padding:8px 12px}.nav{display:flex;flex-direction:column;gap:4px}.nav a{display:flex;gap:10px;color:#fff;text-decoration:none;padding:11px 12px;border-radius:8px;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#d71920}.bottom{position:absolute!important;left:16px;right:16px;bottom:22px}.signout{width:100%;padding:11px;background:#0008;color:#fff;border:1px solid #fff5;border-radius:8px;font-weight:700}.main{margin-left:250px;min-height:100vh}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 35px;position:sticky;top:0;z-index:10}.header h1{font-size:18px;margin:0}.right{margin-left:auto;display:flex;gap:8px}.headbtn{width:40px;height:40px;border:1px solid #eee;border-radius:9px;display:grid;place-items:center;text-decoration:none;color:#222}.menu{display:none;border:0;background:none;font-size:22px;margin-right:15px}.content{max-width:1150px;margin:auto;padding:30px 20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.currency{display:flex;gap:6px;flex-wrap:wrap}.currency button{border:1px solid #ddd;background:#fff;border-radius:7px;padding:9px 13px;font-size:10px;font-weight:700;cursor:pointer}.currency button.active{background:#d71920;color:#fff;border-color:#d71920}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.cart,.summary{background:#fff;border:1px solid #eee;border-radius:14px}.cart{padding:20px}.item{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.thumb{width:90px;height:90px;border-radius:9px;background:#eee center/cover}.item h3{font-size:14px;margin:0 0 7px}.price{font-weight:800;font-size:15px}.muted{color:#888;font-size:10px;line-height:1.5}.controls{display:flex;gap:7px;align-items:center;margin-top:10px}.qty{display:flex;border:1px solid #ddd;border-radius:7px;overflow:hidden}.qty button{width:29px;height:29px;border:0;background:#f4f4f4;cursor:pointer}.qty span{width:30px;display:grid;place-items:center;font-size:10px;font-weight:700}.remove{border:0;background:none;color:#d71920;font-size:10px;cursor:pointer}.summary{padding:22px;height:max-content;position:sticky;top:90px}.summary h2{font-size:17px;margin:0 0 18px}.line{display:flex;justify-content:space-between;font-size:11px;margin:13px 0;color:#666}.total{border-top:1px solid #eee;padding-top:16px;font-weight:800;color:#171717;font-size:15px}.checkout{width:100%;border:0;background:#d71920;color:#fff;border-radius:8px;padding:13px;margin-top:15px;font-weight:800;cursor:pointer}.continue{display:block;text-align:center;color:#d71920;text-decoration:none;font-size:10px;font-weight:700;margin-top:13px}.empty{text-align:center;padding:80px 20px;color:#888;font-size:13px}.notice{padding:10px 12px;border-radius:8px;background:#fff7e8;color:#805600;font-size:10px;margin-bottom:14px;display:none}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.main{margin-left:0}.menu{display:block}.header{padding:0 15px}.content{padding:20px 14px}.layout{grid-template-columns:1fr}.summary{position:static}.item{grid-template-columns:70px 1fr}.thumb{width:70px;height:70px}.item>.price{grid-column:2}.toolbar{align-items:flex-start}}
</style></head><body><aside class="sidebar" id="sidebar"><div class="slides"><div class="slide active" style="background-image:url('images/shop-1.jpg')"></div><div class="slide" style="background-image:url('images/shop-2.jpg')"></div><div class="slide" style="background-image:url('images/shop-3.jpg')"></div></div><div class="shade"></div><a class="logo" href="dashboard.html"><span>Shop</span> Camzon</a><div class="label">Account</div><nav class="nav"><a href="dashboard.html">⌂ Home</a><a class="active" href="cart.html">🛒 Cart</a><a href="orders.html">▣ My Orders</a><a href="saved.html">♡ Saved Items</a><a href="profile.html">♙ Profile</a><a href="notifications.html">🔔 Notifications</a><a href="settings.html">⚙ Settings</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside><main class="main"><header class="header"><button class="menu" id="menu">☰</button><h1>Shopping Cart</h1><div class="right"><a class="headbtn" href="notifications.html">🔔</a><a class="headbtn" href="dashboard.html">⌂</a></div></header><section class="content"><div class="toolbar"><div><h2 style="margin:0 0 5px">Your Cart</h2><span class="muted" id="count">0 items</span></div><div class="currency"><button data-currency="USD">🇺🇸 USD</button><button data-currency="NGN">🇳🇬 NGN</button><button data-currency="XAF">🇨🇲 CFA</button></div></div><div class="layout"><section class="cart"><div class="notice" id="notice"></div><div id="items"><div class="empty">Loading your cart...</div></div></section><aside class="summary"><h2>Order Summary</h2><div class="line"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div><div class="line"><span>Shipping</span><strong id="shipping">$0.00</strong></div><div class="line"><span>Discount</span><strong id="discount">$0.00</strong></div><div class="line total"><span>Total</span><strong id="total">$0.00</strong></div><button class="checkout" id="checkout">Proceed to Checkout</button><a class="continue" href="dashboard.html">← Continue Shopping</a></aside></div></section></main><script type="module">import{App}from'./js/app.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const key='shopcamzon_cart';let currency=localStorage.getItem('shopcamzon_currency')||'USD';const rates={USD:1,NGN:1500,XAF:560},symbols={USD:'$',NGN:'₦',XAF:'FCFA '};const money=v=>symbols[currency]+(Number(v)*rates[currency]).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});let cart=JSON.parse(localStorage.getItem(key)||'[]');const items=document.getElementById('items');function save(){localStorage.setItem(key,JSON.stringify(cart))}function render(){document.getElementById('count').textContent=cart.reduce((s,x)=>s+x.quantity,0)+' item(s)';if(!cart.length){items.innerHTML='<div class="empty">🛒<br><br>Your cart is empty.<br><a href="dashboard.html" style="display:inline-block;margin-top:15px;background:#d71920;color:#fff;text-decoration:none;padding:11px 17px;border-radius:7px;font-size:11px;font-weight:700">Continue Shopping →</a></div>';document.getElementById('subtotal').textContent=money(0);document.getElementById('total').textContent=money(0);return}items.innerHTML=cart.map((x,i)=>`<article class="item"><div class="thumb" style="background-image:url('${esc(x.image||'images/shop-1.jpg')}')"></div><div><h3>${esc(x.name)}</h3><div class="muted">${money(x.price)} each</div><div class="controls"><div class="qty"><button data-minus="${i}">−</button><span>${x.quantity}</span><button data-plus="${i}">+</button></div><button class="remove" data-remove="${i}">Remove</button></div></div><div class="price">${money(x.price*x.quantity)}</div></article>`).join('');let sub=cart.reduce((s,x)=>s+Number(x.price)*x.quantity,0);document.getElementById('subtotal').textContent=money(sub);document.getElementById('shipping').textContent=money(sub>=100?0:10);document.getElementById('discount').textContent=money(0);document.getElementById('total').textContent=money(sub+(sub>=100?0:10));items.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const i=+b.dataset.minus;cart[i].quantity=Math.max(1,cart[i].quantity-1);save();render()});items.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{cart[+b.dataset.plus].quantity++;save();render()});items.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save();render()})}function esc(v){return String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}document.querySelectorAll('[data-currency]').forEach(b=>b.onclick=()=>{currency=b.dataset.currency;localStorage.setItem('shopcamzon_currency',currency);document.querySelectorAll('[data-currency]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector(`[data-currency="${currency}"]`).classList.add('active');document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('logout').onclick=()=>App.signOut();document.getElementById('checkout').onclick=()=>{if(!cart.length){alert('Your cart is empty.');return}location.href='checkout.html'};const slides=[...document.querySelectorAll('.slide')];let i=0;setInterval(()=>{slides[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active')},4500);render();</script></body></html>
