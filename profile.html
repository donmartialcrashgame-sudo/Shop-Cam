<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Shop Camzon</title><style>body{margin:0;background:#f6f7f9;font-family:Arial;color:#171717}.wrap{max-width:700px;margin:auto;padding:30px 18px}.top{display:flex;justify-content:space-between}.brand{font-size:22px;font-weight:900;text-decoration:none;color:#171717}.brand span{color:#d71920}.back{color:#d71920;font-size:12px;font-weight:700}.card{background:#fff;border-radius:18px;padding:25px;margin-top:20px;border:1px solid #eee}.avatar{width:82px;height:82px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:18px}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px}.btn{background:#d71920;color:#fff;border:0;border-radius:8px;padding:13px 18px;font-weight:800;cursor:pointer}.msg{font-size:11px;margin-top:12px}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="dashboard.html"><span>Shop</span> Camzon</a><a class="back" href="dashboard.html">Dashboard</a></div><section class="card"><div class="avatar" id="avatar">SC</div><h1>My Profile</h1><p id="email" style="font-size:11px;color:#888"></p><div class="field"><label>Full name</label><input id="name"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Country</label><input id="country"></div><div class="field"><label>Address</label><input id="address"></div><button class="btn" id="save">Save Profile</button><div class="msg" id="msg"></div></section></main><script type="module">import{supabase}from'./js/supabase.js';import{App}from'./js/app.js';const s=await App.requireAuth();if(!s)throw 0;const u=s.user;email.textContent=u.email||'';name.value=u.user_metadata?.full_name||u.user_metadata?.name||'';phone.value=u.user_metadata?.phone||'';country.value=u.user_metadata?.country||'';address.value=u.user_metadata?.address||'';avatar.textContent=(name.value||u.email||'SC').slice(0,2).toUpperCase();save.onclick=async()=>{msg.textContent='Saving...';const{error}=await supabase.auth.updateUser({data:{full_name:name.value,phone:phone.value,country:country.value,address:address.value}});msg.textContent=error?error.message:'Profile saved successfully.';if(!error)avatar.textContent=(name.value||u.email||'SC').slice(0,2).toUpperCase()};</script></body></html>
