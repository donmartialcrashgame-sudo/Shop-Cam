<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:Arial,sans-serif;color:#171717}.wrap{max-width:850px;margin:auto;padding:30px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;text-decoration:none;color:#171717}.brand span{color:#d71920}.back{color:#d71920;font-size:11px;font-weight:800;text-decoration:none}.profile-head{margin-top:20px;background:#171717;color:#fff;border-radius:20px;padding:25px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}.profile-head:after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;top:-110px;background:rgba(215,25,32,.35)}.avatar-wrap{position:relative;z-index:1}.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#fff;display:grid;place-items:center;color:#171717;font-size:30px;font-weight:900;border:3px solid rgba(255,255,255,.8)}.avatar-input{display:none}.avatar-btn{display:inline-block;margin-top:8px;color:#fff;font-size:9px;font-weight:800;cursor:pointer}.head-info{position:relative;z-index:1}.head-info h1{margin:0;font-size:22px}.head-info p{margin:6px 0 0;font-size:10px;color:#bbb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:17px;padding:22px}.card.full{grid-column:1/-1}.card h2{font-size:14px;margin:0 0 16px}.field{margin:13px 0}.field label{display:block;font-size:9px;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#d71920}.readonly{background:#f7f7f7!important;color:#777}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fafafa;border-radius:10px;padding:12px}.stat small{display:block;color:#888;font-size:8px}.stat b{display:block;font-size:12px;margin-top:4px}.btn{background:#d71920;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}.msg{font-size:10px;margin-top:10px}.success{color:#19733a}.error{color:#b71920}.provider{display:inline-block;background:#f1f1f1;padding:5px 8px;border-radius:20px;font-size:8px;font-weight:800;text-transform:capitalize}@media(max-width:650px){.wrap{padding:75px 14px 25px}.grid{grid-template-columns:1fr}.card.full{grid-column:auto}.profile-head{align-items:flex-start}.stats{grid-template-columns:1fr 1fr 1fr}}
</style></head><body><main class="wrap"><div class="top"><a class="brand" href="dashboard.html"><span>Shop</span> Camzon</a><a class="back" href="dashboard.html">Dashboard</a></div><section class="profile-head"><div class="avatar-wrap"><img id="avatar" class="avatar" alt="Profile avatar"><label class="avatar-btn" for="avatarFile">Change photo</label><input id="avatarFile" class="avatar-input" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="head-info"><h1 id="displayName">My Profile</h1><p id="displayEmail">Loading account...</p><div style="margin-top:9px"><span id="provider" class="provider">Account</span></div></div></section><div class="grid"><section class="card"><h2>Personal Details</h2><div class="field"><label>FULL NAME</label><input id="name" autocomplete="name"></div><div class="field"><label>PHONE NUMBER</label><input id="phone" autocomplete="tel"></div><div class="field"><label>COUNTRY</label><select id="country"><option value="">Select country</option><option>Cameroon</option><option>Nigeria</option><option>Ghana</option><option>Other</option></select></div></section><section class="card"><h2>Account Details</h2><div class="field"><label>EMAIL ADDRESS</label><input id="email" class="readonly" readonly></div><div class="field"><label>ACCOUNT CREATED</label><input id="created" class="readonly" readonly></div><div class="field"><label>USER ID</label><input id="uid" class="readonly" readonly></div></section><section class="card full"><h2>Delivery Information</h2><div class="field"><label>DELIVERY ADDRESS</label><input id="address" autocomplete="street-address" placeholder="Your delivery address"></div><div class="field"><label>CITY</label><input id="city" autocomplete="address-level2" placeholder="Your city"></div><div class="field"><label>STATE / REGION</label><input id="state" autocomplete="address-level1" placeholder="State or region"></div></section><section class="card full"><h2>Profile Summary</h2><div class="stats"><div class="stat"><small>EMAIL</small><b id="emailStat">—</b></div><div class="stat"><small>COUNTRY</small><b id="countryStat">—</b></div><div class="stat"><small>PHONE</small><b id="phoneStat">—</b></div></div><button class="btn" id="save" style="margin-top:18px">Save Profile</button><div id="msg" class="msg"></div></section></div></main><script type="module">import{supabase}from'./js/supabase.js';import{App}from'./js/app.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const u=session.user,meta=u.user_metadata||{};const $=id=>document.getElementById(id);function initials(){return(($('name').value.trim()||u.email||'SC').split(/\s+/).map(x=>x[0]).join('').slice(0,2)).toUpperCase()}function setAvatar(src){$('avatar').src=src||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="100%" height="100%" rx="100" fill="#fff"/><text x="50%" y="54%" text-anchor="middle" font-family="Arial" font-size="70" font-weight="700" fill="#171717">${initials()}</text></svg>`)}$('email').value=u.email||'';$('displayEmail').textContent=u.email||'No email';$('uid').value=u.id;$('created').value=u.created_at?new Date(u.created_at).toLocaleString():'—';$('name').value=meta.full_name||meta.name||'';$('phone').value=meta.phone||'';$('country').value=meta.country||'';$('address').value=meta.address||'';$('city').value=meta.city||'';$('state').value=meta.state||meta.region||'';$('displayName').textContent=$('name').value||'My Profile';$('emailStat').textContent=u.email||'—';$('countryStat').textContent=$('country').value||'—';$('phoneStat').textContent=$('phone').value||'—';$('provider').textContent=(u.app_metadata?.provider||meta.provider||'email')+' account';setAvatar(meta.avatar_url||meta.picture||meta.avatar||'');$('name').addEventListener('input',()=>{$('displayName').textContent=$('name').value||'My Profile';setAvatar(meta.avatar_url||meta.picture||'')});$('country').addEventListener('change',()=>$('countryStat').textContent=$('country').value||'—');$('phone').addEventListener('input',()=>$('phoneStat').textContent=$('phone').value||'—');$('avatarFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>2*1024*1024){$('msg').className='msg error';$('msg').textContent='Please choose an image smaller than 2MB.';return}const reader=new FileReader();reader.onload=()=>{meta.avatar_url=reader.result;setAvatar(reader.result)};reader.readAsDataURL(file)});$('save').onclick=async()=>{const avatar=meta.avatar_url&&meta.avatar_url.startsWith('data:image/')?meta.avatar_url:meta.avatar_url||null;if(avatar&&avatar.length>500000){$('msg').className='msg error';$('msg').textContent='That image is too large to store in the account profile. Please use a smaller image.';return}$('save').disabled=true;$('msg').className='msg';$('msg').textContent='Saving...';const data={full_name:$('name').value.trim(),phone:$('phone').value.trim(),country:$('country').value,address:$('address').value.trim(),city:$('city').value.trim(),state:$('state').value.trim(),avatar_url:avatar};const{error}=await supabase.auth.updateUser({data});$('save').disabled=false;if(error){$('msg').className='msg error';$('msg').textContent=error.message}else{$('msg').className='msg success';$('msg').textContent='Profile saved successfully.';$('displayName').textContent=data.full_name||'My Profile';$('emailStat').textContent=u.email||'—';$('countryStat').textContent=data.country||'—';$('phoneStat').textContent=data.phone||'—'}};</script></body></html>
