<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | Shop Camzon</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:Arial,Helvetica,sans-serif}.shell{display:flex;min-height:100vh}.aside{width:245px;background:#090909;color:#fff;position:fixed;inset:0 auto 0 0;padding:24px 14px;z-index:20;overflow:auto}.logo{font-size:24px;font-weight:900;padding:0 10px 25px}.logo span{color:#e21a22}.role{font-size:9px;color:#aaa;text-transform:uppercase;letter-spacing:1.5px;padding:8px 10px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#fff;text-align:left;padding:11px 12px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer}.nav button:hover,.nav button.active{background:#df1d25}.aside-bottom{position:sticky;bottom:0;margin-top:25px;padding-top:14px;background:linear-gradient(transparent,#090909 25%)}.signout{width:100%;padding:11px;border:1px solid #fff7;border-radius:8px;background:#000;color:#fff;font-weight:800;cursor:pointer}.main{margin-left:245px;width:calc(100% - 245px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:25px}.user{font-size:11px;color:#777}.section{display:none}.section.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat{background:#fff;border:1px solid #e7e7e7;border-radius:15px;padding:18px}.stat small{font-size:10px;color:#888}.stat strong{display:block;font-size:25px;margin-top:7px}.panel{background:#fff;border:1px solid #e7e7e7;border-radius:15px;padding:18px;margin-top:16px}.panel h2{font-size:15px;margin:0 0 14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.input,.select,.textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff;font:inherit;font-size:11px}.toolbar .input{max-width:280px}.btn{border:0;border-radius:8px;padding:10px 13px;background:#171717;color:#fff;font-size:10px;font-weight:800;cursor:pointer}.btn.red{background:#df1d25}.btn.light{background:#eee;color:#171717}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #eee;white-space:nowrap}.table th{font-size:9px;color:#888;text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:15px;background:#f1f1f1;font-weight:800;font-size:9px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff}.product img{width:100%;height:145px;object-fit:cover;background:#eee}.product-body{padding:12px}.product-body b{font-size:12px}.product-body small{display:block;color:#888;margin:5px 0 10px;font-size:9px}.actions{display:flex;gap:6px}.actions .btn{flex:1}.report{border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:10px}.report-head{display:flex;justify-content:space-between;gap:10px}.report h3{font-size:12px;margin:0}.report p{font-size:10px;color:#666;line-height:1.6}.notice{padding:12px;border-radius:9px;background:#fff6d8;color:#765900;font-size:10px;margin-bottom:14px}.error{background:#fff0f0;color:#a90008}.success{background:#effaf2;color:#19713a}.empty{text-align:center;padding:30px;color:#888;font-size:11px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.product-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.aside{width:220px;transform:translateX(-100%);transition:.25s}.aside.open{transform:translateX(0)}.main{margin-left:0;width:100%;padding:70px 14px 25px}.mobile{display:block!important;position:fixed;left:14px;top:14px;z-index:30;width:42px;height:42px;border:1px solid #ddd;border-radius:9px;background:#fff;font-size:20px}.cards{grid-template-columns:1fr 1fr}.product-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.top h1{font-size:20px}}
.mobile{display:none}
</style></head>
<body>
<button class="mobile" id="mobile">☰</button>
<aside class="aside" id="aside"><div class="logo"><span>Shop</span> Camzon</div><div class="role">Administration</div><nav class="nav">
<button class="active" data-section="overview">▦ Overview</button><button data-section="orders">▣ Orders</button><button data-section="products">▰ Products</button><button data-section="reports">⚠ Reports</button><button data-section="notifications">🔔 Notifications</button><button data-section="customers">♟ Customers</button>
</nav><div class="aside-bottom"><button class="signout" id="signout">🚪 Sign out</button></div></aside>
<main class="main"><div class="top"><div><h1 id="title">Admin Overview</h1><div class="user" id="adminUser">Checking administrator access...</div></div></div>
<section id="overview" class="section active"><div id="stats" class="cards"><div class="stat"><small>Orders</small><strong>—</strong></div><div class="stat"><small>Revenue</small><strong>—</strong></div><div class="stat"><small>Products</small><strong>—</strong></div><div class="stat"><small>Reports</small><strong>—</strong></div></div><div class="panel"><h2>Recent Orders</h2><div id="recentOrders" class="empty">Loading...</div></div></section>
<section id="orders" class="section"><div class="panel"><h2>Order Management</h2><div class="toolbar"><input class="input" id="orderSearch" placeholder="Search order number..."><button class="btn" id="refreshOrders">Refresh</button></div><div id="ordersTable" class="table-wrap">Loading...</div></div></section>
<section id="products" class="section"><div class="panel"><h2>Add Product</h2><div class="form-grid"><input class="input" id="pName" placeholder="Product name"><input class="input" id="pPrice" type="number" step="0.01" placeholder="Price"><input class="input" id="pStock" type="number" placeholder="Stock"><input class="input" id="pSku" placeholder="SKU"><input class="input full" id="pImage" placeholder="Main image URL"><textarea class="textarea full" id="pDesc" placeholder="Description"></textarea><label class="full" style="font-size:10px"><input type="checkbox" id="pActive" checked> Active &nbsp; <input type="checkbox" id="pFeatured"> Featured</label></div><br><button class="btn red" id="addProduct">Add Product</button><div id="productMsg"></div></div><div class="panel"><h2>Products</h2><div id="productsGrid" class="product-grid">Loading...</div></div></section>
<section id="reports" class="section"><div class="panel"><h2>Customer Reports</h2><div id="reportsList">Loading...</div></div></section>
<section id="notifications" class="section"><div class="panel"><h2>Send Notification</h2><div class="form-grid"><input class="input" id="nUser" placeholder="Customer user ID"><input class="input" id="nTitle" placeholder="Notification title"><input class="input full" id="nMessage" placeholder="Message"><input class="input" id="nImage" placeholder="Image URL (optional)"><input class="input" id="nAction" placeholder="Action label (optional)"><input class="input" id="nUrl" placeholder="Action URL (optional)"></div><br><button class="btn red" id="sendNotification">Send Notification</button><div id="notificationMsg"></div></div></section>
<section id="customers" class="section"><div class="panel"><h2>Customers</h2><div id="customersTable">Loading...</div></div></section>
</main>
<script type="module">
import {supabase} from './js/supabase.js';
import {App} from './js/app.js';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
let session,orders=[],products=[],reports=[];
const money=(n,c='USD')=>App.formatCurrency(n,c==='CFA'?'CFA':c);
async function boot(){session=await App.requireAuth();if(!session)return;const {data:profile,error}=await supabase.from('profiles').select('id,full_name,avatar_url,role').eq('id',session.user.id).maybeSingle();if(error)throw error;if(!profile||!['admin','manager','order_staff'].includes(profile.role)){document.querySelector('.main').innerHTML='<div class="panel" style="margin-top:30px"><h2>Access denied</h2><p style="font-size:12px;color:#777">This account is not an administrator account. Ask the Shop Camzon owner to assign an admin role.</p></div>';return}$('adminUser').textContent=`${profile.full_name||session.user.email} · ${profile.role}`;await Promise.all([loadOrders(),loadProducts(),loadReports(),loadCustomers()]);renderOverview()}
async function loadOrders(){const r=await supabase.from('orders').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;orders=r.data||[];renderOrders()}
async function loadProducts(){const r=await supabase.from('products').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;products=r.data||[];renderProducts()}
async function loadReports(){const r=await supabase.from('order_reports').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;reports=r.data||[];renderReports()}
async function loadCustomers(){const r=await supabase.from('profiles').select('id,full_name,phone,avatar_url,role,created_at').order('created_at',{ascending:false});if(r.error){$('customersTable').innerHTML='<div class="notice error">Unable to load customers: '+esc(r.error.message)+'</div>';return}const rows=r.data||[];$('customersTable').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Joined</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.full_name||'—')}</td><td>${esc(x.phone||'—')}</td><td><span class="badge">${esc(x.role)}</span></td><td>${new Date(x.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No customers found.</div>'}
function renderOverview(){$('stats').innerHTML=[['Orders',orders.length],['Revenue',money(orders.filter(o=>o.payment_status==='paid').reduce((s,o)=>s+Number(o.total||0),0),orders[0]?.currency||'USD')],['Products',products.length],['Reports',reports.filter(r=>r.status==='open'||r.status==='pending').length]].map(x=>`<div class="stat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');$('recentOrders').innerHTML=orders.length?orders.slice(0,6).map(o=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:10px"><b>${esc(o.order_number)}</b><span>${esc(o.status)} · ${money(o.total,o.currency)}</span></div>`).join(''):'<div class="empty">No orders yet.</div>'}
function renderOrders(){const q=($('orderSearch')?.value||'').toLowerCase();const list=orders.filter(o=>(o.order_number||'').toLowerCase().includes(q));$('ordersTable').innerHTML=list.length?`<table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${esc(o.order_number)}</b><br><small>${new Date(o.created_at).toLocaleString()}</small></td><td>${esc(o.delivery_name||o.user_id)}</td><td>${money(o.total,o.currency)}</td><td>${esc(o.payment_method||'—')}<br><span class="badge">${esc(o.payment_status)}</span></td><td><span class="badge">${esc(o.status)}</span></td><td><select class="select status-select" data-id="${o.id}"><option>pending</option><option>confirmed</option><option>processing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No orders found.</div>';document.querySelectorAll('.status-select').forEach(s=>{s.value=orders.find(o=>o.id===s.dataset.id)?.status||'pending';s.addEventListener('change',async()=>{const id=s.dataset.id;const{error}=await supabase.from('orders').update({status:s.value,updated_at:new Date().toISOString()}).eq('id',id);if(error){App.toast(error.message,'error');return}const o=orders.find(x=>x.id===id);if(o)o.status=s.value;renderOrders();renderOverview();App.toast('Order status updated','success')})})}
function renderProducts(){ $('productsGrid').innerHTML=products.length?products.map(p=>`<article class="product"><img src="${esc(p.main_image_url||'images/shop-1.jpg')}" onerror="this.src='images/shop-1.jpg'"><div class="product-body"><b>${esc(p.name)}</b><small>${money(p.price,'USD')} · Stock ${p.stock??0} · ${p.is_active?'Active':'Hidden'}</small><div class="actions"><button class="btn light edit-product" data-id="${p.id}">Edit</button><button class="btn red delete-product" data-id="${p.id}">Delete</button></div></div></article>`).join(''):'<div class="empty">No products found.</div>';document.querySelectorAll('.delete-product').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this product?'))return;const{error}=await supabase.from('products').delete().eq('id',b.dataset.id);if(error){App.toast(error.message,'error');return}await loadProducts();renderOverview();App.toast('Product deleted','success')});document.querySelectorAll('.edit-product').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.id);if(!p)return;$('pName').value=p.name||'';$('pPrice').value=p.price||'';$('pStock').value=p.stock||0;$('pSku').value=p.sku||'';$('pImage').value=p.main_image_url||'';$('pDesc').value=p.description||'';$('pActive').checked=!!p.is_active;$('pFeatured').checked=!!p.is_featured;$('addProduct').dataset.edit=b.dataset.id;$('addProduct').textContent='Save Product';window.scrollTo({top:0,behavior:'smooth'})})}
function renderReports(){$('reportsList').innerHTML=reports.length?reports.map(r=>`<article class="report"><div class="report-head"><h3>${esc(r.category.replaceAll('_',' '))}</h3><span class="badge">${esc(r.status||'open')}</span></div><p><b>Order:</b> ${esc(r.order_id)}<br>${esc(r.details)}</p><textarea class="textarea response" data-id="${r.id}" placeholder="Admin response">${esc(r.admin_response||'')}</textarea><br><br><button class="btn red resolve" data-id="${r.id}">Save Response / Resolve</button></article>`).join(''):'<div class="empty">No customer reports.</div>';document.querySelectorAll('.resolve').forEach(b=>b.onclick=async()=>{const response=document.querySelector(`.response[data-id="${b.dataset.id}"]`).value.trim();const{error}=await supabase.from('order_reports').update({admin_response:response,status:'resolved',resolved_at:new Date().toISOString()}).eq('id',b.dataset.id);if(error){App.toast(error.message,'error');return}await loadReports();renderOverview();App.toast('Report resolved','success')})}
$('addProduct').onclick=async()=>{const payload={name:$('pName').value.trim(),price:Number($('pPrice').value||0),stock:Number($('pStock').value||0),sku:$('pSku').value.trim()||null,main_image_url:$('pImage').value.trim()||null,description:$('pDesc').value.trim()||null,is_active:$('pActive').checked,is_featured:$('pFeatured').checked};if(!payload.name)return App.toast('Product name is required','error');const edit=$('addProduct').dataset.edit;const r=edit?await supabase.from('products').update(payload).eq('id',edit):await supabase.from('products').insert(payload);if(r.error){App.toast(r.error.message,'error');return}delete $('addProduct').dataset.edit;$('addProduct').textContent='Add Product';document.querySelectorAll('#products input,#products textarea').forEach(x=>{if(x.type==='checkbox')x.checked=x.id==='pActive';else x.value='' });await loadProducts();renderOverview();App.toast(edit?'Product updated':'Product added','success')};
$('sendNotification').onclick=async()=>{const payload={user_id:$('nUser').value.trim(),title:$('nTitle').value.trim(),message:$('nMessage').value.trim(),type:'admin',image_url:$('nImage').value.trim()||'images/shop-1.jpg',action_label:$('nAction').value.trim()||null,action_url:$('nUrl').value.trim()||null,is_read:false,is_dismissed:false};if(!payload.user_id||!payload.title||!payload.message)return App.toast('User ID, title and message are required','error');const{error}=await supabase.from('notifications').insert(payload);if(error){App.toast(error.message,'error');return}['nUser','nTitle','nMessage','nImage','nAction','nUrl'].forEach(id=>$(id).value='');App.toast('Notification sent','success')};
$('orderSearch').addEventListener('input',renderOrders);$('refreshOrders').onclick=loadOrders;$('mobile').onclick=()=>$('aside').classList.toggle('open');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(b.dataset.section).classList.add('active');$('title').textContent=b.textContent.trim();if(innerWidth<=650)$('aside').classList.remove('open')});$('signout').onclick=()=>App.signOut();
boot().catch(e=>{$('adminUser').textContent='Admin initialization failed';document.querySelector('.main').insertAdjacentHTML('beforeend',`<div class="panel"><div class="notice error">${esc(e.message)}</div></div>`) });
</script></body></html>
