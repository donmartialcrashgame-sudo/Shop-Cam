<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Order Details | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f8;color:#171717}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#d71920;color:#fff;padding:20px 13px;display:flex;flex-direction:column;z-index:10;box-shadow:8px 0 28px #00000012}.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:900;padding:7px 12px 24px}.brand img{width:32px;height:32px;border-radius:9px;background:#fff;object-fit:contain}.nav{display:grid;gap:4px}.nav a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:12px;border-radius:11px;font-size:11px;font-weight:800;transition:.2s}.nav a:hover,.nav a.active{background:#fff;color:#d71920;transform:translateX(2px)}.signout{margin-top:auto;background:#b9141a;color:#fff;border:0;border-radius:11px;padding:13px;text-align:left;font-weight:800}.main{margin-left:250px}.top{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}.menu{display:none;border:0;background:none;font-size:22px}.content{max-width:1100px;margin:auto;padding:25px 18px}.back{color:#d71920;text-decoration:none;font-size:11px;font-weight:900}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.head h1{margin:0;font-size:28px}.muted{font-size:10px;color:#888}.card{background:#fff;border:1px solid #eee;border-radius:17px;padding:20px;margin-bottom:15px;box-shadow:0 8px 30px #00000006}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.label{font-size:9px;color:#999;text-transform:uppercase}.value{font-size:12px;font-weight:800;margin-top:6px;line-height:1.5}.status{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;font-size:9px;font-weight:900;text-transform:capitalize}.status.pending{background:#fff4d6;color:#9a6500}.status.processing{background:#fff0d6;color:#c15b00}.status.shipped{background:#eaf1ff;color:#1d5dcc}.status.delivered{background:#e9f8ee;color:#16803c}.status.cancelled{background:#ffe8e8;color:#bd1d1d}.timeline{display:flex;align-items:center;gap:7px;margin:25px 0 8px}.step{flex:1;text-align:center;font-size:9px;color:#aaa;position:relative}.dot{width:34px;height:34px;border-radius:50%;background:#eee;margin:0 auto 7px;display:grid;place-items:center;font-size:13px;font-weight:900}.step.done.pending{color:#b77900}.step.done.processing{color:#c15b00}.step.done.shipped{color:#1d5dcc}.step.done.delivered{color:#16803c}.step.done.pending .dot{background:#fff0c4;color:#b77900}.step.done.processing .dot{background:#ffe4bf;color:#c15b00}.step.done.shipped .dot{background:#dce9ff;color:#1d5dcc}.step.done.delivered .dot{background:#d9f4e1;color:#16803c}.step.current .dot{box-shadow:0 0 0 5px #d7192020;animation:pulse 1.4s ease-in-out infinite}.line{height:4px;flex:1;background:#e8e8e8;border-radius:99px;position:relative;overflow:hidden}.line.done{background:#d71920}.line.active{background:#f3c4c6}.line.active:after{content:"";position:absolute;top:0;bottom:0;width:45%;background:#d71920;border-radius:99px;animation:travel 1.35s ease-in-out infinite alternate}@keyframes travel{from{left:-45%}to{left:100%}}@keyframes pulse{50%{transform:scale(1.08)}}.item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid #eee;align-items:center}.item img{width:68px;height:68px;border-radius:10px;object-fit:cover;background:#eee}.grow{flex:1}.grow b{font-size:12px}.grow small{display:block;color:#888;font-size:10px;margin-top:6px}.amount{font-size:12px;font-weight:900}.totals{max-width:360px;margin-left:auto}.row{display:flex;justify-content:space-between;font-size:11px;margin:11px 0}.grand{border-top:1px solid #eee;padding-top:13px;font-size:18px;font-weight:900}.buttons{display:flex;gap:9px}.btn{border:0;border-radius:9px;padding:12px 17px;font-size:10px;font-weight:900;cursor:pointer}.primary{background:#d71920;color:#fff}.secondary{background:#fff0f0;color:#d71920}.sk{position:relative;overflow:hidden;background:#ececee;border-radius:7px}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:shimmer 1.25s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}.skeleton{height:12px;margin:10px 0}.skeleton.big{height:35px}.loading-card{min-height:170px}@media(max-width:760px){.side{transform:translateX(-100%);transition:.25s}.side.open{transform:none}.main{margin-left:0}.menu{display:block;margin-right:10px}.summary{grid-template-columns:1fr 1fr}.buttons{flex-direction:column}.head{align-items:flex-start;gap:10px;flex-direction:column}.timeline{gap:3px}.dot{width:30px;height:30px}.line{min-width:8px}.content{padding:18px 12px}}@media(max-width:430px){.timeline{align-items:flex-start}.step{font-size:8px}.dot{width:27px;height:27px;font-size:10px}}</style></head><body><aside class="side" id="side"><div class="brand"><img src="favicon.png" alt="Shop Camzon"><span>Shop Camzon</span></div><nav class="nav"><a href="dashboard.html">🏠 Dashboard</a><a href="orders.html">📦 My Orders</a><a href="saved.html">❤️ Saved Items</a><a href="notifications.html">🔔 Notifications</a><a href="customer-care.html">💬 Customer Care</a><a href="report.html">🚨 Report an Issue</a><a href="faq.html">❓ FAQ</a><a href="help-center.html">🛟 Help Center</a><a href="profile.html">👤 Profile</a><a href="terms.html">📄 Terms & Conditions</a><a href="about.html">ℹ️ About Shop Camzon</a></nav><button class="signout" id="signout">🚪 Sign Out</button></aside><main class="main"><header class="top"><button class="menu" id="menu">☰</button><b>Order Details</b></header><div class="content"><a class="back" href="orders.html">← My Orders</a><div id="app"><section class="card loading-card"><div class="sk skeleton big" style="width:42%"></div><div class="summary"><div class="sk skeleton"></div><div class="sk skeleton"></div><div class="sk skeleton"></div><div class="sk skeleton"></div></div></section><section class="card loading-card"><div class="sk skeleton big" style="width:30%"></div><div class="sk skeleton" style="width:85%"></div><div class="sk skeleton" style="width:70%"></div><div class="sk skeleton" style="width:55%"></div></section></div></div></main><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const s=await App.requireAuth();if(!s)throw Error('Not authenticated');const u=s.user,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');if(!id)location.href='orders.html';$('menu').onclick=()=>$('side').classList.toggle('open');$('signout').onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};async function load(){const{data:o,error}=await supabase.from('orders').select('*').eq('id',id).eq('user_id',u.id).single();if(error){$('app').innerHTML='<section class="card"><b style="color:#d71920">Unable to load order</b><p class="muted">'+esc(error.message)+'</p></section>';return}const{data:its,error:ie}=await supabase.from('order_items').select('*').eq('order_id',id).order('created_at',{ascending:true});if(ie)throw ie;const money=n=>'₦'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const raw=String(o.status||'pending').toLowerCase();const stages=['pending','processing','shipped','delivered'];const idx=Math.max(0,stages.indexOf(raw));const statusLabel=raw.replaceAll('_',' ');const icons={pending:'⏳',processing:'⚙️',shipped:'🚚',delivered:'✓'};const currentClass=stages.includes(raw)?raw:'pending';$('app').innerHTML=`<div class="head"><div><h1>Order Details</h1><div class="muted">Order #${esc(o.order_number||o.id)}</div></div><span class="status ${currentClass}">${icons[currentClass]||'•'} ${esc(statusLabel)}</span></div><section class="card"><div class="summary"><div><div class="label">Order date</div><div class="value">${new Date(o.created_at).toLocaleString()}</div></div><div><div class="label">Payment method</div><div class="value">${esc(o.payment_method||'—')}</div></div><div><div class="label">Payment status</div><div class="value">${esc(o.payment_status||'pending')}</div></div><div><div class="label">Customer</div><div class="value">${esc(o.delivery_name||'—')}</div></div><div><div class="label">Phone</div><div class="value">${esc(o.delivery_phone||'—')}</div></div><div><div class="label">Country</div><div class="value">${esc(o.delivery_country||'—')}</div></div><div style="grid-column:span 2"><div class="label">Delivery address</div><div class="value">${esc([o.delivery_address,o.delivery_city,o.delivery_state].filter(Boolean).join(', ')||'—')}</div></div></div><div class="timeline">${stages.map((x,i)=>`<div class="step ${i<=idx?'done '+x:''} ${i===idx?'current':''}"><div class="dot">${i<idx?'✓':icons[x]}</div>${x[0].toUpperCase()+x.slice(1)}</div>${i<3?`<div class="line ${i<idx?'done':''} ${i===idx?'active':''}"></div>`:''}`).join('')}</div></section><section class="card"><h3 style="margin-top:0;font-size:15px">📦 Items in this order</h3>${(its||[]).map(x=>`<div class="item"><img src="${esc(x.image_url||'images/shop-1.jpg')}" onerror="this.onerror=null;this.src='images/shop-1.jpg'"><div class="grow"><b>${esc(x.product_name||'Product')}</b><small>Quantity: ${Number(x.quantity||0)} × ${money(x.unit_price)}</small></div><div class="amount">${money(x.total_price)}</div></div>`).join('')||'<div class="muted">No order items found.</div>'}<div class="totals"><div class="row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="row"><span>Delivery</span><b>${money(o.delivery_fee)}</b></div><div class="row"><span>Discount</span><b>−${money(o.discount)}</b></div><div class="row grand"><span>Total</span><b>${money(o.total)}</b></div></div></section><section class="card"><div class="buttons"><button class="btn primary" id="receipt">🧾 View Receipt</button><button class="btn secondary" id="report">🚨 Report an Issue</button></div></section>`;document.getElementById('receipt').onclick=()=>location.href='receipt.html?id='+encodeURIComponent(id);document.getElementById('report').onclick=()=>location.href='report.html?order_id='+encodeURIComponent(id)}load().catch(e=>{$('app').innerHTML='<section class="card"><b style="color:#d71920">Unable to load order</b><p class="muted">'+esc(e.message)+'</p></section>'});</script></body></html>
