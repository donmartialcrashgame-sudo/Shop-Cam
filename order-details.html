<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Order Details | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#171717;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.side{position:fixed;inset:0 auto 0 0;width:250px;background:#d71920;color:#fff;padding:20px 13px;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:900;padding:7px 12px 24px}.brand img{width:34px;height:34px;border-radius:9px;background:#fff}.nav{display:grid;gap:4px}.nav a{color:#fff;text-decoration:none;padding:11px;border-radius:11px;font-size:11px;font-weight:800}.nav a.active,.nav a:hover{background:#fff;color:#d71920}.signout{margin-top:auto;border:0;border-radius:11px;padding:13px;background:#b9141a;color:#fff;text-align:left;font-weight:900}.main{margin-left:250px}.top{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}.menu{display:none;border:0;background:none;font-size:22px}.content{max-width:1050px;margin:auto;padding:24px 18px}.back{color:#d71920;text-decoration:none;font-size:11px;font-weight:900}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.head h1{margin:0;font-size:28px}.muted{color:#888;font-size:10px}.card{background:#fff;border:1px solid #eee;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 8px 30px #00000007}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.label{font-size:9px;color:#999;text-transform:uppercase;font-weight:800}.value{font-size:12px;font-weight:800;margin-top:5px;line-height:1.5}.status{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;font-size:9px;font-weight:900;text-transform:capitalize}.pending{background:#fff4d6;color:#9a6500}.processing{background:#fff0d6;color:#c15b00}.shipped{background:#eaf1ff;color:#1d5dcc}.delivered{background:#e9f8ee;color:#16803c}.cancelled,.declined{background:#ffe8e8;color:#bd1d1d}.timeline{display:flex;align-items:center;gap:7px;margin:25px 0 5px}.step{flex:1;text-align:center;color:#aaa;font-size:9px}.dot{width:34px;height:34px;border-radius:50%;background:#eee;margin:0 auto 7px;display:grid;place-items:center;font-weight:900}.step.done.pending{color:#9a6500}.step.done.processing{color:#c15b00}.step.done.shipped{color:#1d5dcc}.step.done.delivered{color:#16803c}.step.done.pending .dot{background:#fff0c4}.step.done.processing .dot{background:#ffe4bf}.step.done.shipped .dot{background:#dce9ff}.step.done.delivered .dot{background:#d9f4e1}.step.current .dot{animation:pulse 1.4s infinite}.line{height:4px;flex:1;background:#eee;border-radius:99px;overflow:hidden}.line.done{background:#d71920}.line.active{background:#f3c4c6}.line.active:after{content:"";display:block;width:45%;height:100%;background:#d71920;animation:travel 1.3s ease-in-out infinite alternate}@keyframes travel{from{transform:translateX(-100%)}to{transform:translateX(220%)}}@keyframes pulse{50%{transform:scale(1.08)}}.product{border:1px solid #eee;border-radius:15px;padding:14px;margin-top:12px}.product-top{display:flex;gap:14px;align-items:center}.product img{width:88px;height:88px;border-radius:13px;object-fit:cover;background:#eee}.grow{flex:1}.grow h3{font-size:14px;margin:0}.grow p{font-size:10px;color:#888;line-height:1.5;margin:7px 0}.price{font-size:13px;font-weight:900}.product-info{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.mini{background:#fafafa;border-radius:11px;padding:10px}.mini span{display:block;font-size:8px;color:#999;text-transform:uppercase}.mini b{display:block;font-size:10px;margin-top:4px}.totals{max-width:380px;margin-left:auto}.row{display:flex;justify-content:space-between;font-size:11px;margin:10px 0}.grand{border-top:1px dashed #ddd;padding-top:13px;font-size:18px;font-weight:900}.buttons{display:flex;gap:9px}.btn{border:0;border-radius:10px;padding:13px 18px;font-size:10px;font-weight:900;cursor:pointer}.primary{background:#d71920;color:#fff}.secondary{background:#fff0f0;color:#d71920}.sk{height:12px;background:#e9e9eb;border-radius:7px;position:relative;overflow:hidden;margin:11px 0}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:shimmer 1.2s infinite}@keyframes shimmer{to{transform:translateX(100%)}}@media(max-width:760px){.side{transform:translateX(-100%);transition:.25s}.side.open{transform:none}.main{margin-left:0}.menu{display:block;margin-right:10px}.summary{grid-template-columns:1fr 1fr}.product-info{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:flex-start;gap:10px}.buttons{flex-direction:column}}@media(max-width:430px){.product-top{align-items:flex-start}.product img{width:70px;height:70px}.product-info{grid-template-columns:1fr}.timeline{gap:2px}.dot{width:28px;height:28px;font-size:10px}}</style></head><body><aside class="side" id="side"><div class="brand"><img src="https://shopcamzon.com/favicon.png" alt="Shop Camzon"><span>Shop Camzon</span></div><nav class="nav"><a href="dashboard.html">🏠 Dashboard</a><a href="orders.html" class="active">📦 My Orders</a><a href="saved.html">❤️ Saved Items</a><a href="notifications.html">🔔 Notifications</a><a href="customer-care.html">💬 Customer Care</a><a href="report.html">🚨 Report an Issue</a><a href="faq.html">❓ FAQ</a><a href="help-center.html">🛟 Help Center</a><a href="profile.html">👤 Profile</a><a href="terms.html">📄 Terms & Conditions</a><a href="about.html">ℹ️ About Shop Camzon</a></nav><button class="signout" id="signout">🚪 Sign Out</button></aside><main class="main"><header class="top"><button class="menu" id="menu">☰</button><b>Order Details</b></header><div class="content"><a class="back" href="orders.html">← My Orders</a><div id="app"><section class="card"><div class="sk" style="width:40%"></div><div class="sk" style="width:85%"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:55%"></div></section></div></div></main><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const s=await App.requireAuth();if(!s)throw Error('Not authenticated');const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₦'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});$('menu').onclick=()=>$('side').classList.toggle('open');$('signout').onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};const id=new URLSearchParams(location.search).get('id');if(!id)location.href='orders.html';async function load(){const{data:o,error}=await supabase.from('orders').select('*').eq('id',id).eq('user_id',s.user.id).single();if(error)throw error;const{data:its,error:ie}=await supabase.from('order_items').select('*').eq('order_id',id).order('created_at',{ascending:true});if(ie)throw ie;const productIds=(its||[]).map(x=>x.product_id).filter(Boolean),products=productIds.length?(await supabase.from('products').select('id,name,description,market_status,wholesale_stock,delivery_channel,core_tech,created_at,main_image_url,image_url_2,image_url_3,image_url_4,image_url_5,image_url_6').in('id',productIds)).data||[]:[];const pmap=new Map(products.map(p=>[p.id,p]));const st=String(o.status||'pending').toLowerCase(),stages=['pending','processing','shipped','delivered'],idx=Math.max(0,stages.indexOf(st)),icons={pending:'⏳',processing:'⚙️',shipped:'🚚',delivered:'✓'};const statusCls=stages.includes(st)?st:(st==='cancelled'||st==='declined'?st:'pending');$('app').innerHTML=`<div class="head"><div><h1>Order Details</h1><div class="muted">Order #${esc(o.order_number||id)}</div></div><span class="status ${statusCls}">${icons[st]||'•'} ${esc(st.replaceAll('_',' '))}</span></div><section class="card"><div class="summary"><div><div class="label">Order date</div><div class="value">${o.created_at?new Date(o.created_at).toLocaleString():'—'}</div></div><div><div class="label">Payment</div><div class="value">${esc(o.payment_method||'—')}</div></div><div><div class="label">Payment status</div><div class="value">${esc(o.payment_status||'—')}</div></div><div><div class="label">Customer</div><div class="value">${esc(o.delivery_name||'—')}</div></div><div><div class="label">Phone</div><div class="value">${esc(o.delivery_phone||'—')}</div></div><div style="grid-column:span 2"><div class="label">Delivery address</div><div class="value">${esc([o.delivery_address,o.delivery_city,o.delivery_state,o.delivery_country].filter(Boolean).join(', ')||'—')}</div></div></div><div class="timeline">${stages.map((x,i)=>`<div class="step ${i<=idx?'done '+x:''} ${i===idx?'current':''}"><div class="dot">${i<idx?'✓':icons[x]}</div>${x[0].toUpperCase()+x.slice(1)}</div>${i<3?`<div class="line ${i<idx?'done':''} ${i===idx?'active':''}"></div>`:''}`).join('')}</div></section><section class="card"><h3 style="margin:0;font-size:15px">🛍️ Products</h3>${(its||[]).map(x=>{const p=pmap.get(x.product_id);const image=x.image_url||p?.main_image_url||'images/shop-1.jpg';return `<article class="product"><div class="product-top"><img src="${esc(image)}" onerror="this.onerror=null;this.src='images/shop-1.jpg'" alt=""><div class="grow"><h3>${esc(x.product_name||p?.name||'Product')}</h3><p>${esc(p?.description||'Product details are available from Shop Camzon.')}</p><div class="price">${money(x.total_price)}</div></div></div><div class="product-info"><div class="mini"><span>Quantity</span><b>${Number(x.quantity||0)}</b></div><div class="mini"><span>Market Status</span><b>${esc(p?.market_status||'Regular')}</b></div><div class="mini"><span>Wholesale Stock</span><b>${esc(p?.wholesale_stock??'—')}</b></div><div class="mini"><span>Delivery Channel</span><b>${esc(p?.delivery_channel||'—')}</b></div><div class="mini"><span>Core Tech</span><b>${esc(p?.core_tech||'—')}</b></div><div class="mini"><span>Product Added</span><b>${p?.created_at?new Date(p.created_at).toLocaleDateString():'—'}</b></div></div></article>`}).join('')||'<div class="muted" style="margin-top:12px">No products found.</div>'}<div class="totals"><div class="row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="row"><span>Delivery</span><b>${money(o.delivery_fee)}</b></div><div class="row"><span>Discount</span><b>−${money(o.discount)}</b></div><div class="row grand"><span>Total</span><b>${money(o.total)}</b></div></div></section><section class="card"><div class="buttons"><button class="btn primary" id="receipt">🧾 View Receipt</button><button class="btn secondary" id="report">🚨 Report an Issue</button></div></section>`;$('receipt').onclick=()=>location.href='receipt.html?id='+encodeURIComponent(id);$('report').onclick=()=>location.href='report.html?order_id='+encodeURIComponent(id)}load().catch(e=>{$('app').innerHTML='<section class="card"><b style="color:#d71920">Unable to load order</b><p class="muted">'+esc(e.message)+'</p></section>'});</script></body></html>
