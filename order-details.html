<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Order Details | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f8;color:#171717}.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:#d71920;color:#fff;padding:22px 14px;display:flex;flex-direction:column;z-index:10}.brand{font-size:21px;font-weight:900;padding:8px 12px 25px}.nav{display:grid;gap:5px}.nav a{color:#fff;text-decoration:none;padding:12px;border-radius:10px;font-size:11px;font-weight:800}.nav a:hover{background:#fff;color:#d71920}.signout{margin-top:auto;background:#b9141a;color:#fff;border:0;border-radius:10px;padding:13px;text-align:left;font-weight:800}.main{margin-left:245px}.top{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:5}.menu{display:none;border:0;background:none;font-size:22px}.content{max-width:1050px;margin:auto;padding:25px 18px}.back{color:#d71920;text-decoration:none;font-size:11px;font-weight:900}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.head h1{margin:0;font-size:28px}.muted{font-size:10px;color:#888}.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:20px;margin-bottom:15px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.label{font-size:9px;color:#999;text-transform:uppercase}.value{font-size:12px;font-weight:800;margin-top:6px;line-height:1.5}.status{display:inline-block;padding:7px 10px;border-radius:20px;background:#fff3d6;color:#8b5a00;font-size:9px;font-weight:900}.timeline{display:flex;gap:8px;align-items:center;margin:18px 0}.step{flex:1;text-align:center;font-size:9px;color:#aaa}.dot{width:27px;height:27px;border-radius:50%;background:#eee;margin:0 auto 6px;display:grid;place-items:center}.step.done{color:#d71920}.step.done .dot{background:#d71920;color:#fff}.line{height:2px;background:#eee;flex:1}.item{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid #eee;align-items:center}.item img{width:68px;height:68px;border-radius:10px;object-fit:cover}.grow{flex:1}.grow b{font-size:12px}.grow small{display:block;color:#888;font-size:10px;margin-top:6px}.amount{font-size:12px;font-weight:900}.totals{max-width:360px;margin-left:auto}.row{display:flex;justify-content:space-between;font-size:11px;margin:11px 0}.grand{border-top:1px solid #eee;padding-top:13px;font-size:18px;font-weight:900}.buttons{display:flex;gap:9px}.btn{border:0;border-radius:9px;padding:12px 17px;font-size:10px;font-weight:900;cursor:pointer}.primary{background:#d71920;color:#fff}.secondary{background:#fff0f0;color:#d71920}.sk{position:relative;overflow:hidden;background:#ececee;border-radius:7px}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:shimmer 1.3s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}.skeleton{height:12px;margin:10px 0}.skeleton.big{height:35px}.skeleton.image{width:68px;height:68px;float:left;margin-right:13px}.loading-card{min-height:170px}@media(max-width:760px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:none}.main{margin-left:0}.menu{display:block;margin-right:10px}.summary{grid-template-columns:1fr 1fr}.buttons{flex-direction:column}.head{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><aside class="side" id="side"><div class="brand">Shop Camzon</div><nav class="nav"><a href="dashboard.html">🏠 Dashboard</a><a href="orders.html">📦 My Orders</a><a href="saved.html">❤️ Saved Items</a><a href="notifications.html">🔔 Notifications</a><a href="customer-care.html">💬 Customer Care</a><a href="report.html">🚨 Report an Issue</a><a href="faq.html">❓ FAQ</a><a href="help-center.html">🛟 Help Center</a><a href="profile.html">👤 Profile</a><a href="terms.html">📄 Terms & Conditions</a><a href="about.html">ℹ️ About</a></nav><button class="signout" id="signout">🚪 Sign Out</button></aside><main class="main"><header class="top"><button class="menu" id="menu">☰</button><b>Order Details</b></header><div class="content"><a class="back" href="orders.html">← My Orders</a><div id="app"><section class="card loading-card"><div class="sk skeleton big" style="width:42%"></div><div class="summary"><div class="sk skeleton"></div><div class="sk skeleton"></div><div class="sk skeleton"></div><div class="sk skeleton"></div></div></section><section class="card loading-card"><div class="sk skeleton big" style="width:30%"></div><div class="sk skeleton" style="width:85%"></div><div class="sk skeleton" style="width:70%"></div><div class="sk skeleton" style="width:55%"></div></section></div></div></main><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';const s=await App.requireAuth();if(!s)throw Error('Not authenticated');const u=s.user,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');if(!id)location.href='orders.html';$('menu').onclick=()=>$('side').classList.toggle('open');$('signout').onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};async function load(){const{data:o,error}=await supabase.from('orders').select('*').eq('id',id).eq('user_id',u.id).single();if(error){$('app').innerHTML='<section class="card"><b style="color:#d71920">Unable to load order</b><p class="muted">'+esc(error.message)+'</p></section>';return}const{data:its,error:ie}=await supabase.from('order_items').select('*').eq('order_id',id).order('created_at',{ascending:true});if(ie)throw ie;const money=n=>'₦'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const status=String(o.status||'pending').replaceAll('_',' ');const stages=['pending','processing','shipped','delivered'];const idx=Math.max(0,stages.indexOf(String(o.status||'pending')));$('app').innerHTML=`<div class="head"><div><h1>Order Details</h1><div class="muted">Order #${esc(o.order_number||o.id)}</div></div><span class="status">${esc(status)}</span></div><section class="card"><div class="summary"><div><div class="label">Order date</div><div class="value">${new Date(o.created_at).toLocaleString()}</div></div><div><div class="label">Payment method</div><div class="value">${esc(o.payment_method||'—')}</div></div><div><div class="label">Payment status</div><div class="value">${esc(o.payment_status||'pending')}</div></div><div><div class="label">Customer</div><div class="value">${esc(o.delivery_name||'—')}</div></div><div><div class="label">Phone</div><div class="value">${esc(o.delivery_phone||'—')}</div></div><div><div class="label">Country</div><div class="value">${esc(o.delivery_country||'—')}</div></div><div style="grid-column:span 2"><div class="label">Delivery address</div><div class="value">${esc([o.delivery_address,o.delivery_city,o.delivery_state].filter(Boolean).join(', ')||'—')}</div></div></div><div class="timeline">${stages.map((x,i)=>`<div class="step ${i<=idx?'done':''}"><div class="dot">${i<idx?'✓':i===idx?'●':'○'}</div>${x[0].toUpperCase()+x.slice(1)}</div>${i<stages.length-1?'<div class="line"></div>':''}`).join('')}</div></section><section class="card"><h3 style="margin-top:0;font-size:15px">📦 Items in this order</h3>${(its||[]).map(x=>`<div class="item"><img src="${esc(x.image_url||'images/shop-1.jpg')}" onerror="this.src='images/shop-1.jpg'"><div class="grow"><b>${esc(x.product_name||'Product')}</b><small>Quantity: ${Number(x.quantity||0)} × ${money(x.unit_price)}</small></div><div class="amount">${money(x.total_price)}</div></div>`).join('')||'<div class="muted">No order items found.</div>'}<div class="totals"><div class="row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="row"><span>Delivery</span><b>${money(o.delivery_fee)}</b></div><div class="row"><span>Discount</span><b>−${money(o.discount)}</b></div><div class="row grand"><span>Total</span><b>${money(o.total)}</b></div></div></section><section class="card"><div class="buttons"><button class="btn primary" id="receipt">🧾 View Receipt</button><button class="btn secondary" id="report">🚨 Report an Issue</button></div></section>`;document.getElementById('receipt').onclick=()=>location.href='receipt.html?id='+encodeURIComponent(id);document.getElementById('report').onclick=()=>location.href='report.html?order_id='+encodeURIComponent(id)}load().catch(e=>{$('app').innerHTML='<section class="card"><b style="color:#d71920">Unable to load order</b><p class="muted">'+esc(e.message)+'</p></section>'});</script></body></html>
