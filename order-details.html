<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Details | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#171717;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px}.back{color:#d71920;text-decoration:none;font-weight:800;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin:22px 0}.head h1{margin:0;font-size:28px}.muted{color:#888;font-size:11px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:20px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.label{font-size:9px;color:#999;text-transform:uppercase}.value{font-size:12px;font-weight:800;margin-top:5px}.item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.item img{width:60px;height:60px;object-fit:cover;border-radius:9px}.grow{flex:1}.grow b{font-size:12px}.grow small{display:block;color:#888;font-size:10px;margin-top:6px}.pill{display:inline-block;padding:6px 9px;border-radius:20px;background:#fff3d6;font-size:9px;font-weight:800}.totals{max-width:330px;margin-left:auto}.line{display:flex;justify-content:space-between;margin:11px 0;font-size:11px}.grand{font-size:18px;font-weight:900;border-top:1px solid #eee;padding-top:14px}.buttons{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#171717;color:#fff}.danger{background:#fff0f0;color:#c71922}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;padding:22px;width:min(430px,100%)}textarea{width:100%;min-height:120px;padding:11px;border:1px solid #ddd;border-radius:9px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.head{display:block}.buttons{flex-direction:column}}
</style></head><body><main class="wrap"><a class="back" href="orders.html">← My Orders</a><div class="head"><div><h1>Order Details</h1><div class="muted" id="number">Loading...</div></div><span class="pill" id="status">—</span></div><section class="card"><div class="grid"><div><div class="label">Order date</div><div class="value" id="date">—</div></div><div><div class="label">Payment</div><div class="value" id="payment">—</div></div><div><div class="label">Payment status</div><div class="value" id="paymentStatus">—</div></div><div><div class="label">Name</div><div class="value" id="name">—</div></div><div><div class="label">Phone</div><div class="value" id="phone">—</div></div><div><div class="label">Country</div><div class="value" id="country">—</div></div></div><div style="margin-top:16px"><div class="label">Delivery address</div><div class="value" id="address">—</div></div></section><section class="card"><h3 style="font-size:15px">Items</h3><div id="items"></div><div class="totals"><div class="line"><span>Subtotal</span><b id="subtotal">—</b></div><div class="line"><span>Delivery</span><b id="delivery">—</b></div><div class="line"><span>Discount</span><b id="discount">—</b></div><div class="line grand"><span>Total</span><b id="total">—</b></div></div></section><section class="card"><div class="buttons"><button class="btn primary" id="receipt">View Receipt</button><button class="btn danger" id="report">Report an Issue</button></div></section></main><div class="modal" id="modal"><div class="modalbox"><h3>Report an Issue</h3><p class="muted">Tell Shop Camzon what went wrong with this order.</p><textarea id="reason" placeholder="Describe the issue..."></textarea><div class="modal-actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="send">Send Report</button></div><div id="msg" class="muted" style="margin-top:8px"></div></div></div><script type="module">import{supabase}from'./js/supabase.js';import{App}from'./js/app.js';const s=await App.requireAuth();if(!s)throw Error('Not authenticated');const id=new URLSearchParams(location.search).get('id');if(!id)location.href='orders.html';const{data:o,error}=await supabase.from('orders').select('*').eq('id',id).eq('user_id',s.user.id).single();if(error)throw error;const{data:items}=await supabase.from('order_items').select('*').eq('order_id',id);const sym={USD:'$',NGN:'₦',CFA:'FCFA '},money=n=>sym[o.currency]+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));number.textContent='Order #'+(o.order_number||o.id);date.textContent=new Date(o.created_at).toLocaleString();payment.textContent=String(o.payment_method||'').toUpperCase();paymentStatus.textContent=o.payment_status||'pending';status.textContent=String(o.status||'pending').replaceAll('_',' ');name.textContent=o.delivery_name||'—';phone.textContent=o.delivery_phone||'—';country.textContent=o.delivery_country||'—';address.textContent=[o.delivery_address,o.delivery_city,o.delivery_state].filter(Boolean).join(', ');items.innerHTML=(items||[]).map(x=>`<div class="item"><img src="${esc(x.image_url||'images/shop-1.jpg')}" onerror="this.src='images/shop-1.jpg'"><div class="grow"><b>${esc(x.product_name)}</b><small>Qty ${x.quantity} × ${money(x.unit_price)}</small></div><b>${money(x.total_price)}</b></div>`).join('');subtotal.textContent=money(o.subtotal);delivery.textContent=money(o.delivery_fee);discount.textContent=money(o.discount);total.textContent=money(o.total);receipt.onclick=()=>location.href='receipt.html?id='+encodeURIComponent(id);const modal=document.getElementById('modal');report.onclick=()=>modal.classList.add('show');cancel.onclick=()=>modal.classList.remove('show');send.onclick=async()=>{const reason=document.getElementById('reason').value.trim();if(!reason)return;send.disabled=true;const{error}=await supabase.from('order_reports').insert({order_id:id,user_id:s.user.id,reason,status:'open'});if(error){msg.textContent=error.message;send.disabled=false}else{msg.textContent='Report submitted successfully.';setTimeout(()=>modal.classList.remove('show'),900)}};</script></body></html>
