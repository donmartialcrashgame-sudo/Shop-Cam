<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Saved Items | Shop Camzon</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#171717}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900;text-decoration:none;color:#171717}.brand span{color:#d71920}.back{color:#d71920;font-size:12px;font-weight:700}.hero{margin:20px 0;background:#d71920;color:#fff;padding:24px;border-radius:16px}.hero h1{margin:0}.hero p{color:#fff;opacity:.88;font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 35px #00000010}.photo{height:180px;background:#f0f0f1;position:relative}.card img{width:100%;height:100%;object-fit:cover;display:block}.pad{padding:14px}.name{font-weight:800;font-size:13px}.price{font-weight:900;margin:8px 0}.btn{border:0;padding:10px;border-radius:8px;cursor:pointer;font-weight:700;font-size:10px}.cart{background:#d71920;color:#fff}.remove{background:#eee;margin-left:5px}.empty{text-align:center;background:#fff;padding:60px;border-radius:15px;color:#888}.empty a{color:#d71920;font-weight:700}.sk-card{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff}.sk-photo,.sk-line,.sk-button{background:#f0f0f1;position:relative;overflow:hidden}.sk-photo{height:180px}.sk-pad{padding:14px}.sk-line{height:11px;border-radius:6px;margin-bottom:9px}.sk-title{width:70%;height:15px}.sk-price{width:40%;height:18px;margin-top:13px}.sk-actions{display:flex;gap:5px;margin-top:13px}.sk-button{height:34px;flex:1;border-radius:8px}.sk-photo:after,.sk-line:after,.sk-button:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:shimmer 1.35s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}@media(max-width:430px){.grid{grid-template-columns:1fr}.sk-photo{height:190px}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="dashboard.html"><span>Shop</span> Camzon</a><a class="back" href="dashboard.html">Dashboard</a></div><section class="hero"><h1>Saved Items ♡</h1><p>Your favorite products, ready whenever you are.</p></section><div id="list" class="grid"></div></main><script type="module">import{App}from'./js/app.js';const s=await App.requireAuth();if(!s)throw 0;const key='shopcamzon_saved',list=document.getElementById('list');const get=()=>App.getSaved();const save=x=>localStorage.setItem(key,JSON.stringify(x));function skeleton(){list.innerHTML=Array.from({length:6},()=>'<article class="sk-card"><div class="sk-photo"></div><div class="sk-pad"><div class="sk-line sk-title"></div><div class="sk-line"></div><div class="sk-line sk-price"></div><div class="sk-actions"><div class="sk-button"></div><div class="sk-button"></div></div></div></article>').join('')}function render(){const items=get();if(!items.length){list.innerHTML='<div class="empty">No saved items yet.<br><br><a href="dashboard.html">Browse products</a></div>';return}list.innerHTML=items.map((p,i)=>`<article class="card"><div class="photo"><img src="${String(p.image||'images/shop-1.jpg').replaceAll('"','&quot;')}" onerror="this.src='images/shop-1.jpg'" alt="${String(p.name||'Product').replaceAll('"','&quot;')}"></div><div class="pad"><div class="name">${String(p.name||'Product')}</div><div class="price">${p.currency==='NGN'?'₦':p.currency==='CFA'?'FCFA ':'$'}${Number(p.price||0).toLocaleString()}</div><button class="btn cart" data-cart="${i}">Add to Cart</button><button class="btn remove" data-remove="${i}">Remove</button></div></article>`).join('');list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const a=get();a.splice(+b.dataset.remove,1);save(a);render()});list.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const p=get()[+b.dataset.cart],c=JSON.parse(localStorage.getItem('shopcamzon_cart')||'[]'),i=c.findIndex(x=>String(x.id)===String(p.id));if(i>=0)c[i].quantity=(Number(c[i].quantity)||0)+1;else c.push({...p,quantity:1});localStorage.setItem('shopcamzon_cart',JSON.stringify(c));App.toast('Added to cart','success')})}skeleton();setTimeout(render,250);document.addEventListener('shopcamzon:saved-changed',render);</script></body></html>
