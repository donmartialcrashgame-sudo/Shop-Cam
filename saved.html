<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Items | Shop Camzon</title><style>body{margin:0;font-family:Arial;background:#f6f7f9;color:#171717}.wrap{max-width:1000px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900;text-decoration:none;color:#171717}.brand span{color:#d71920}.back{color:#d71920;font-size:12px;font-weight:700}.hero{margin:20px 0;background:#171717;color:#fff;padding:24px;border-radius:16px}.hero h1{margin:0}.hero p{color:#aaa;font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee}.card img{width:100%;height:180px;object-fit:cover}.pad{padding:14px}.name{font-weight:800;font-size:13px}.price{font-weight:900;margin:8px 0}.btn{border:0;padding:10px;border-radius:8px;cursor:pointer;font-weight:700}.cart{background:#d71920;color:#fff}.remove{background:#eee;margin-left:5px}.empty{text-align:center;background:#fff;padding:60px;border-radius:15px;color:#888}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="dashboard.html"><span>Shop</span> Camzon</a><a class="back" href="dashboard.html">Dashboard</a></div><section class="hero"><h1>Saved Items ♡</h1><p>Your favorite products, ready whenever you are.</p></section><div id="list" class="grid"></div></main><script type="module">import{supabase}from'./js/supabase.js';import{App}from'./js/app.js';const s=await App.requireAuth();if(!s)throw 0;const key='shopcamzon_saved';function get(){return JSON.parse(localStorage.getItem(key)||'[]')}function save(x){localStorage.setItem(key,JSON.stringify(x))}function render(){const list=document.getElementById('list'),items=get();if(!items.length){list.innerHTML='<div class="empty">No saved items yet.<br><br><a href="dashboard.html">Browse products</a></div>';return}list.innerHTML=items.map((p,i)=>`<article class="card"><img src="${String(p.image||'images/shop-1.jpg').replaceAll('"','&quot;')}"><div class="pad"><div class="name">${String(p.name||'Product')}</div><div class="price">${p.currency==='NGN'?'₦':p.currency==='CFA'?'FCFA ':'$'}${Number(p.price||0).toLocaleString()}</div><button class="btn cart" data-cart="${i}">Add to Cart</button><button class="btn remove" data-remove="${i}">Remove</button></div></article>`).join('');list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const a=get();a.splice(+b.dataset.remove,1);save(a);render()});list.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const p=get()[+b.dataset.cart],c=JSON.parse(localStorage.getItem('shopcamzon_cart')||'[]'),i=c.findIndex(x=>(x.id||x.product_id)===(p.id||p.product_id));if(i>=0)c[i].quantity=(c[i].quantity||1)+1;else c.push({...p,quantity:1});localStorage.setItem('shopcamzon_cart',JSON.stringify(c));alert('Added to cart')})}render();</script></body></html>
