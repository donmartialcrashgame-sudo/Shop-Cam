<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Sign In | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f7f8;color:#171717}.page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.brand{position:relative;overflow:hidden;background:#d71920;color:#fff;padding:55px;display:flex;flex-direction:column;justify-content:center}.brand:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#d71920ee,#9f0e14dd),url('images/shop-1.jpg') center/cover;opacity:.92}.brand>*{position:relative;z-index:1}.logo{color:#fff;text-decoration:none;font-size:27px;font-weight:900}.brand h1{font-size:58px;line-height:1;margin:35px 0 18px}.brand h1 em{color:#fff;font-style:normal}.brand p{color:#fff;opacity:.9;max-width:420px;line-height:1.7}.form-area{display:flex;align-items:center;justify-content:center;padding:30px}.box{width:min(430px,100%)}.back{font-size:12px;color:#777;text-decoration:none}.box h2{font-size:35px;margin:28px 0 7px}.sub{color:#777;font-size:13px;margin-bottom:22px}.google,.submit{width:100%;height:49px;border-radius:12px;cursor:pointer;font-weight:800;transition:.2s}.google{border:1px solid #ddd;background:#fff}.google:hover,.submit:hover{transform:translateY(-2px);box-shadow:0 10px 25px #0002}.submit{border:0;background:#d71920;color:#fff}.divider{display:flex;gap:12px;align-items:center;color:#999;font-size:10px;margin:22px 0}.divider:before,.divider:after{content:"";height:1px;background:#e5e5e5;flex:1}label{display:block;font-size:11px;font-weight:800;margin:12px 0 6px}input{width:100%;height:48px;border:1px solid #ddd;border-radius:12px;padding:0 13px;font-size:14px;outline:none}input:focus{border-color:#d71920;box-shadow:0 0 0 4px #d7192012}.hint{font-size:10px;color:#999;line-height:1.5;margin:8px 0 18px}.msg{position:fixed;top:22px;right:22px;z-index:9999;width:min(390px,calc(100vw - 32px));display:none;padding:16px 18px 16px 52px;border-radius:16px;background:#fff;color:#222;border:1px solid #eee;box-shadow:0 18px 55px #0002;font-size:12px;font-weight:800}.msg:before{content:'!';position:absolute;left:16px;top:13px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#d71920;color:#fff;font-weight:1000}.msg.show{display:block;animation:in .3s ease}.msg.success{color:#176b36}.msg.success:before{content:'✓';background:#16803c}@keyframes in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}.signup{text-align:center;font-size:12px;color:#777;margin-top:20px}.signup a{color:#d71920;font-weight:800;text-decoration:none}@media(max-width:800px){.page{grid-template-columns:1fr}.brand{display:none}.form-area{padding:25px 20px}}</style></head><body><div class="page"><section class="brand"><a class="logo" href="index.html">Shop Camzon</a><h1>Welcome<br><em>back.</em></h1><p>Sign in securely to your Shop Camzon account.</p></section><main class="form-area"><div class="box"><a class="back" href="index.html">← Back to Shop Camzon</a><h2>Sign in</h2><p class="sub">Enter your email and we'll send you a secure OTP.</p><button class="google" id="googleBtn" type="button">G &nbsp; Continue with Google</button><div class="divider">OR CONTINUE WITH EMAIL OTP</div><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><p class="hint">No password is required. We'll send a 6-digit code to your email.</p><button class="submit" id="submitBtn" type="submit">Send OTP →</button></form><div class="msg" id="message"></div><div class="signup">Don't have an account? <a href="signup.html">Create an account</a></div></div></main></div><script type="module">import{supabase}from'./js/supabase.js';import{AUTH_CALLBACK_URL}from'./js/config.js';const form=document.getElementById('loginForm'),btn=document.getElementById('submitBtn'),msg=document.getElementById('message');function show(t,type='error'){msg.textContent=t;msg.className='msg show '+type;clearTimeout(window.__msg);window.__msg=setTimeout(()=>msg.classList.remove('show'),4000)}form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim().toLowerCase();btn.disabled=true;btn.textContent='Sending OTP...';const{error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error){show(error.message);btn.disabled=false;btn.textContent='Send OTP →';return}sessionStorage.setItem('shopcamzon_otp_email',email);sessionStorage.setItem('shopcamzon_otp_mode','login');show('OTP sent successfully. Check your email.','success');setTimeout(()=>location.href='verify-otp.html',700)});document.getElementById('googleBtn').onclick=async()=>{const b=document.getElementById('googleBtn');b.disabled=true;b.textContent='Connecting to Google...';const{error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:AUTH_CALLBACK_URL}});if(error){show(error.message);b.disabled=false;b.textContent='G   Continue with Google'}};</script></body></html>
