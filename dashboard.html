<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e3131b"><title>Dashboard | Shop Camzon</title><link rel="icon" type="image/png" href="https://shopcamzon.com/favicon.png"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#171717}.top{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 25px;position:sticky;top:0;z-index:20}.title{font-size:18px;font-weight:900}.right{margin-left:auto;display:flex;gap:8px;align-items:center}.icon{width:40px;height:40px;border:1px solid #eee;border-radius:11px;display:grid;place-items:center;text-decoration:none;color:#222;background:#fff;position:relative}.badge{position:absolute;right:2px;top:1px;background:#d71920;color:#fff;border-radius:20px;min-width:16px;height:16px;display:grid;place-items:center;font-size:8px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #eee}.content{max-width:1250px;margin:auto;padding:25px 20px}.welcome{background:linear-gradient(120deg,#d71920,#b90f16);color:#fff;border-radius:20px;padding:28px;min-height:160px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 12px 35px rgba(215,25,32,.16)}.welcome small{font-size:9px;opacity:.8;text-transform:uppercase;font-weight:800;letter-spacing:1px}.welcome h1{margin:8px 0;font-size:30px}.welcome p{margin:0;font-size:11px;opacity:.9}.section{background:#fff;border:1px solid #eee;border-radius:17px;padding:20px;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h2{font-size:17px;margin:0}.muted{font-size:10px;color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:15px}.card{border:1px solid #eee;border-radius:15px;background:#fff;overflow:hidden;transition:.22s}.card:hover{transform:translateY(-4px);box-shadow:0 15px 35px rgba(0,0,0,.07)}.photo{height:185px;background:#eee;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:10px;top:10px;width:37px;height:37px;border:0;border-radius:50%;background:#fff;color:#d71920;font-size:20px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.18)}.heart.saved{background:#d71920;color:#fff}.info{padding:14px}.info h3{font-size:13px;margin:0 0 10px}.price{font-size:17px;font-weight:900;margin-bottom:11px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions a,.actions button{border:0;border-radius:9px;padding:10px 6px;text-align:center;text-decoration:none;font-size:9px;font-weight:900;cursor:pointer}.view{background:#fff0f0;color:#d71920}.add{background:#d71920;color:#fff}.skeleton-card{border:1px solid #eee;border-radius:15px;overflow:hidden;background:#fff}.sk{position:relative;overflow:hidden;background:#e9e9eb}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:shimmer 1.25s infinite}.sk-photo{height:185px}.sk-info{padding:14px}.sk-line{height:12px;border-radius:6px;margin-bottom:10px}.w70{width:70%}.w90{width:90%}.w45{width:45%;height:18px;margin-top:15px}.sk-buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.sk-btn{height:35px;border-radius:9px}@keyframes shimmer{100%{transform:translateX(100%)}}@media(max-width:760px){.top{padding:0 13px}.content{padding:16px 12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo,.sk-photo{height:150px}.actions{grid-template-columns:1fr}.avatar{width:36px;height:36px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.photo,.sk-photo{height:195px}}</style></head><body><main><header class="top"><button class="sc-menu" aria-label="Open menu">☰</button><div class="title">Shop Camzon</div><div class="right"><a class="icon" href="cart.html">🛒<span class="badge" id="cartBadge" style="display:none">0</span></a><a class="icon" href="notifications.html">🔔</a><img id="avatar" class="avatar" src="https://shopcamzon.com/favicon.png" alt="Profile"></div></header><div class="content"><section class="welcome"><small>Customer account</small><h1 id="welcome">Welcome back!</h1><p>Explore the latest products from Shop Camzon.</p></section><section class="section"><div class="head"><h2>Products</h2><span class="muted" id="count">Loading products...</span></div><div class="grid" id="grid"><div class="skeleton-card"><div class="sk sk-photo"></div><div class="sk-info"><div class="sk sk-line w70"></div><div class="sk sk-line w90"></div><div class="sk sk-line w45"></div><div class="sk-buttons"><div class="sk sk-btn"></div><div class="sk sk-btn"></div></div></div></div><div class="skeleton-card"><div class="sk sk-photo"></div><div class="sk-info"><div class="sk sk-line w70"></div><div class="sk sk-line w90"></div><div class="sk sk-line w45"></div><div class="sk-buttons"><div class="sk sk-btn"></div><div class="sk sk-btn"></div></div></div></div><div class="skeleton-card"><div class="sk sk-photo"></div><div class="sk-info"><div class="sk sk-line w70"></div><div class="sk sk-line w90"></div><div class="sk sk-line w45"></div><div class="sk-buttons"><div class="sk sk-btn"></div><div class="sk sk-btn"></div></div></div></div><div class="skeleton-card"><div class="sk sk-photo"></div><div class="sk-info"><div class="sk sk-line w70"></div><div class="sk sk-line w90"></div><div class="sk sk-line w45"></div><div class="sk-buttons"><div class="sk sk-btn"></div><div class="sk sk-btn"></div></div></div></div></div></section></div></main><script type="module">import{App}from'./js/app.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');App.mountSidebar('dashboard');const u=session.user,$=id=>document.getElementById(id);const esc=App.esc;$('welcome').textContent='Welcome back, '+(u.user_metadata?.full_name||u.email?.split('@')[0]||'Customer').split(' ')[0]+'!';if(u.user_metadata?.avatar_url)$('avatar').src=u.user_metadata.avatar_url;let saved=new Set(JSON.parse(localStorage.getItem('shopcamzon_saved')||'[]').map(String));const cart=()=>JSON.parse(localStorage.getItem('shopcamzon_cart')||'[]');function badge(){const n=cart().reduce((a,x)=>a+Number(x.quantity||0),0);$('cartBadge').textContent=n;$('cartBadge').style.display=n?'grid':'none'}function add(p){const c=cart(),x=c.find(i=>String(i.id)===String(p.id));if(x)x.quantity++;else c.push({id:p.id,name:p.name,price:Number(p.price),image:p.main_image_url||'images/shop-1.jpg',quantity:1});localStorage.setItem('shopcamzon_cart',JSON.stringify(c));badge();App.toast('Added to cart','success')}function toggle(p,b){const k=String(p.id);saved.has(k)?saved.delete(k):saved.add(k);localStorage.setItem('shopcamzon_saved',JSON.stringify([...saved]));b.classList.toggle('saved',saved.has(k));b.textContent=saved.has(k)?'♥':'♡';App.toast(saved.has(k)?'Saved to wishlist':'Removed from wishlist','success')}async function load(){const{data,error}=await App.supabase.from('products').select('id,name,price,main_image_url,is_active').eq('is_active',true).order('created_at',{ascending:false});if(error){$('count').textContent='Unable to load';$('grid').innerHTML='<div style="padding:35px;color:#b71920">Unable to load products. '+esc(error.message)+'</div>';return}const rows=data||[];$('count').textContent=rows.length+' product'+(rows.length===1?'':'s');$('grid').innerHTML=rows.length?rows.map(p=>`<article class="card"><div class="photo"><img src="${esc(p.main_image_url||'images/shop-1.jpg')}" onerror="this.src='images/shop-1.jpg'" alt="${esc(p.name)}"><button class="heart ${saved.has(String(p.id))?'saved':''}" data-heart="${p.id}">${saved.has(String(p.id))?'♥':'♡'}</button></div><div class="info"><h3>${esc(p.name)}</h3><div class="price">₦${Number(p.price||0).toLocaleString()}</div><div class="actions"><a class="view" href="view-details.html?id=${encodeURIComponent(p.id)}">View Details</a><button class="add" data-add="${p.id}">Add to Cart</button></div></div></article>`).join(''):'<div style="padding:40px;text-align:center;color:#888">No products available.</div>';rows.forEach(p=>{$(`[data-heart="${p.id}"]`).onclick=()=>toggle(p,$(`[data-heart="${p.id}"]`));$(`[data-add="${p.id}"]`).onclick=()=>add(p)})}badge();load();</script></body></html>
