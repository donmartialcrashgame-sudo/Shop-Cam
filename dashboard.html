<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#d71920"><title>Dashboard | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f8;color:#171717}.app{min-height:100vh}.slider{position:absolute;inset:0;overflow:hidden}.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}.slide.active{opacity:1}.shade{position:absolute;inset:0;background:rgba(0,0,0,.62)}.dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}.dot{width:6px;height:6px;border-radius:50%;background:#fff6}.dot.active{width:18px;border-radius:5px;background:#d71920}.sidebar{width:250px;position:fixed;inset:0 auto 0 0;padding:25px 16px;color:#fff;z-index:10;overflow:hidden}.sidebar>*:not(.slider):not(.shade):not(.dots){position:relative;z-index:4}.sidebar .slider,.sidebar .shade{z-index:0}.sidebar .shade{z-index:1}.logo{display:block;color:#fff;text-decoration:none;font-size:25px;font-weight:800;padding:0 12px 28px}.logo span{color:#d71920}.label{font-size:9px;color:#eee;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:10px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav a{color:#fff;text-shadow:0 1px 3px #000;text-decoration:none;padding:12px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:11px}.nav a:hover,.nav a.active{background:#d71920;text-shadow:none}.nav-icon{width:20px;text-align:center}.bottom{position:absolute;bottom:22px;left:16px;right:16px}.signout{width:100%;border:1px solid #fff8;background:#0009;color:#fff;padding:11px;border-radius:8px;cursor:pointer}.main{margin-left:250px;min-height:100vh}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 35px;position:sticky;top:0;z-index:5}.header h2{font-size:18px;margin:0}.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}.header-btn{position:relative;width:40px;height:40px;border:1px solid #eee;background:#fff;border-radius:9px;display:grid;place-items:center;color:#333;text-decoration:none;font-size:18px}.badge{position:absolute;right:5px;top:4px;min-width:15px;height:15px;border-radius:10px;background:#d71920;color:#fff;font-size:8px;display:grid;place-items:center}.user{font-size:12px;color:#777;margin-left:7px}.content{padding:35px;width:min(1250px,100%);margin:auto}.welcome{min-height:230px;background:#111;color:#fff;border-radius:14px;padding:38px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.welcome .slider,.welcome .shade{z-index:0}.welcome>*:not(.slider):not(.shade):not(.dots){position:relative;z-index:2}.eyebrow{color:#ff7278;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1.5px}.welcome h1{font-size:34px;margin:9px 0}.welcome p{color:#eee;font-size:13px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card{background:#fff;border:1px solid #eee;border-radius:11px;padding:21px}.number{font-size:26px;font-weight:800}.card small{display:block;color:#888;font-size:11px;margin-top:6px}.products{background:#fff;border:1px solid #eee;border-radius:12px;padding:25px}.products-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.products h2{font-size:19px;margin:0}.count{font-size:11px;color:#888}.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.product-card{border:1px solid #eee;border-radius:10px;overflow:hidden;background:#fff}.product-image{height:180px;background:#eee center/cover no-repeat}.product-info{padding:15px}.product-info h3{font-size:14px;margin:0 0 8px}.product-desc{font-size:11px;color:#888;min-height:30px;margin-bottom:12px}.product-price{font-size:17px;font-weight:800}.product-stock{font-size:10px;color:#777;margin-top:5px}.view-btn{display:block;text-align:center;text-decoration:none;background:#d71920;color:#fff;border-radius:7px;padding:10px;margin-top:12px;font-size:11px;font-weight:700}.empty,.loading{padding:50px 15px;text-align:center;color:#888;font-size:13px;border:1px dashed #ddd;border-radius:9px}.mobile-menu{display:none}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.header{padding:0 18px}.mobile-menu{display:block;border:0;background:none;font-size:22px;cursor:pointer}.user{display:none}.header-btn{width:36px;height:36px}.content{padding:20px 15px}.stats{grid-template-columns:1fr}.welcome h1{font-size:28px}.product-grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="slider" data-slider><div class="slide active" style="background-image:url('images/shop-1.jpg')"></div><div class="slide" style="background-image:url('images/shop-2.jpg')"></div><div class="slide" style="background-image:url('images/shop-3.jpg')"></div></div><div class="shade"></div><div class="dots"><i class="dot active"></i><i class="dot"></i><i class="dot"></i></div><a class="logo" href="index.html"><span>Shop</span> Camzon</a><div class="label">Account</div><nav class="nav"><a class="active" href="dashboard.html"><span class="nav-icon">⌂</span>Home</a><a href="cart.html"><span class="nav-icon">🛒</span>Cart</a><a href="orders.html"><span class="nav-icon">▣</span>My Orders</a><a href="saved.html"><span class="nav-icon">♡</span>Saved Items</a><a href="profile.html"><span class="nav-icon">♙</span>Profile</a><a href="notifications.html"><span class="nav-icon">🔔</span>Notifications</a><a href="settings.html"><span class="nav-icon">⚙</span>Settings</a></nav><div class="label">Store</div><nav class="nav"><a href="index.html"><span class="nav-icon">🛍</span>Shop</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside><section class="main"><header class="header"><button class="mobile-menu" id="menu">☰</button><h2>Home</h2><div class="header-right"><a class="header-btn" href="cart.html">🛒<span class="badge">0</span></a><a class="header-btn" href="notifications.html">🔔<span class="badge">0</span></a><div class="user" id="userEmail">Loading...</div></div></header><main class="content"><section class="welcome"><div class="slider" data-slider><div class="slide active" style="background-image:url('images/shop-1.jpg')"></div><div class="slide" style="background-image:url('images/shop-2.jpg')"></div><div class="slide" style="background-image:url('images/shop-3.jpg')"></div></div><div class="shade"></div><div class="dots"><i class="dot active"></i><i class="dot"></i><i class="dot"></i></div><div class="eyebrow">Customer account</div><h1>Welcome back!</h1><p id="welcomeText">Loading your account...</p></section><section class="stats"><div class="card"><div class="number">0</div><small>My Orders</small></div><div class="card"><div class="number">0</div><small>Saved Items</small></div><div class="card"><div class="number">₦0</div><small>Total Spent</small></div></section><section class="products"><div class="products-head"><h2>Products</h2><span class="count" id="productCount">Loading...</span></div><div id="productGrid" class="product-grid"><div class="loading">Loading products from Shop Camzon...</div></div></section></main></section></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://xgxmnhqdxhvguoplbpjv.supabase.co','sb_publishable_E-5Eg78QR6jTSULAWkhG5w_4B0XGGnp');const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='login.html';else{document.getElementById('userEmail').textContent=session.user.email||'';document.getElementById('welcomeText').textContent='Signed in as '+(session.user.email||'Shop Camzon customer')}document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.querySelectorAll('[data-slider]').forEach(slider=>{const slides=[...slider.querySelectorAll('.slide')],dots=[...slider.parentElement.querySelectorAll('.dots .dot')];let i=0;setInterval(()=>{slides[i].classList.remove('active');if(dots[i])dots[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active');if(dots[i])dots[i].classList.add('active')},4500)});const grid=document.getElementById('productGrid'),count=document.getElementById('productCount');const{data:products,error}=await supabase.from('products').select('id,name,slug,description,price,compare_price,stock,main_image_url').eq('is_active',true).order('created_at',{ascending:false});if(error){grid.innerHTML='<div class="empty">Unable to load products. Check that the products table allows SELECT for logged-in users in Supabase.</div>';count.textContent='Error'}else if(!products.length){grid.innerHTML='<div class="empty">No products are available yet.</div>';count.textContent='0 products'}else{count.textContent=products.length+' product'+(products.length===1?'':'s');grid.innerHTML=products.map(p=>`<article class="product-card"><div class="product-image" style="background-image:url('${p.main_image_url||'images/shop-1.jpg'}')"></div><div class="product-info"><h3>${safe(p.name)}</h3><div class="product-desc">${safe(p.description||'Shop Camzon product')}</div><div class="product-price">$${Number(p.price).toFixed(2)}</div><div class="product-stock">${Number(p.stock)>0?p.stock+' in stock':'Out of stock'}</div><a class="view-btn" href="view-details.html?id=${encodeURIComponent(p.id)}">View Details</a></div></article>`).join('')}function safe(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}supabase.auth.onAuthStateChange((_e,s)=>{if(!s)location.href='login.html'});</script></body></html>
