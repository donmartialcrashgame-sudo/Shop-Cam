<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#d71920"><title>Dashboard | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f8;color:#171717}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:linear-gradient(180deg,#080808dd,#080808ee),url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=900&q=85') center/cover;color:#fff;position:fixed;left:0;top:0;bottom:0;padding:25px 16px;z-index:10;box-shadow:5px 0 25px #0002}.logo{display:block;text-decoration:none;color:#fff;font-size:25px;font-weight:800;padding:0 12px 28px}.logo span{color:#d71920}.label{font-size:9px;color:#eee;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:10px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav a{color:#fff;text-shadow:0 1px 3px #000;text-decoration:none;padding:12px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:11px}.nav a:hover,.nav a.active{background:#d71920;text-shadow:none}.nav-icon{width:20px;text-align:center;font-size:15px}.bottom{position:absolute;bottom:22px;left:16px;right:16px}.signout{width:100%;border:1px solid #fff8;background:#000a;color:#fff;padding:11px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700}.main{margin-left:250px;width:calc(100% - 250px);min-height:100vh}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 35px;position:sticky;top:0;z-index:5}.header h2{font-size:18px;margin:0}.user{font-size:12px;color:#777}.content{padding:35px;width:min(1250px,100%);margin:auto}.welcome{min-height:230px;background:linear-gradient(90deg,#050505cc,#05050599),url('https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1400&q=85') center/cover;color:#fff;border-radius:14px;padding:38px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.welcome:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#d71920;right:-90px;top:-150px;opacity:.35}.welcome>*{position:relative;z-index:1}.eyebrow{color:#ff7278;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1.5px}.welcome h1{font-size:34px;margin:9px 0}.welcome p{color:#eee;font-size:13px;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card{background:#fff;border:1px solid #eee;border-radius:11px;padding:21px}.number{font-size:26px;font-weight:800}.card small{display:block;color:#888;font-size:11px;margin-top:6px}.products{background:#fff;border:1px solid #eee;border-radius:12px;padding:25px}.products-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.products h2{font-size:19px;margin:0}.count{font-size:11px;color:#888}.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.empty{padding:50px 15px;text-align:center;color:#888;font-size:13px;border:1px dashed #ddd;border-radius:9px}.mobile-menu{display:none}@media(max-width:1000px){.product-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.header{padding:0 18px}.mobile-menu{display:block;border:0;background:none;font-size:22px;cursor:pointer}.content{padding:20px 15px}.stats{grid-template-columns:1fr}.product-grid{grid-template-columns:1fr}.welcome h1{font-size:28px}.user{display:none}}</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><a class="logo" href="index.html"><span>Shop</span> Camzon</a><div class="label">Account</div><nav class="nav"><a class="active" href="dashboard.html"><span class="nav-icon">⌂</span>Home</a><a href="orders.html"><span class="nav-icon">▣</span>My Orders</a><a href="saved.html"><span class="nav-icon">♡</span>Saved Items</a><a href="profile.html"><span class="nav-icon">♙</span>Profile</a><a href="settings.html"><span class="nav-icon">⚙</span>Settings</a></nav><div class="label">Store</div><nav class="nav"><a href="index.html"><span class="nav-icon">🛍</span>Shop</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside><section class="main"><header class="header"><button class="mobile-menu" id="menu">☰</button><h2>Home</h2><div class="user" id="userEmail">Loading...</div></header><main class="content"><section class="welcome"><div class="eyebrow">Customer account</div><h1>Welcome back!</h1><p id="welcomeText">Loading your account...</p></section><section class="stats"><div class="card"><div class="number">0</div><small>My Orders</small></div><div class="card"><div class="number">0</div><small>Saved Items</small></div><div class="card"><div class="number">₦0</div><small>Total Spent</small></div></section><section class="products"><div class="products-head"><h2>Products</h2><span class="count">Products added by Shop Camzon</span></div><div class="product-grid"><div class="empty">Products added by the admin will appear here.</div></div></section></main></section></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://xgxmnhqdxhvguoplbpjv.supabase.co','REPLACE_WITH_YOUR_SUPABASE_PUBLISHABLE_KEY');const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='login.html'}else{const email=session.user.email||'';document.getElementById('userEmail').textContent=email;document.getElementById('welcomeText').textContent='Signed in as '+email}document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();location.href='login.html'});document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));supabase.auth.onAuthStateChange((_event,newSession)=>{if(!newSession)location.href='login.html'});</script></body></html>
