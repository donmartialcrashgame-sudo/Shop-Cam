<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Dashboard | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#171717}main{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 32px;position:sticky;top:0;z-index:30}.menu{display:none;border:0;background:#fff;font-size:23px;margin-right:12px}.title{font-size:18px;font-weight:800}.right{margin-left:auto;display:flex;align-items:center;gap:8px}.iconbtn{width:40px;height:40px;border:1px solid #eee;border-radius:9px;background:#fff;text-decoration:none;color:#222;display:grid;place-items:center;position:relative}.badge{position:absolute;right:3px;top:2px;background:#d71920;color:#fff;min-width:16px;height:16px;border-radius:20px;font-size:8px;display:grid;place-items:center}.badge.zero{display:none}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #eee}.content{width:min(1250px,100%);margin:auto;padding:28px 20px}.welcome{position:relative;overflow:hidden;min-height:220px;border-radius:18px;background:#111;color:#fff;padding:34px;display:flex;flex-direction:column;justify-content:center}.welcome img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.26;transition:opacity .7s}.welcome:after{content:"";position:absolute;inset:0;background:#0008}.welcome>*{position:relative;z-index:2}.eyebrow{font-size:9px;color:#ff7075;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.welcome h1{font-size:34px;margin:9px 0}.welcome p{font-size:12px;color:#eee;margin:0;max-width:650px}.currency{margin-top:18px;display:flex;gap:6px}.currency button{border:1px solid #ffffff55;background:#0005;color:#fff;border-radius:7px;padding:8px 11px;font-size:9px;font-weight:800;cursor:pointer}.currency button.active{background:#d71920;border-color:#d71920}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.stat{background:#fff;border:1px solid #eee;border-radius:13px;padding:18px}.stat strong{font-size:23px}.stat span{display:block;color:#888;font-size:10px;margin-top:5px}.section{background:#fff;border:1px solid #eee;border-radius:14px;padding:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section h2{font-size:18px;margin:0}.muted{font-size:10px;color:#888}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:15px}.card{border:1px solid #eee;border-radius:12px;overflow:hidden;background:#fff;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 35px #00000010}.photo{height:180px;background:#f0f0f0;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.tag{position:absolute;left:9px;top:9px;background:#d71920;color:#fff;border-radius:20px;padding:5px 8px;font-size:8px;font-weight:800}.info{padding:13px}.info h3{font-size:13px;margin:0 0 6px}.desc{font-size:10px;color:#888;line-height:1.5;min-height:30px}.price{font-size:16px;font-weight:900;margin-top:8px}.stock{font-size:9px;color:#777;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.actions a,.actions button{border:0;border-radius:7px;padding:10px 5px;text-align:center;text-decoration:none;font-size:9px;font-weight:800;cursor:pointer}.view{background:#171717;color:#fff}.add{background:#d71920;color:#fff}.add:disabled{background:#aaa}.loading,.empty,.error{padding:45px 15px;text-align:center;border-radius:10px}.loading{color:#888}.error{background:#fff2f2;color:#b71920}.empty{border:1px dashed #ddd;color:#888}.notice{position:fixed;right:18px;top:88px;width:min(390px,calc(100vw - 36px));background:#fff;border:1px solid #eee;border-radius:16px;box-shadow:0 25px 70px #0003;z-index:200;overflow:hidden;display:none}.notice.show{display:block;animation:pop .25s ease}@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}.notice-img{height:135px;background:#eee;position:relative}.notice-img img{width:100%;height:100%;object-fit:cover}.close{position:absolute;right:10px;top:9px;border:0;background:#0009;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer}.notice-body{padding:16px}.notice-body h3{margin:0 0 7px;font-size:15px}.notice-body p{font-size:11px;color:#777;line-height:1.6;margin:0}.notice-actions{display:flex;gap:7px;margin-top:13px}.notice-actions a,.notice-actions button{border:0;border-radius:7px;padding:10px 12px;font-size:9px;font-weight:800;text-decoration:none;cursor:pointer}.notice-actions a{background:#d71920;color:#fff}.notice-actions button{background:#eee;color:#555}@media(max-width:700px){body.sc-main-shift main{padding-left:0}.top{padding:0 14px}.menu{display:block}.content{padding:18px 13px}.stats{grid-template-columns:1fr}.welcome{padding:25px;min-height:205px}.welcome h1{font-size:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:145px}.actions{grid-template-columns:1fr}.avatar{width:36px;height:36px}.right .iconbtn{width:36px;height:36px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.photo{height:190px}}</style></head><body><main><header class="top"><button class="menu" id="menu">☰</button><div class="title">Home</div><div class="right"><a class="iconbtn" href="cart.html">🛒<span class="badge zero" id="cartBadge">0</span></a><a class="iconbtn" href="notifications.html">🔔<span class="badge zero" id="notificationBadge">0</span></a><img class="avatar" id="avatar" src="images/shop-1.jpg" alt="Profile"></div></header><div class="content"><section class="welcome"><img id="welcomeImage" src="images/shop-1.jpg" alt="Shop Camzon"><div class="eyebrow">Customer account</div><h1 id="welcomeTitle">Welcome back!</h1><p id="welcomeText">Your products are loading...</p><div class="currency"><button data-currency="USD">USD</button><button data-currency="NGN">NGN ₦</button><button data-currency="XAF">CFA</button></div></section><section class="stats"><div class="stat"><strong id="orderCount">0</strong><span>My Orders</span></div><div class="stat"><strong id="savedCount">0</strong><span>Saved Items</span></div><div class="stat"><strong id="spentTotal">—</strong><span>Total Spent</span></div></section><section class="section"><div class="sectionhead"><h2>Products</h2><span class="muted" id="productCount">Loading products...</span></div><div class="grid" id="productGrid"><div class="loading">Loading products...</div></div></section></div></main><div class="notice" id="notice"><div class="notice-img"><img id="noticeImage" src="images/shop-1.jpg" alt="Notification"><button class="close" id="noticeClose">×</button></div><div class="notice-body"><h3 id="noticeTitle">Notification</h3><p id="noticeMessage"></p><div class="notice-actions"><a id="noticeAction" href="notifications.html">View notification</a><button id="noticeDismiss">Dismiss</button></div></div></div><script type="module">import{App}from'./js/app.js';import{supabase}from'./js/supabase.js';import{loadNotifications,getUnreadCount,markNotificationRead,dismissNotification,subscribeToNotifications}from'./js/notifications.js';const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');const user=session.user;const $=id=>document.getElementById(id);const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const currencyKey='shopcamzon_currency';let currency=localStorage.getItem(currencyKey)||'USD';const rate={USD:1,NGN:1500,XAF:560};const symbol={USD:'$',NGN:'₦',XAF:'FCFA '};const money=v=>symbol[currency]+(Number(v||0)*rate[currency]).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});$('welcomeTitle').textContent='Welcome back, '+(user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split('@')[0]||'Customer').split(' ')[0]+'!';$('welcomeText').textContent='Discover products added by Shop Camzon and manage your account from here.';if(user.user_metadata?.avatar_url)$('avatar').src=user.user_metadata.avatar_url;document.querySelectorAll('[data-currency]').forEach(b=>{b.classList.toggle('active',b.dataset.currency===currency);b.onclick=()=>{currency=b.dataset.currency;localStorage.setItem(currencyKey,currency);document.querySelectorAll('[data-currency]').forEach(x=>x.classList.toggle('active',x===b));renderProducts(currentProducts)}});const welcomeImages=['images/shop-1.jpg','images/shop-2.jpg','images/shop-3.jpg'];let wi=0;setInterval(()=>{wi=(wi+1)%welcomeImages.length;$('welcomeImage').style.opacity='0';setTimeout(()=>{$('welcomeImage').src=welcomeImages[wi];$('welcomeImage').style.opacity='.26'},300)},4500);function updateCart(){const c=JSON.parse(localStorage.getItem('shopcamzon_cart')||'[]');const n=c.reduce((s,x)=>s+Number(x.quantity||0),0);$('cartBadge').textContent=n>99?'99+':n;$('cartBadge').classList.toggle('zero',n===0)}function addCart(p){const c=JSON.parse(localStorage.getItem('shopcamzon_cart')||'[]');const x=c.find(i=>String(i.id)===String(p.id));if(x)x.quantity=(Number(x.quantity)||0)+1;else c.push({id:p.id,name:p.name,price:Number(p.price),image:p.main_image_url||'images/shop-1.jpg',quantity:1});localStorage.setItem('shopcamzon_cart',JSON.stringify(c));updateCart();App.toast(p.name+' added to cart','success')}let currentProducts=[];function renderProducts(rows){currentProducts=rows||[];const grid=$('productGrid');$('productCount').textContent=currentProducts.length+' product'+(currentProducts.length===1?'':'s');if(!currentProducts.length){grid.innerHTML='<div class="empty">No products are available yet.<br><small>Products added by the admin will appear here.</small></div>';return}grid.innerHTML=currentProducts.map(p=>{const image=p.main_image_url||'images/shop-1.jpg';return `<article class="card"><div class="photo"><img src="${safe(image)}" alt="${safe(p.name)}" onerror="this.onerror=null;this.src='images/shop-1.jpg'">${p.is_featured?'<span class="tag">Featured</span>':''}</div><div class="info"><h3>${safe(p.name)}</h3><div class="desc">${safe(p.description||'Quality product from Shop Camzon.')}</div><div class="price">${money(p.price)}</div><div class="stock">${Number(p.stock)>0?Number(p.stock)+' in stock':'Out of stock'}</div><div class="actions"><a class="view" href="view-details.html?id=${encodeURIComponent(p.id)}">View Details</a><button class="add" ${Number(p.stock)<=0?'disabled':''} data-add="${p.id}">Add to Cart</button></div></div></article>`}).join('');grid.querySelectorAll('[data-add]').forEach(btn=>btn.onclick=()=>{const p=currentProducts.find(x=>String(x.id)===String(btn.dataset.add));if(p)addCart(p)})}async function loadProducts(){const grid=$('productGrid');try{const{data,error}=await supabase.from('products').select('id,name,slug,description,price,compare_price,stock,main_image_url,is_active,is_featured,is_trending,created_at').eq('is_active',true).order('created_at',{ascending:false});if(error)throw error;renderProducts(data||[])}catch(e){$('productCount').textContent='Unable to load';grid.innerHTML='<div class="error"><b>Unable to load products.</b><br><small>'+safe(e.message)+'</small><br><br><button id="retry" style="border:0;background:#d71920;color:#fff;border-radius:7px;padding:10px 15px;font-weight:700">Try again</button></div>';$('retry').onclick=loadProducts}}async function loadStats(){try{const o=await supabase.from('orders').select('id,total').eq('user_id',user.id);if(!o.error){$('orderCount').textContent=o.data?.length||0;$('spentTotal').textContent=money((o.data||[]).reduce((s,x)=>s+Number(x.total||0),0))}}catch(_){}try{const saved=JSON.parse(localStorage.getItem('shopcamzon_saved')||'[]');$('savedCount').textContent=saved.length}catch(_){} }async function showNotification(n){$('noticeImage').src=n.image_url||'images/shop-1.jpg';$('noticeTitle').textContent=n.title||'Shop Camzon';$('noticeMessage').textContent=n.message||'';$('noticeAction').textContent=n.action_label||'View notification';$('noticeAction').href=n.action_url||'notifications.html';$('notice').classList.add('show');$('noticeClose').onclick=()=>$('notice').classList.remove('show');$('noticeDismiss').onclick=async()=>{try{await dismissNotification(n.id,user.id)}catch(_){}$('notice').classList.remove('show')}}async function loadNotice(){try{const rows=await loadNotifications({limit:5,userId:user.id});const unread=await getUnreadCount(user.id);$('notificationBadge').textContent=unread>99?'99+':unread;$('notificationBadge').classList.toggle('zero',unread===0);const n=rows.find(x=>!x.is_read);if(n){await markNotificationRead(n.id,user.id);await showNotification(n)}}catch(e){console.warn('Notification load failed',e.message)}}$('menu')?.addEventListener('click',()=>document.getElementById('sidebar')?.classList.toggle('open'));updateCart();await Promise.allSettled([loadProducts(),loadStats(),loadNotice()]);try{subscribeToNotifications(async payload=>{if(payload.new?.user_id===user.id){$('notificationBadge').classList.remove('zero');$('notificationBadge').textContent='1';await showNotification(payload.new)}},user.id)}catch(_){} </script></body></html>
