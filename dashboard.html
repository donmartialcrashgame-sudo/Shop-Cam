<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Dashboard | Shop Camzon</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7f8;color:#171717}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#111;color:#fff;z-index:20;padding:25px 16px;overflow:hidden}.slides{position:absolute;inset:0}.slide{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1s}.slide.active{opacity:1}.shade{position:absolute;inset:0;background:#000b}.sidebar>*:not(.slides):not(.shade){position:relative;z-index:2}.logo{display:block;color:#fff;text-decoration:none;font-size:25px;font-weight:800;padding:0 12px 25px}.logo span{color:#d71920}.label{font-size:9px;color:#ddd;text-transform:uppercase;letter-spacing:1.5px;font-weight:800;padding:8px 12px}.nav{display:flex;flex-direction:column;gap:4px}.nav a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:11px 12px;border-radius:8px;font-size:13px;font-weight:600}.nav a:hover,.nav a.active{background:#d71920}.icon{width:20px;text-align:center}.bottom{position:absolute!important;left:16px;right:16px;bottom:22px}.signout{width:100%;padding:11px;border:1px solid #fff5;background:#0008;color:#fff;border-radius:8px;font-weight:700;cursor:pointer}.main{margin-left:250px;min-height:100vh}.header{height:70px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 35px;position:sticky;top:0;z-index:10}.header h2{font-size:18px;margin:0}.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}.header-btn{position:relative;width:40px;height:40px;border:1px solid #eee;border-radius:9px;background:#fff;display:grid;place-items:center;text-decoration:none;color:#222;font-size:18px}.badge{position:absolute;right:4px;top:3px;min-width:16px;height:16px;padding:0 4px;border-radius:10px;background:#d71920;color:#fff;font-size:8px;display:grid;place-items:center}.badge.zero{display:none}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;margin-left:5px;border:1px solid #eee}.user{font-size:11px;color:#777}.content{padding:32px;width:min(1250px,100%);margin:auto}.welcome{min-height:230px;border-radius:15px;background:#111;color:#fff;position:relative;overflow:hidden;padding:38px;display:flex;flex-direction:column;justify-content:center}.welcome-bg{position:absolute;inset:0;background:center/cover no-repeat;opacity:.3}.welcome-shade{position:absolute;inset:0;background:#0008}.welcome>*{position:relative;z-index:2}.eyebrow{font-size:10px;color:#ff7378;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.welcome h1{font-size:35px;margin:10px 0 8px}.welcome p{margin:0;color:#eee;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.stat{background:#fff;border:1px solid #eee;border-radius:12px;padding:20px}.stat strong{font-size:25px}.stat span{display:block;color:#888;font-size:11px;margin-top:5px}.section{background:#fff;border:1px solid #eee;border-radius:12px;padding:24px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section h2{font-size:19px;margin:0}.muted{color:#888;font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:17px}.product{border:1px solid #eee;border-radius:10px;overflow:hidden;background:#fff;transition:.25s}.product:hover{transform:translateY(-3px);box-shadow:0 12px 30px #0000000c}.pic{height:180px;background:#eee center/cover no-repeat}.info{padding:14px}.info h3{font-size:14px;margin:0 0 7px}.desc{font-size:11px;color:#888;min-height:32px;line-height:1.5}.price{font-size:17px;font-weight:800;margin-top:10px}.stock{font-size:10px;color:#777;margin-top:5px}.view{display:block;text-align:center;margin-top:11px;padding:10px;border-radius:7px;background:#d71920;color:#fff;text-decoration:none;font-size:11px;font-weight:700}.loading,.empty{padding:48px 15px;text-align:center;border:1px dashed #ddd;border-radius:9px;color:#888;font-size:13px}.skeleton{height:300px;border-radius:10px;background:linear-gradient(90deg,#eee,#f7f7f7,#eee);background-size:200% 100%;animation:load 1.2s infinite}@keyframes load{to{background-position:-200% 0}}.menu{display:none;border:0;background:none;font-size:22px;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;z-index:100;padding:13px 16px;background:#171717;color:#fff;border-radius:9px;font-size:12px;box-shadow:0 12px 35px #0003;animation:up .25s ease}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu{display:block;margin-right:15px}.header{padding:0 16px}.user{display:none}.content{padding:20px 14px}.stats{grid-template-columns:1fr}.welcome{min-height:210px;padding:27px}.welcome h1{font-size:29px}.grid{grid-template-columns:1fr}.header-btn{width:37px;height:37px}.avatar{width:37px;height:37px}}
</style></head>
<body>
<aside class="sidebar" id="sidebar"><div class="slides"><div class="slide active" style="background-image:url('images/shop-1.jpg')"></div><div class="slide" style="background-image:url('images/shop-2.jpg')"></div><div class="slide" style="background-image:url('images/shop-3.jpg')"></div></div><div class="shade"></div><a class="logo" href="dashboard.html"><span>Shop</span> Camzon</a><div class="label">Account</div><nav class="nav"><a class="active" href="dashboard.html"><span class="icon">⌂</span>Home</a><a href="cart.html"><span class="icon">🛒</span>Cart</a><a href="orders.html"><span class="icon">▣</span>My Orders</a><a href="saved.html"><span class="icon">♡</span>Saved Items</a><a href="profile.html"><span class="icon">♙</span>Profile</a><a href="notifications.html"><span class="icon">🔔</span>Notifications</a><a href="settings.html"><span class="icon">⚙</span>Settings</a></nav><div class="bottom"><button class="signout" id="logout">Sign out</button></div></aside>
<main class="main"><header class="header"><button class="menu" id="menu">☰</button><h2>Home</h2><div class="header-right"><a class="header-btn" href="cart.html">🛒<span class="badge zero" id="cartBadge">0</span></a><a class="header-btn" href="notifications.html">🔔<span class="badge zero" id="notificationBadge">0</span></a><span class="user" id="userEmail"></span><img class="avatar" id="avatar" alt="Profile" src="images/shop-1.jpg"></div></header>
<div class="content"><section class="welcome"><div class="welcome-bg" id="welcomeBg"></div><div class="welcome-shade"></div><div class="eyebrow">Customer account</div><h1 id="welcomeTitle">Welcome back!</h1><p id="welcomeText">Loading your account...</p></section>
<section class="stats"><div class="stat"><strong id="orderCount">0</strong><span>My Orders</span></div><div class="stat"><strong id="savedCount">0</strong><span>Saved Items</span></div><div class="stat"><strong id="spentTotal">0</strong><span>Total Spent</span></div></section>
<section class="section"><div class="section-head"><h2>Products</h2><span class="muted" id="productCount">Loading...</span></div><div class="grid" id="productGrid"><div class="skeleton"></div><div class="skeleton"></div></div></section></div></main>
<script type="module">
import{App}from'./js/app.js';import{loadNotifications,getUnreadCount,subscribeToNotifications}from'./js/notifications.js';import{supabase}from'./js/supabase.js';
const session=await App.requireAuth();if(!session)throw new Error('Not authenticated');
const user=session.user;const name=user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split('@')[0]||'Customer';document.getElementById('userEmail').textContent=user.email||'';document.getElementById('welcomeTitle').textContent='Welcome back, '+name.split(' ')[0]+'!';document.getElementById('welcomeText').textContent='Discover products added by Shop Camzon and manage your account from here.';if(user.user_metadata?.avatar_url)document.getElementById('avatar').src=user.user_metadata.avatar_url;
// Rotating sidebar/welcome imagery.
const slides=[...document.querySelectorAll('.slide')],welcome=document.getElementById('welcomeBg');let slideIndex=0;const images=['images/shop-1.jpg','images/shop-2.jpg','images/shop-3.jpg'];welcome.style.backgroundImage=`url('${images[0]}')`;setInterval(()=>{slides[slideIndex].classList.remove('active');slideIndex=(slideIndex+1)%slides.length;slides[slideIndex].classList.add('active');welcome.style.backgroundImage=`url('${images[slideIndex]}')`},4500);
document.getElementById('menu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('logout').onclick=()=>App.signOut();
const safe=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function renderNotifications(){try{const count=await getUnreadCount();const badge=document.getElementById('notificationBadge');badge.textContent=count>99?'99+':count;badge.classList.toggle('zero',count===0)}catch(e){console.warn('Notifications:',e.message)}}
async function renderProducts(){const grid=document.getElementById('productGrid');try{const{data,error}=await supabase.from('products').select('id,name,slug,description,price,compare_price,stock,main_image_url').eq('is_active',true).order('created_at',{ascending:false});if(error)throw error;document.getElementById('productCount').textContent=`${data.length} product${data.length===1?'':'s'}`;if(!data.length){grid.innerHTML='<div class="empty">No products are available yet.</div>';return}grid.innerHTML=data.map(p=>`<article class="product"><div class="pic" style="background-image:url('${safe(p.main_image_url||'images/shop-1.jpg')}')"></div><div class="info"><h3>${safe(p.name)}</h3><div class="desc">${safe(p.description||'Shop Camzon product')}</div><div class="price">${App.formatCurrency(p.price,'USD')}</div><div class="stock">${Number(p.stock)>0?Number(p.stock)+' in stock':'Out of stock'}</div><a class="view" href="view-details.html?id=${encodeURIComponent(p.id)}">View Details</a></div></article>`).join('')}catch(e){grid.innerHTML=`<div class="empty">Unable to load products. ${safe(e.message)}</div>`;document.getElementById('productCount').textContent='Error'}}
async function renderStats(){try{const orders=await supabase.from('orders').select('id,total_amount',{count:'exact'}).eq('user_id',user.id);if(!orders.error){document.getElementById('orderCount').textContent=orders.count||0;document.getElementById('spentTotal').textContent=App.formatCurrency((orders.data||[]).reduce((s,o)=>s+Number(o.total_amount||0),0),'USD')}}catch{}try{const saved=await supabase.from('saved_items').select('id',{count:'exact',head:true}).eq('user_id',user.id);if(!saved.error)document.getElementById('savedCount').textContent=saved.count||0}catch{}}
await Promise.all([renderProducts(),renderNotifications(),renderStats()]);const channel=subscribeToNotifications(()=>renderNotifications());window.addEventListener('beforeunload',()=>{if(channel)supabase.removeChannel(channel)});
</script></body></html>
