<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Signing in | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff,#fff5f5);color:#171717}.box{width:min(430px,calc(100% - 40px));background:#fff;border:1px solid #eee;border-radius:16px;padding:45px 35px;text-align:center;box-shadow:0 20px 60px #0001}.logo{font-size:26px;font-weight:800}.logo span{color:#d71920}.spinner{width:38px;height:38px;border:4px solid #eee;border-top-color:#d71920;border-radius:50%;animation:spin .8s linear infinite;margin:28px auto 20px}@keyframes spin{to{transform:rotate(360deg)}}p{color:#777;font-size:14px;line-height:1.6}.error{color:#b9151b}.btn{display:inline-block;margin-top:15px;background:#d71920;color:#fff;padding:12px 18px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:700}</style></head><body><main class="box"><div class="logo"><span>Shop</span> Camzon</div><div class="spinner"></div><h2 id="title">Completing sign in...</h2><p id="text">Please wait while we securely complete your authentication.</p><a id="back" class="btn" href="login.html" style="display:none">Back to login</a></main><script type="module">import{supabase}from'./js/supabase.js';const title=document.getElementById('title'),text=document.getElementById('text'),back=document.getElementById('back');try{const{data,error}=await supabase.auth.getSession();if(error)throw error;if(data.session){title.textContent='Welcome to Shop Camzon!';text.textContent='Your account is ready. Redirecting you to your dashboard...';setTimeout(()=>location.href='dashboard.html',900)}else{title.textContent='Authentication required';text.textContent='We could not find an active session. Please return to login and try again.';text.className='error';back.style.display='inline-block'}}catch(error){title.textContent='Something went wrong';text.textContent=error.message||'Authentication could not be completed.';text.className='error';back.style.display='inline-block'}}</script></body></html>
