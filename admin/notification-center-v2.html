<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Camzon Notification Center</title><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#171717}.wrap{max-width:1050px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:15px;padding:18px}h1{margin-top:0}.field{margin:12px 0}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}select,input,textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;font:inherit}textarea{min-height:130px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer;background:#df1d25;color:#fff}.preview{border:1px solid #ddd;border-radius:14px;overflow:hidden}.preview img{width:100%;height:200px;object-fit:cover;background:#eee}.preview div{padding:16px}.preview h2{margin:0 0 8px}.preview p{white-space:pre-wrap;line-height:1.5;color:#555}.status{margin-top:12px;padding:10px;border-radius:8px;display:none}.ok{display:block;background:#eaf8ef;color:#176534}.err{display:block;background:#fff0f0;color:#a51d2d}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="index.html">← Back to Admin Dashboard</a></p><h1>🔔 Notification Center</h1><div class="grid"><section class="card"><div class="field"><label>👤 Select Customer</label><select id="customer"><option>Loading customers…</option></select></div><div class="field"><label>📋 Select Template</label><select id="template"><option>Loading templates…</option></select></div><div class="field" id="orderBox" style="display:none"><label>📦 Select Order</label><select id="order"></select></div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Message</label><textarea id="message"></textarea></div><div class="field"><label>Type</label><input id="type"></div><div class="field"><label>Action Label</label><input id="action"></div><div class="field"><label>Action URL</label><input id="url"></div><div class="field"><label>🖼️ Image URL</label><input id="image"></div><button class="btn" id="send">🚀 Send Notification</button><div id="status" class="status"></div></section><section class="card"><h2>👀 Preview</h2><div class="preview"><img id="pimg"><div><h2 id="ptitle">Notification</h2><p id="pmessage">Choose a template to preview it.</p><button class="btn" id="paction" style="display:none"></button></div></div></section></div></div><script type="module">import{supabase}from'../js/supabase.js';const $=x=>document.getElementById(x);let customers=[],templates=[],orders=[];function status(m,e){$('status').textContent=m;$('status').className='status '+(e?'err':'ok')}function customer(){return customers.find(x=>x.id==$('customer').value)}function replace(s){const c=customer()||{},o=orders.find(x=>x.id==$('order').value)||{};return String(s||'').replaceAll('{customer_name}',c.full_name||'Customer').replaceAll('{order_id}',o.id||'').replaceAll('{order_total}',o.total||o.total_amount||'')}function preview(){ $('ptitle').textContent=$('title').value||'Notification';$('pmessage').textContent=$('message').value||'';$('pimg').src=$('image').value||'https://shopcamzon.com/favicon.png';$('paction').textContent=$('action').value||'';$('paction').style.display=$('action').value?'inline-block':'none'}function apply(){const t=templates.find(x=>x.id==$('template').value);if(!t)return;$('title').value=replace(t.title);$('message').value=replace(t.message);$('type').value=t.type||'info';$('action').value=replace(t.action_label||'');$('url').value=replace(t.action_url||'');$('image').value=t.image_url||'';preview()}async function init(){try{const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='login.html';return}const a=await supabase.from('admins').select('id').eq('id',session.user.id).eq('is_active',true).maybeSingle();if(a.error||!a.data){location.href='login.html';return}const[c,t]=await Promise.all([supabase.rpc('admin_notification_customers'),supabase.from('notification_templates').select('*').eq('is_active',true).order('name')]);if(c.error)throw c.error;if(t.error)throw t.error;customers=c.data||[];templates=t.data||[];$('customer').innerHTML='<option value="">Choose customer…</option>'+customers.map(x=>'<option value="'+x.id+'">'+(x.full_name||'Customer')+'</option>').join('');$('template').innerHTML='<option value="">Choose template…</option>'+templates.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');if(!customers.length)status('No customers found.',true);if(!templates.length)status('No active templates found.',true)}catch(e){status(e.message||'Unable to load data.',true)}}async function loadOrders(){if(!$('customer').value){$('orderBox').style.display='none';return}const r=await supabase.rpc('admin_notification_orders',{p_user_id:$('customer').value});if(r.error){status(r.error.message,true);return}orders=r.data||[];$('order').innerHTML='<option value="">Choose order…</option>'+orders.map(o=>'<option value="'+o.id+'">#'+(o.order_number||o.id)+'</option>').join('');$('orderBox').style.display=orders.length?'block':'none'}$('customer').onchange=async()=>{await loadOrders();apply()};$('template').onchange=apply;$('order').onchange=apply;['title','message','type','action','url','image'].forEach(id=>$(id).oninput=preview);$('send').onclick=async()=>{const c=customer();if(!c)return status('Select a customer first.',true);$('send').disabled=true;const r=await supabase.from('notifications').insert({user_id:c.id,title:$('title').value,message:$('message').value,type:$('type').value||'info',action_label:$('action').value||null,action_url:$('url').value||null,image_url:$('image').value||null});$('send').disabled=false;if(r.error)return status(r.error.message,true);status('Notification sent to '+(c.full_name||'customer')+' ✅')};init();</script></body></html>
