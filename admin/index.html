<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Camzon Admin</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}iframe{width:100%;height:100%;border:0}.tools{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px}.tools button{border:0;border-radius:12px;background:#df1d25;color:#fff;padding:13px 17px;font-weight:800;box-shadow:0 8px 25px #0003;cursor:pointer}.tools button:hover{filter:brightness(.92)}</style></head><body><iframe id="panel" title="Shop Camzon Administration"></iframe><div class="tools"><button id="support">💬 Live Support</button><button id="notify">🔔 Notifications</button></div><script type="module">import{supabase}from'../js/supabase.js';const{data:{session}}=await supabase.auth.getSession();if(!session){location.replace('./login.html')}else{const{data:p,error}=await supabase.from('admins').select('id,role,is_active').eq('id',session.user.id).maybeSingle();if(error||!p||!p.is_active||!['admin','manager','order_staff'].includes(p.role)){await supabase.auth.signOut();location.replace('./login.html')}else{document.getElementById('panel').src='../admin.html';document.getElementById('support').onclick=()=>location.href='./support.html';document.getElementById('notify').onclick=()=>location.href='./notification-center-v2.html'}}window.addEventListener('message',e=>{if(e.data==='admin-signout')location.replace('./login.html')});</script></body></html>
