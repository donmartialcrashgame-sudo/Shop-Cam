<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Camzon Admin</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="panel" title="Shop Camzon Administration"></iframe><script type="module">import{supabase}from'../js/supabase.js';const{data:{session}}=await supabase.auth.getSession();if(!session){location.replace('./login.html')}else{const{data:p}=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!p||!['admin','manager','order_staff'].includes(p.role)){await supabase.auth.signOut();location.replace('./login.html')}else{document.getElementById('panel').src='../admin.html'}}window.addEventListener('message',e=>{if(e.data==='admin-signout')location.replace('./login.html')});</script></body></html>
