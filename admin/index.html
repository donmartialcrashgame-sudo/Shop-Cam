<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Camzon Admin</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8}iframe{width:100%;height:100%;border:0}.tools{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px}.tools button{border:0;border-radius:14px;background:#df1d25;color:#fff;padding:13px 17px;font-weight:800;box-shadow:0 8px 25px #0003;cursor:pointer}.tools button:hover{transform:translateY(-1px);filter:brightness(.96)}.chat{position:fixed;right:18px;bottom:76px;width:min(760px,calc(100vw - 36px));height:min(680px,calc(100vh - 105px));background:#fff;border:1px solid #eee;border-radius:20px;box-shadow:0 20px 60px #0004;z-index:60;display:none;overflow:hidden}.chat.open{display:block}.chat iframe{width:100%;height:100%;border:0}.close{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:#222;font-size:18px;cursor:pointer;box-shadow:0 3px 12px #0003}@media(max-width:650px){.tools{right:12px;bottom:12px}.chat{right:8px;bottom:66px;width:calc(100vw - 16px);height:calc(100vh - 82px);border-radius:16px}}</style></head><body><iframe id="panel" title="Shop Camzon Administration"></iframe><div class="tools"><button id="support">💬 Live Support</button><button id="notify">🔔 Notifications</button></div><div class="chat" id="chat"><button class="close" id="close" title="Close">×</button><iframe src="./support.html" title="Live customer support"></iframe></div><script type="module">import{supabase}from'../js/supabase.js';const panel=document.getElementById('panel'),chat=document.getElementById('chat');const{data:{session}}=await supabase.auth.getSession();if(!session){location.replace('./login.html')}else{const{data:p,error}=await supabase.from('admins').select('id,role,is_active').eq('id',session.user.id).maybeSingle();if(error||!p||!p.is_active||!['admin','manager','order_staff'].includes(p.role)){await supabase.auth.signOut();location.replace('./login.html')}else{panel.src='../admin.html';panel.addEventListener('load',enhanceAdmin)}}document.getElementById('support').onclick=()=>chat.classList.toggle('open');document.getElementById('close').onclick=()=>chat.classList.remove('open');document.getElementById('notify').onclick=()=>location.href='./notification-center-v2.html';function enhanceAdmin(){try{const d=panel.contentDocument;if(!d)return;const style=d.createElement('style');style.textContent='.status-select{border-radius:10px!important;border:1px solid #eee!important;padding:9px!important;background:#fff!important;font-weight:800}.badge{transition:.2s}.status-tracker{display:flex;align-items:center;gap:6px;margin-top:10px;padding:10px 0}.status-tracker .tstep{flex:1;text-align:center;font-size:8px;color:#aaa}.status-tracker .tdot{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;margin:auto auto 5px;background:#eee;color:#aaa;font-weight:900}.status-tracker .tline{height:3px;flex:1;background:#eee;border-radius:99px;position:relative;overflow:hidden}.status-tracker .tline.active{background:#f4b7b9}.status-tracker .tline.active:after{content:"";position:absolute;inset:0;width:45%;background:#df1d25;animation:adminPulse 1.4s ease-in-out infinite alternate}.status-tracker .tstep.done .tdot{background:#df1d25;color:#fff}.status-tracker .tstep.processing .tdot{background:#f59e0b;color:#fff}.status-tracker .tstep.shipped .tdot{background:#2563eb;color:#fff}.status-tracker .tstep.delivered .tdot{background:#16a34a;color:#fff}@keyframes adminPulse{from{transform:translateX(-20%)}to{transform:translateX(150%)}}.sk,.skeleton{position:relative;overflow:hidden}.sk:after,.skeleton:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:adminShimmer 1.2s infinite}@keyframes adminShimmer{100%{transform:translateX(100%)}}';d.head.appendChild(style);const enhance=()=>{const table=d.querySelector('#ordersTable');if(!table)return;table.querySelectorAll('tbody tr').forEach(row=>{if(row.querySelector('.status-tracker'))return;const sel=row.querySelector('.status-select');if(!sel)return;const st=sel.value||'pending',steps=['pending','processing','shipped','delivered'],idx=Math.max(0,steps.indexOf(st));const box=d.createElement('div');box.className='status-tracker';box.innerHTML=steps.map((x,i)=>`<div class="tstep ${i<idx?'done ':''}${i===idx?' '+x:''}"><div class="tdot">${i<idx?'✓':i===idx?'●':'○'}</div>${x}</div>${i<3?`<div class="tline ${i<idx?'active':''}"></div>`:''}`).join('');row.lastElementChild?.appendChild(box);sel.addEventListener('change',()=>setTimeout(enhance,50))})};enhance();new MutationObserver(enhance).observe(d.body,{subtree:true,childList:true})}catch(e){console.warn('Admin enhancement skipped',e)}}window.addEventListener('message',e=>{if(e.data==='admin-signout')location.replace('./login.html')});</script></body></html>
