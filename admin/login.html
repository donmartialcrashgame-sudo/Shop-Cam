<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;font-family:Arial,sans-serif;color:#171717}.card{width:min(420px,calc(100% - 32px));background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 70px #0008}.logo{font-size:27px;font-weight:900;margin-bottom:6px}.logo span{color:#df1d25}.sub{color:#777;font-size:12px;margin-bottom:24px}.label{display:block;font-size:10px;font-weight:800;margin:14px 0 6px;text-transform:uppercase}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:13px}.btn{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#df1d25;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:12px;padding:10px;border-radius:9px;font-size:11px;display:none}.error{display:block;background:#fff0f0;color:#b00008}.hint{margin-top:18px;font-size:10px;color:#999;text-align:center}</style></head><body><main class="card"><div class="logo"><span>Shop</span> Camzon</div><div class="sub">Secure administration portal</div><form id="form"><label class="label">Admin email</label><input class="input" id="email" type="email" autocomplete="username" required><label class="label">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required><button class="btn" id="submit">Sign in to Admin</button><div id="msg" class="msg"></div></form><div class="hint">This area is restricted to authorized Shop Camzon staff.</div></main><script type="module">import{supabase}from'../js/supabase.js';const form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submit');form.addEventListener('submit',async e=>{e.preventDefault();msg.className='msg';msg.textContent='';btn.disabled=true;btn.textContent='Checking...';try{const{data,error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;if(!data.session)throw new Error('Unable to create an admin session.');const{data:p,error:pe}=await supabase.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(!p||!['admin','manager','order_staff'].includes(p.role)){await supabase.auth.signOut();throw new Error('Access denied. This account is not authorized for administration.')}location.href='./index.html'}catch(e){msg.className='msg error';msg.textContent=e.message}finally{btn.disabled=false;btn.textContent='Sign in to Admin'}})</script></body></html>
