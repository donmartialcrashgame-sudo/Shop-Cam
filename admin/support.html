<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d71920"><title>Live Support | Shop Camzon</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f5f7;color:#171717}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-columns:330px 1fr}.list{background:#fff;border-right:1px solid #e8e8e8;display:flex;flex-direction:column;min-width:0}.list-head{padding:18px;border-bottom:1px solid #eee}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:950}.brand img{width:35px;height:35px;border-radius:10px;background:#fff}.brand span{color:#d71920}.presence{margin-top:14px;padding:12px;border-radius:15px;background:#fafafa;border:1px solid #eee}.presence-row{display:flex;justify-content:space-between;align-items:center}.presence b{font-size:11px}.presence small{display:block;color:#888;font-size:9px;margin-top:4px}.presence button{border:0;border-radius:999px;padding:8px 12px;color:#fff;font-size:9px;font-weight:900}.on{background:#16a34a}.off{background:#777}.count{font-size:9px;color:#999;margin-top:13px}.convos{overflow:auto;padding:8px}.conv{position:relative;padding:13px 12px;border-radius:14px;margin:4px 0;cursor:pointer;border:1px solid transparent}.conv:hover{background:#fafafa}.conv.active{background:#fff4f4;border-color:#f2c7c9}.avatar{width:39px;height:39px;border-radius:50%;background:#ffe2e3;color:#c8171e;display:grid;place-items:center;font-weight:950;float:left;margin-right:10px}.conv b{font-size:11px}.conv small{display:block;color:#888;font-size:8px;margin-top:4px}.badge{display:inline-flex;margin-top:6px;border-radius:999px;padding:4px 7px;font-size:7px;font-weight:900;background:#eee}.badge.calling{background:#fff0cf;color:#9a6500}.badge.connected{background:#e6f8ed;color:#16803c}.badge.resolved{background:#e9e9eb;color:#666}.resolve{position:absolute;right:9px;bottom:10px;border:0;border-radius:8px;background:#fff0f0;color:#c8171e;padding:6px 8px;font-size:7px;font-weight:950;cursor:pointer}.chat{display:flex;flex-direction:column;min-width:0;position:relative}.top{height:72px;background:#d71920;color:#fff;padding:12px 18px;display:flex;align-items:center;gap:10px}.back{display:none;border:0;background:#ffffff22;color:#fff;width:38px;height:38px;border-radius:50%;font-size:19px}.top .avatar{float:none;margin:0;background:#fff;color:#d71920}.top b{font-size:13px}.top small{display:block;font-size:8px;color:#ffe4e4;margin-top:4px}.top-actions{margin-left:auto;display:flex;gap:7px}.call,.resolveTop{border:0;border-radius:10px;padding:10px 12px;font-size:9px;font-weight:950;cursor:pointer}.call{background:#fff;color:#d71920}.resolveTop{background:#b9141b;color:#fff}.msgs{flex:1;overflow:auto;padding:20px;background:#f8f8f8}.empty{text-align:center;color:#999;padding:80px 20px;font-size:11px}.bubble{max-width:min(70%,520px);padding:10px 13px;border-radius:16px;margin:7px 0;font-size:11px;line-height:1.5;box-shadow:0 2px 8px #00000008}.customer{background:#fff;border:1px solid #eee;border-bottom-left-radius:4px}.agent{margin-left:auto;background:#d71920;color:#fff;border-bottom-right-radius:4px}.meta{display:block;font-size:7px;opacity:.65;margin-top:5px}.bubble img{max-width:280px;max-height:220px;border-radius:10px;display:block;margin-top:7px}.bubble audio{width:min(280px,100%);margin-top:7px}.compose{background:#fff;border-top:1px solid #eee;padding:10px;display:flex;gap:6px;align-items:center}.compose input{flex:1;border:1px solid #ddd;border-radius:13px;padding:12px;outline:0;font-size:11px}.icon{width:43px;height:43px;border:1px solid #eee;border-radius:12px;background:#fff;cursor:pointer;font-size:18px}.send{width:45px;height:43px;border:0;border-radius:12px;background:#d71920;color:#fff;font-size:17px}.recording{background:#ffe5e5;color:#d71920;border-color:#d71920}.preview{padding:7px 12px;background:#fff4f4;color:#b71920;font-size:8px;display:none}.incoming{position:fixed;top:16px;right:16px;width:min(360px,calc(100vw - 32px));z-index:999;background:#fff;border:1px solid #eee;border-left:4px solid #d71920;border-radius:17px;box-shadow:0 20px 55px #0004;padding:15px;animation:in .25s ease}.incoming strong{display:block;font-size:12px}.incoming small{display:block;color:#777;font-size:9px;margin:5px 0 12px}.incoming .actions{display:flex;gap:7px}.incoming button{flex:1;border:0;border-radius:9px;padding:10px;font-size:9px;font-weight:950;cursor:pointer}.answer{background:#16a34a;color:#fff}.decline{background:#ffe9e9;color:#bd1d1d}.skip{background:#eee;color:#444}@keyframes in{from{transform:translateY(-15px);opacity:0}to{transform:none;opacity:1}}.skeleton{padding:20px}.sk{height:52px;border-radius:13px;background:#e8e8ea;margin:9px 0;position:relative;overflow:hidden}.sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#fff9,transparent);animation:sh 1.2s infinite}@keyframes sh{to{transform:translateX(100%)}}@media(max-width:760px){.app{display:block}.list{height:100vh}.chat{display:none;height:100vh}.app.chat-open .list{display:none}.app.chat-open .chat{display:flex}.back{display:block}.bubble{max-width:86%}.top-actions .resolveTop{display:none}}@media(min-width:761px){.app.chat-open .list{display:flex}.app.chat-open .chat{display:flex}}</style></head><body><div class="app" id="app"><aside class="list"><div class="list-head"><div class="brand"><img src="https://shopcamzon.com/favicon.png"><div><span>Shop</span> Camzon</div></div><div class="presence"><div class="presence-row"><div><b>Customer Care</b><small id="presenceText">⚪ Offline</small></div><button id="presenceBtn" class="off">Go Online</button></div></div><div class="count" id="count">Loading conversations...</div></div><div class="convos" id="convos"><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></aside><main class="chat"><header class="top"><button class="back" id="back">‹</button><div class="avatar" id="topAvatar">💬</div><div><b id="title">Select a customer</b><small id="topStatus">Customer Care Offline</small></div><div class="top-actions"><button class="call" id="callBtn" disabled>📞 Call</button><button class="resolveTop" id="resolveTop" disabled>✓ Resolve</button></div></header><div class="msgs" id="msgs"><div class="empty">💬 Select a customer to open the conversation.</div></div><div class="preview" id="preview"></div><form class="compose" id="form"><input id="file" type="file" hidden accept="image/*,application/pdf,.doc,.docx,.txt,.zip"><button class="icon" id="attach" type="button">📎</button><button class="icon" id="voice" type="button">🎙️</button><input id="input" placeholder="Type a message..." maxlength="2000" autocomplete="off"><button class="send" type="submit">➤</button></form></main></div><script type="module">import{supabase}from'../js/supabase.js';import{createVoiceCall}from'../js/voice-call.js';const $=id=>document.getElementById(id),app=$('app'),convos=$('convos'),msgs=$('msgs'),form=$('form'),input=$('input'),file=$('file'),preview=$('preview'),presenceBtn=$('presenceBtn'),presenceText=$('presenceText'),count=$('count'),callBtn=$('callBtn'),resolveTop=$('resolveTop'),back=$('back');let session,current,presenceChannel,msgChannel,callApi,recorder,chunks=[],recordStarted=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const time=v=>new Date(v).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});async function auth(){const{data:{session:s}}=await supabase.auth.getSession();if(!s){location.replace('./login.html');return false}const{data:a,error}=await supabase.from('admins').select('id,role,is_active').eq('id',s.user.id).maybeSingle();if(error||!a||!a.is_active||!['admin','manager','order_staff'].includes(a.role)){await supabase.auth.signOut();location.replace('./login.html');return false}session=s;return true}function presence(on){presenceText.textContent=on?'🟢 Online':'⚪ Offline';presenceBtn.textContent=on?'Go Offline':'Go Online';presenceBtn.className=on?'on':'off';$('topStatus').textContent=on?'🟢 Customer Care Online':'⚪ Customer Care Offline'}async function loadPresence(){const{data}=await supabase.from('support_agent_presence').select('is_online').eq('agent_id',session.user.id).maybeSingle();presence(!!data?.is_online)}async function setPresence(on){presenceBtn.disabled=true;const{error}=await supabase.from('support_agent_presence').upsert({agent_id:session.user.id,is_online:on,updated_at:new Date().toISOString()},{onConflict:'agent_id'});if(error)alert('Unable to change availability: '+error.message);else presence(on);presenceBtn.disabled=false}presenceBtn.onclick=()=>setPresence(!presenceBtn.classList.contains('on'));async function loadList(){const{data,error}=await supabase.from('support_conversations').select('*').order('updated_at',{ascending:false});if(error){convos.innerHTML='<div class="empty">Unable to load conversations: '+esc(error.message)+'</div>';return}count.textContent=(data||[]).length+' conversation'+((data||[]).length===1?'':'s');convos.innerHTML=(data||[]).map(c=>{const st=String(c.status||'open').toLowerCase(),cs=String(c.call_status||'idle').toLowerCase();return `<div class="conv ${current?.id===c.id?'active':''}" data-id="${c.id}"><div class="avatar">👤</div><b>Customer</b><small>${esc(c.category||'General Support')} · ${new Date(c.updated_at||c.created_at).toLocaleString()}</small><small>ID: ${esc(c.user_id)}</small>${cs!=='idle'?`<span class="badge ${cs}">📞 ${esc(cs)}</span>`:''}${st==='resolved'?'<span class="badge resolved">✓ Resolved</span>':`<button class="resolve" data-resolve="${c.id}">✓ Resolve</button>`}</div>`}).join('')||'<div class="empty">No conversations yet.</div>';document.querySelectorAll('.conv').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-resolve]'))return;open(x.dataset.id)});document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=e=>{e.stopPropagation();resolveConversation(b.dataset.resolve)})}async function open(id){const{data:c,error}=await supabase.from('support_conversations').select('*').eq('id',id).single();if(error)return alert(error.message);current=c;app.classList.add('chat-open');$('title').textContent='Customer';$('topAvatar').textContent='👤';callBtn.disabled=c.status==='resolved';resolveTop.disabled=c.status==='resolved';resolveTop.textContent=c.status==='resolved'?'✓ Resolved':'✓ Resolve';await loadMessages();if(msgChannel)await supabase.removeChannel(msgChannel);msgChannel=supabase.channel('admin-msg-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+id},p=>append(p.new)).subscribe();await loadList()}async function loadMessages(){const{data,error}=await supabase.from('support_messages').select('*').eq('conversation_id',current.id).order('created_at',{ascending:true});if(error){msgs.innerHTML='<div class="empty">Unable to load messages: '+esc(error.message)+'</div>';return}msgs.innerHTML='';(data||[]).forEach(append);msgs.scrollTop=msgs.scrollHeight}function append(m){if(msgs.querySelector(`[data-id="${m.id}"]`))return;const d=document.createElement('div');d.className='bubble '+(m.sender_id===session.user.id?'agent':'customer');d.dataset.id=m.id;let body=m.message?'<div>'+esc(m.message)+'</div>':'';if(m.attachment_url){if((m.mime_type||'').startsWith('image/'))body+=`<img src="${esc(m.attachment_url)}" alt="Attachment">`;else if(m.message_type==='voice')body+=`<audio controls src="${esc(m.attachment_url)}"></audio>`;else body+=`<a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">📎 ${esc(m.attachment_name||'Attachment')}</a>`}d.innerHTML=body+'<span class="meta">'+(m.sender_id===session.user.id?'You':'Customer')+' · '+time(m.created_at)+'</span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}async function sendFile(blob,name,type,kind,duration){if(!current||current.status==='resolved')return;const path=`${session.user.id}/${current.id}/${crypto.randomUUID()}-${name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const{error:up}=await supabase.storage.from('support-attachments').upload(path,blob,{contentType:type,upsert:false});if(up)throw up;const{data:u,error:su}=await supabase.storage.from('support-attachments').createSignedUrl(path,604800);if(su)throw su;const{error}=await supabase.from('support_messages').insert({conversation_id:current.id,sender_id:session.user.id,sender_type:'admin',message:'',message_type:kind,attachment_url:u.signedUrl,attachment_name:name,mime_type:type,duration_seconds:duration||null});if(error)throw error}$('attach').onclick=()=>file.click();file.onchange=async()=>{const f=file.files?.[0];if(!f)return;preview.textContent='📎 '+f.name;preview.style.display='block';try{await sendFile(f,f.name,f.type||'application/octet-stream','file',null)}catch(e){alert(e.message)}finally{preview.style.display='none';file.value=''}};$('voice').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();$('voice').textContent='🎙️';$('voice').classList.remove('recording');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recordStarted=Date.now();recorder=new MediaRecorder(stream);const r=recorder;recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:r.mimeType||'audio/webm'});try{await sendFile(b,'voice-note.webm',b.type,'voice',Math.max(1,Math.round((Date.now()-recordStarted)/1000)))}catch(e){alert(e.message)}recorder=null};recorder.start();$('voice').textContent='⏹️';$('voice').classList.add('recording')}catch(e){alert('Microphone permission is required.')}};form.onsubmit=async e=>{e.preventDefault();if(!current||current.status==='resolved')return;const text=input.value.trim();if(!text)return;const{error}=await supabase.from('support_messages').insert({conversation_id:current.id,sender_id:session.user.id,sender_type:'admin',message:text,message_type:'text'});if(error)alert(error.message);else input.value=''};async function resolveConversation(id){if(!confirm('Resolve this customer conversation? It will leave the active support list and the customer will see it as resolved.'))return;const{error}=await supabase.from('support_conversations').update({status:'resolved',resolved_at:new Date().toISOString(),resolved_by:session.user.id,call_status:'idle',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('Unable to resolve: '+error.message);if(current?.id===id){current.status='resolved';callBtn.disabled=true;resolveTop.disabled=true;resolveTop.textContent='✓ Resolved'}await loadList()}resolveTop.onclick=()=>current&&resolveConversation(current.id);back.onclick=()=>app.classList.remove('chat-open');async function initCall(){if(!current)return;if(callApi)callApi.end();callApi=await createVoiceCall({role:'admin',userId:session.user.id,callButton:callBtn,statusEl:$('topStatus'),autoHandleIncoming:false,onIncoming:async d=>{if(d?.callerId){await supabase.from('support_conversations').update({call_status:'calling',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',d.callerId).eq('status','open');await loadList()}}});}callBtn.onclick=async()=>{if(!current||current.status==='resolved')return;await initCall();if(callApi?.socket){callBtn.disabled=true;callBtn.textContent='⏳ Calling...';callApi.socket.emit('call-customer',{targetUserId:current.user_id});setTimeout(()=>{if(callBtn){callBtn.disabled=false;callBtn.textContent='📞 Call'}},15000)}};async function watchIncoming(){await initCall();callApi.socket.on('incoming-care-call',async d=>{const box=document.createElement('div');box.className='incoming';box.id='incoming-'+d.callId;box.innerHTML=`<strong>📞 Incoming Customer Care Call</strong><small>${esc(d.callerName||'Customer')}<br>ID: ${esc(d.callerId||'unknown')}</small><div class="actions"><button class="answer">✓ Answer</button><button class="decline">✕ Decline</button><button class="skip">↷ Skip</button></div>`;document.body.appendChild(box);box.querySelector('.answer').onclick=async()=>{box.remove();await supabase.from('support_conversations').update({call_status:'connected',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',d.callerId).eq('status','open');await loadList();callApi.socket.emit('accept-care-call',{callId:d.callId})};box.querySelector('.decline').onclick=async()=>{box.remove();await supabase.from('support_conversations').update({call_status:'declined',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',d.callerId);callApi.socket.emit('reject-care-call',{callId:d.callId});await loadList()};box.querySelector('.skip').onclick=async()=>{box.remove();await supabase.from('support_conversations').update({call_status:'calling',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',d.callerId);await loadList()}});callApi.socket.on('call-ended',async d=>{await supabase.from('support_conversations').update({call_status:'ended',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',d.callerId||'00000000-0000-0000-0000-000000000000');await loadList()})}auth().then(async ok=>{if(!ok)return;await loadPresence();await loadList();await watchIncoming()}).catch(e=>{convos.innerHTML='<div class="empty">'+esc(e.message)+'</div>'});</script></body></html>
