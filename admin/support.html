<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Inbox | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6f8;color:#171717}.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.list{background:#fff;border-right:1px solid #eee;padding:18px;overflow:auto}.brand{font-size:20px;font-weight:900;margin-bottom:18px}.brand span{color:#d71920}.item{padding:13px;border:1px solid #eee;border-radius:12px;margin:8px 0;cursor:pointer;background:#fff}.item.active{border-color:#d71920;background:#fff7f7}.item b{font-size:12px}.item small{display:block;color:#888;margin-top:5px;font-size:9px}.chat{display:flex;flex-direction:column;min-width:0}.top{padding:18px 20px;background:#d71920;color:#fff}.top b{font-size:15px}.top small{display:block;margin-top:5px;color:#ffe7e7}.msgs{flex:1;min-height:0;padding:22px;overflow:auto}.bubble{max-width:70%;padding:11px 14px;border-radius:16px;margin:9px 0;font-size:12px;line-height:1.5}.customer{background:#fff;border:1px solid #eee;border-bottom-left-radius:4px}.agent{margin-left:auto;background:#d71920;color:#fff;border-bottom-right-radius:4px}.meta{display:block;font-size:8px;opacity:.65;margin-top:5px}.compose{display:flex;gap:8px;padding:14px;background:#fff;border-top:1px solid #eee}.compose input{flex:1;border:1px solid #ddd;border-radius:10px;padding:12px}.compose button{border:0;border-radius:10px;background:#d71920;color:#fff;width:48px}.empty{text-align:center;color:#999;padding:70px 20px;font-size:12px}@media(max-width:700px){.shell{grid-template-columns:1fr}.list{max-height:230px;border-right:0;border-bottom:1px solid #eee}.msgs{height:52vh}.bubble{max-width:85%}}</style></head><body><div class="shell"><aside class="list"><div class="brand"><span>Shop</span> Camzon · 💬 Support</div><div id="conversations"><div class="empty">Loading conversations...</div></div></aside><main class="chat"><header class="top"><b id="title">Select a customer conversation</b><small id="status">● Live support</small></header><div class="msgs" id="msgs"><div class="empty">Choose a conversation to reply.</div></div><form class="compose" id="form"><input id="input" placeholder="Reply to customer..." maxlength="2000"><button id="send">➤</button></form></main></div><script type="module">import{supabase}from'../js/supabase.js';const listEl=document.getElementById('conversations'),msgs=document.getElementById('msgs'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),title=document.getElementById('title');let admin,current,channel;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const t=v=>new Date(v).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});async function auth(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.replace('./login.html');return null}const{data:a,error}=await supabase.from('admins').select('id,role,is_active').eq('id',session.user.id).maybeSingle();if(error||!a||!a.is_active||!['admin','manager','order_staff'].includes(a.role)){await supabase.auth.signOut();location.replace('./login.html');return null}admin=session;return session}async function loadConversations(){const{data,error}=await supabase.from('support_conversations').select('id,user_id,category,status,created_at,updated_at').order('updated_at',{ascending:false});if(error){listEl.innerHTML='<div class="empty">Unable to load support: '+esc(error.message)+'</div>';return}listEl.innerHTML=(data||[]).map(c=>`<div class="item ${current?.id===c.id?'active':''}" data-id="${c.id}"><b>💬 ${esc(c.category||'Support')}</b><small>${esc(c.status||'open')} · ${new Date(c.updated_at||c.created_at).toLocaleString()}</small><small>Customer: ${esc(c.user_id)}</small></div>`).join('')||'<div class="empty">No customer conversations yet.</div>';document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openConversation(x.dataset.id))}async function openConversation(id){const{data:c,error}=await supabase.from('support_conversations').select('*').eq('id',id).single();if(error)return alert(error.message);current=c;title.textContent='💬 Customer Support · '+(c.category||'General Support');await loadMessages();if(channel)supabase.removeChannel(channel);channel=supabase.channel('admin-support-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+id},p=>{append(p.new)}).subscribe();await loadConversations()}async function loadMessages(){const{data,error}=await supabase.from('support_messages').select('*').eq('conversation_id',current.id).order('created_at',{ascending:true});if(error){msgs.innerHTML='<div class="empty">Unable to load messages: '+esc(error.message)+'</div>';return}msgs.innerHTML='';(data||[]).forEach(append);msgs.scrollTop=msgs.scrollHeight}function append(m){const d=document.createElement('div');d.className='bubble '+(m.sender_id===admin.user.id?'agent':'customer');d.dataset.id=m.id;let body=m.message?'<div>'+esc(m.message)+'</div>':'';if(m.attachment_url)body+=`<div><a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">📎 ${esc(m.attachment_name||'Attachment')}</a></div>`;if(m.message_type==='voice'&&m.attachment_url)body=`<audio controls src="${esc(m.attachment_url)}"></audio>`;d.innerHTML=body+'<span class="meta">'+(m.sender_id===admin.user.id?'You':'Customer')+' · '+t(m.created_at)+'</span>';if(!msgs.querySelector(`[data-id="${m.id}"]`)){msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}}form.onsubmit=async e=>{e.preventDefault();if(!current)return;const text=input.value.trim();if(!text)return;send.disabled=true;const{error}=await supabase.from('support_messages').insert({conversation_id:current.id,sender_id:admin.user.id,sender_type:'admin',message:text,message_type:'text'});if(error)alert(error.message);else input.value='';send.disabled=false};auth().then(s=>s&&loadConversations()).catch(e=>alert(e.message));</script></body></html>
