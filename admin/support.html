<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Support | Shop Camzon</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}.shell{display:grid;grid-template-columns:290px 1fr;min-height:100vh}.list{background:#fff;border-right:1px solid #eee;padding:18px;overflow:auto}.brand{font-size:20px;font-weight:900;margin-bottom:18px}.brand span{color:#d71920}.presence{padding:14px;border:1px solid #eee;border-radius:14px;margin-bottom:14px;background:#fff}.presence-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.presence b{font-size:12px}.presence small{display:block;color:#888;margin-top:5px;font-size:9px}.presence button{border:0;border-radius:999px;padding:9px 13px;color:#fff;font-size:10px;font-weight:900;cursor:pointer}.presence button.online{background:#16a34a}.presence button.offline{background:#777}.presence button:disabled{opacity:.6;cursor:wait}.item{padding:13px;border:1px solid #eee;border-radius:12px;margin:8px 0;cursor:pointer;background:#fff}.item.active{border-color:#d71920;background:#fff7f7}.item b{font-size:12px}.item small{display:block;color:#888;margin-top:5px;font-size:9px}.chat{display:flex;flex-direction:column;min-width:0;height:100vh}.top{padding:16px 20px;background:#d71920;color:#fff}.top b{font-size:15px}.top small{display:block;margin-top:5px;color:#ffe7e7}.msgs{flex:1;padding:22px;overflow:auto}.bubble{max-width:70%;padding:11px 14px;border-radius:16px;margin:9px 0;font-size:12px;line-height:1.5}.customer{background:#fff;border:1px solid #eee;border-bottom-left-radius:4px}.agent{margin-left:auto;background:#d71920;color:#fff;border-bottom-right-radius:4px}.meta{display:block;font-size:8px;opacity:.65;margin-top:5px}.bubble img{max-width:280px;max-height:220px;border-radius:10px;margin-top:7px}.bubble audio{width:min(280px,100%);margin-top:5px}.compose{display:flex;gap:7px;padding:12px;background:#fff;border-top:1px solid #eee;align-items:center}.compose input[type=text]{flex:1;border:1px solid #ddd;border-radius:11px;padding:12px;outline:none}.iconbtn{width:44px;height:44px;border:1px solid #eee;border-radius:11px;background:#fff;cursor:pointer;font-size:18px}.iconbtn.recording{background:#fff0f0;border-color:#d71920;color:#d71920}.send{width:46px;height:44px;border:0;border-radius:11px;background:#d71920;color:#fff;font-size:17px;cursor:pointer}.empty{text-align:center;color:#999;padding:70px 20px;font-size:12px}.hidden{display:none}.attachment-preview{font-size:10px;background:#fff7f7;color:#a31218;padding:7px;border-radius:8px;margin:0 12px 8px}.typing{font-size:9px;color:#999;padding:0 22px 7px}@media(max-width:700px){.shell{grid-template-columns:1fr}.list{height:285px;border-right:0;border-bottom:1px solid #eee}.chat{height:calc(100vh - 285px)}.bubble{max-width:85%}}</style></head><body><div class="shell"><aside class="list"><div class="brand"><span>Shop</span> Camzon · 💬 Support</div><div class="presence"><div class="presence-head"><div><b>Customer Care</b><small id="presenceText">⚪ Offline</small></div><button id="presenceBtn" class="offline" type="button">Go Online</button></div></div><div id="conversations"><div class="empty">Loading conversations...</div></div></aside><main class="chat"><header class="top"><b id="title">Select a customer conversation</b><small id="status">● Customer Care Offline</small></header><div class="msgs" id="msgs"><div class="empty">Choose a conversation to reply.</div></div><div id="preview" class="attachment-preview hidden"></div><div class="typing" id="typing"></div><form class="compose" id="form"><input id="file" class="hidden" type="file" accept="image/*,.pdf,.doc,.docx,.txt,.zip"><button type="button" class="iconbtn" id="fileBtn" title="Attach file">📎</button><button type="button" class="iconbtn" id="voiceBtn" title="Voice note">🎙️</button><input id="input" type="text" placeholder="Reply to customer..." maxlength="2000"><button class="send" id="send" title="Send">➤</button></form></main></div><script type="module">import{supabase}from'../js/supabase.js';const $=id=>document.getElementById(id),listEl=$('conversations'),msgs=$('msgs'),form=$('form'),input=$('input'),send=$('send'),title=$('title'),status=$('status'),file=$('file'),preview=$('preview'),voiceBtn=$('voiceBtn'),presenceBtn=$('presenceBtn'),presenceText=$('presenceText');let admin,current,channel,presenceChannel,mediaRecorder,chunks=[],recordStarted=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const t=v=>new Date(v).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});async function auth(){const{data:{session}}=await supabase.auth.getSession();if(!session){location.replace('./login.html');return null}const{data:a,error}=await supabase.from('admins').select('id,role,is_active').eq('id',session.user.id).maybeSingle();if(error||!a||!a.is_active||!['admin','manager','order_staff'].includes(a.role)){await supabase.auth.signOut();location.replace('./login.html');return null}admin=session;return session}function renderPresence(on){presenceText.textContent=on?'🟢 Online':'⚪ Offline';presenceBtn.textContent=on?'Go Offline':'Go Online';presenceBtn.className=on?'online':'offline';status.textContent=on?'● Customer Care Online':'● Customer Care Offline'}async function loadPresence(){const{data,error}=await supabase.from('support_agent_presence').select('is_online').eq('agent_id',admin.user.id).maybeSingle();if(!error)renderPresence(!!data?.is_online)}async function setPresence(on){presenceBtn.disabled=true;const{error}=await supabase.from('support_agent_presence').upsert({agent_id:admin.user.id,is_online:on,updated_at:new Date().toISOString()},{onConflict:'agent_id'});if(error)alert('Unable to change availability: '+error.message);else renderPresence(on);presenceBtn.disabled=false}presenceBtn.onclick=()=>setPresence(!presenceBtn.classList.contains('online'));async function watchPresence(){presenceChannel=supabase.channel('admin-presence').on('postgres_changes',{event:'*',schema:'public',table:'support_agent_presence',filter:'agent_id=eq.'+admin.user.id},p=>renderPresence(!!p.new.is_online)).subscribe()}async function loadConversations(){const{data,error}=await supabase.from('support_conversations').select('id,user_id,category,status,created_at,updated_at').order('updated_at',{ascending:false});if(error){listEl.innerHTML='<div class="empty">Unable to load support: '+esc(error.message)+'</div>';return}listEl.innerHTML=(data||[]).map(c=>`<div class="item ${current?.id===c.id?'active':''}" data-id="${c.id}"><b>💬 ${esc(c.category||'Support')}</b><small>${esc(c.status||'open')} · ${new Date(c.updated_at||c.created_at).toLocaleString()}</small><small>Customer: ${esc(c.user_id)}</small></div>`).join('')||'<div class="empty">No customer conversations yet.</div>';document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openConversation(x.dataset.id))}async function openConversation(id){const{data:c,error}=await supabase.from('support_conversations').select('*').eq('id',id).single();if(error)return alert(error.message);current=c;title.textContent='💬 Customer Support · '+(c.category||'General Support');await loadMessages();if(channel)await supabase.removeChannel(channel);channel=supabase.channel('admin-support-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+id},p=>append(p.new)).subscribe(s=>{status.textContent=s==='SUBSCRIBED'?(presenceBtn.classList.contains('online')?'● Customer Care Online':'● Customer Care Offline'):'● Reconnecting...'});await loadConversations()}async function loadMessages(){const{data,error}=await supabase.from('support_messages').select('*').eq('conversation_id',current.id).order('created_at',{ascending:true});if(error){msgs.innerHTML='<div class="empty">Unable to load messages: '+esc(error.message)+'</div>';return}msgs.innerHTML='';(data||[]).forEach(append);msgs.scrollTop=msgs.scrollHeight}function append(m){if(msgs.querySelector(`[data-id="${m.id}"]`))return;const d=document.createElement('div');d.className='bubble '+(m.sender_id===admin.user.id?'agent':'customer');d.dataset.id=m.id;let body=m.message?'<div>'+esc(m.message)+'</div>':'';if(m.message_type==='voice'&&m.attachment_url)body+=`<audio controls src="${esc(m.attachment_url)}"></audio>`;else if(m.attachment_url){if((m.mime_type||'').startsWith('image/'))body+=`<img src="${esc(m.attachment_url)}" alt="Attachment">`;body+=`<div><a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">📎 ${esc(m.attachment_name||'Open attachment')}</a></div>`}d.innerHTML=body+'<span class="meta">'+(m.sender_id===admin.user.id?'You':'Customer')+' · '+t(m.created_at)+'</span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}async function uploadAndSend(blob,name,type,duration){if(!current)return;send.disabled=true;try{const path=`${admin.user.id}/${current.id}/${crypto.randomUUID()}-${name}`;const up=await supabase.storage.from('support-attachments').upload(path,blob,{contentType:type,upsert:false});if(up.error)throw up.error;const{data:url}=supabase.storage.from('support-attachments').getPublicUrl(path);const{error}=await supabase.from('support_messages').insert({conversation_id:current.id,sender_id:admin.user.id,sender_type:'admin',message:'',message_type:type.startsWith('audio/')?'voice':'file',attachment_url:url.publicUrl,attachment_name:name,mime_type:type,duration_seconds:duration||null});if(error)throw error;preview.classList.add('hidden');preview.textContent=''}catch(e){alert('Unable to send attachment: '+e.message)}finally{send.disabled=false}}$('fileBtn').onclick=()=>file.click();file.onchange=async()=>{const f=file.files?.[0];if(!f)return;preview.textContent='📎 '+f.name;preview.classList.remove('hidden');await uploadAndSend(f,f.name,f.type||'application/octet-stream',null);file.value=''};voiceBtn.onclick=async()=>{if(mediaRecorder?.state==='recording'){mediaRecorder.stop();voiceBtn.textContent='🎙️';voiceBtn.classList.remove('recording');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recordStarted=Date.now();mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(x=>x.stop());const blob=new Blob(chunks,{type:mediaRecorder.mimeType||'audio/webm'});const seconds=Math.max(1,Math.round((Date.now()-recordStarted)/1000));await uploadAndSend(blob,'voice-note.webm',blob.type,seconds)};mediaRecorder.start();voiceBtn.textContent='⏹️';voiceBtn.classList.add('recording')}catch(e){alert('Microphone permission is required for voice notes.')}};form.onsubmit=async e=>{e.preventDefault();if(!current)return;const text=input.value.trim();if(!text)return;send.disabled=true;const{error}=await supabase.from('support_messages').insert({conversation_id:current.id,sender_id:admin.user.id,sender_type:'admin',message:text,message_type:'text'});if(error)alert(error.message);else input.value='';send.disabled=false};auth().then(async s=>{if(!s)return;await loadPresence();await watchPresence();await loadConversations()}).catch(e=>alert(e.message));</script></body></html>
