werCall" style="display:none">✓</button><button class="circleBtn declineBtn" id="declineCall" style="display:none">✕</button><button class="circleBtn skipBtn" id="skipCall" style="display:none">↷</button><button class="circleBtn endBtn" id="endCall">📵</button></div></div></div><script type="module">import{supabase}from'../js/supabase.js';import{createVoiceCall}from'../js/voice-call.js';const $=id=>document.getElementById(id),app=$('app'),convos=$('convos'),msgs=$('msgs'),form=$('form'),input=$('input'),file=$('file'),preview=$('preview'),presenceBtn=$('presenceBtn'),presenceText=$('presenceText'),count=$('count'),callBtn=$('callBtn'),resolveTop=$('resolveTop'),back=$('back'),overlay=$('callOverlay'),callStatus=$('callStatus'),answerCall=$('answerCall'),declineCall=$('declineCall'),skipCall=$('skipCall'),endCall=$('endCall');let session,current,presenceChannel,msgChannel,callApi,recorder,chunks=[],recordStarted=0,incomingCall=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const time=v=>new Date(v).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});async function auth(){const{data:{session:s}}=await supabase.auth.getSession();if(!s){location.replace('./login.html');return false}const{data:a,error}=await supabase.from('admins').select('id,role,is_active').eq('id',s.user.id).maybeSingle();if(error||!a||!a.is_active||!['admin','manager','order_staff'].includes(a.role)){await supabase.auth.signOut();location.replace('./login.html');return false}session=s;return true}function setPresenceUI(on){presenceText.textContent=on?'🟢 Online':'⚪ Offline';presenceBtn.textContent=on?'Go Offline':'Go Online';presenceBtn.className=on?'on':'off';if(!current||current.status!=='resolved')callBtn.disabled=!on; $('topStatus').textContent=on?'🟢 Customer Care Online':'⚪ Customer Care Offline'}async function loadPresence(){const{data}=await supabase.from('support_agent_presence').select('is_online').eq('agent_id',session.user.id).maybeSingle();setPresenceUI(!!data?.is_online);if(presenceChannel)await supabase.removeChannel(presenceChannel);presenceChannel=supabase.channel('admin-presence').on('postgres_changes',{event:'*',schema:'public',table:'support_agent_presence'},p=>{if(p.new?.agent_id===session.user.id)setPresenceUI(!!p.new.is_online)}).subscribe()}async function setPresence(on){presenceBtn.disabled=true;const{error}=await supabase.from('support_agent_presence').upsert({agent_id:session.user.id,is_online:on,updated_at:new Date().toISOString()},{onConflict:'agent_id'});if(error)alert('Unable to change availability: '+error.message);else setPresenceUI(on);presenceBtn.disabled=false}presenceBtn.onclick=()=>setPresence(!presenceBtn.classList.contains('on'));async function loadList(){const{data,error}=await supabase.from('support_conversations').select('*').order('updated_at',{ascending:false});if(error){convos.innerHTML='<div class="empty">Unable to load conversations: '+esc(error.message)+'</div>';return}count.textContent=(data||[]).length+' conversation'+((data||[]).length===1?'':'s');convos.innerHTML=(data||[]).map(c=>{const st=String(c.status||'open').toLowerCase(),cs=String(c.call_status||'idle').toLowerCase();return `<div class="conv ${current?.id===c.id?'active':''}" data-id="${c.id}"><div class="avatar">👤</div><b>Customer</b><small>${esc(c.category||'General Support')} · ${new Date(c.updated_at||c.created_at).toLocaleString()}</small><small>ID: ${esc(c.user_id)}</small>${cs!=='idle'?`<span class="badge ${cs}">📞 ${esc(cs)}</span>`:''}${st==='resolved'?'<span class="badge resolved">✓ Resolved</span>':`<button class="resolve" data-resolve="${c.id}">✓ Resolve</button>`}</div>`}).join('')||'<div class="empty">No conversations yet.</div>';document.querySelectorAll('.conv').forEach(x=>x.onclick=e=>{if(e.target.closest('[data-resolve]'))return;openConversation(x.dataset.id)});document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=e=>{e.stopPropagation();resolveConversation(b.dataset.resolve)})}async function openConversation(id){const{data:c,error}=await supabase.from('support_conversations').select('*').eq('id',id).single();if(error)return alert(error.message);current=c;app.classList.add('chat-open');$('title').textContent='Customer';$('topAvatar').textContent='👤';resolveTop.disabled=c.status==='resolved';resolveTop.textContent=c.status==='resolved'?'✓ Resolved':'✓ Resolve';callBtn.disabled=c.status==='resolved'||presenceBtn.classList.contains('off');await loadMessages();if(msgChannel)await supabase.removeChannel(msgChannel);msgChannel=supabase.channel('admin-msg-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'conversation_id=eq.'+id},p=>append(p.new)).on('postgres_changes',{event:'UPDATE',schema:'public',table:'support_conversations',filter:'id=eq.'+id},p=>{current=p.new;resolveTop.disabled=current.status==='resolved';callBtn.disabled=current.status==='resolved'||presenceBtn.classList.contains('off');loadList()}).subscribe();await loadList()}async function loadMessages(){const{data,error}=await supabase.from('support_messages').select('*').eq('conversation_id',current.id).order('created_at',{ascending:true});if(error){msgs.innerHTML='<div class="empty">Unable to load messages: '+esc(error.message)+'</div>';return}msgs.innerHTML='';if(!data?.length)msgs.innerHTML='<div class="empty">💬 No messages yet.</div>';else data.forEach(append);msgs.scrollTop=msgs.scrollHeight}function append(m){if(msgs.querySelector(`[data-id="${m.id}"]`))return;const d=document.createElement('div');d.className='bubble '+(m.sender_id===session.user.id?'agent':'customer');d.dataset.id=m.id;let body=m.message?'<div>'+esc(m.message)+'</div>':'';if(m.attachment_url){if((m.mime_type||'').startsWith('image/'))body+=`<img src="${esc(m.attachment_url)}" alt="Attachment">`;else if(m.message_type==='voice')body+=`<audio controls src="${esc(m.attachment_url)}"></audio>`;else body+=`<a href="${esc(m.attachment_url)}" target="_blank" rel="noopener">📎 ${esc(m.attachment_name||'Attachment')}</a>`}d.innerHTML=body+'<span class="meta">'+(m.sender_id===session.user.id?'You':'Customer')+' · '+time(m.created_at)+'</span>';msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}async function sendFile(blob,name,type,kind,duration){if(!current||current.status==='resolved')return;const path=`${session.user.id}/${current.id}/${crypto.randomUUID()}-${name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const{error:up}=await supabase.storage.from('support-attachments').upload(path,blob,{contentType:type||'application/octet-stream',upsert:false});if(up)throw up;const{data:u,error:su}=await supabase.storage.from('support-attachments').createSignedUrl(path,604800);if(su)throw su;const{error}=await supabase.from('support_messages').insert({conversation_id:current.id,sender_id:session.user.id,sender_type:'admin',message:'',message_type:kind,attachment_url:u.signedUrl,attachment_name:name,mime_type:type,duration_seconds:duration||null});if(error)throw error}$('attach').onclick=()=>file.click();file.onchange=async()=>{const f=file.files?.[0];if(!f)return;preview.textContent='📎 '+f.name;preview.style.display='block';try{await sendFile(f,f.name,f.type,'file',null)}catch(e){alert(e.message)}finally{preview.style.display='none';file.value=''}};$('voice').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();$('voice').textContent='🎙️';$('voice').classList.remove('recording');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recordStarted=Date.now();recorder=new MediaRecorder(stream);const r=recorder;r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const b=new Blob(chunks,{type:r.mimeType||'audio/webm'});try{await sendFile(b,'voice-note.webm',b.type,'voice',Math.max(1,Math.round((Date.now()-recordStarted)/1000)))}catch(e){alert(e.message)}recorder=null};r.start();$('voice').textContent='⏹️';$('voice').classList.add('recording')}catch(e){alert('Microphone permission is required.')}};form.onsubmit=async e=>{e.preventDefault();if(!current||current.status==='resolved')return;const text=input.value.trim();if(!text)return;const{error}=await supabase.from('support_messages').insert({conversation_id:current.id,sender_id:session.user.id,sender_type:'admin',message:text,message_type:'text'});if(error)alert(error.message);else input.value=''};async function resolveConversation(id){if(!confirm('Resolve this customer conversation?'))return;const{error}=await supabase.from('support_conversations').update({status:'resolved',resolved_at:new Date().toISOString(),resolved_by:session.user.id,call_status:'idle',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('Unable to resolve: '+error.message);if(current?.id===id){current.status='resolved';callBtn.disabled=true;resolveTop.disabled=true;resolveTop.textContent='✓ Resolved'}await loadList()}resolveTop.onclick=()=>current&&resolveConversation(current.id);back.onclick=()=>app.classList.remove('chat-open');function showOutgoing(){overlay.classList.add('show');callStatus.textContent='Calling customer...';answerCall.style.display='none';declineCall.style.display='none';skipCall.style.display='none';endCall.style.display='block'}function showIncoming(d){incomingCall=d;overlay.classList.add('show');callStatus.textContent='Incoming call from customer';answerCall.style.display='block';declineCall.style.display='block';skipCall.style.display='block';endCall.style.display='none'}function hideCall(){overlay.classList.remove('show');incomingCall=null;answerCall.style.display='none';declineCall.style.display='none';skipCall.style.display='none';endCall.style.display='block'}async function ensureCall(){if(callApi)return callApi;callApi=await createVoiceCall({role:'admin',userId:session.user.id,callButton:null,statusEl:callStatus,onIncoming:d=>{if(d.direction==='customer-to-admin')showIncoming(d)}});callApi.on('call-ended',()=>{if(overlay.classList.contains('show')){callStatus.textContent='⚪ Call ended';setTimeout(hideCall,700)}});return callApi}callBtn.onclick=async()=>{if(!current||current.status==='resolved')return;try{const api=await ensureCall();showOutgoing();await supabase.from('support_conversations').update({call_status:'calling',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',current.id);await api.startCall(current.user_id)}catch(e){hideCall();alert('Unable to start voice call: '+e.message)}};answerCall.onclick=async()=>{if(!incomingCall)return;try{const api=await ensureCall();await api.acceptCall(incomingCall.callId);const{data:c}=await supabase.from('support_conversations').select('id').eq('user_id',incomingCall.callerId).eq('status','open').maybeSingle();if(c)await supabase.from('support_conversations').update({call_status:'connected',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',c.id);callStatus.textContent='🟢 Voice call connected';answerCall.style.display='none';declineCall.style.display='none';skipCall.style.display='none';endCall.style.display='block'}catch(e){alert('Unable to answer call: '+e.message)}};declineCall.onclick=async()=>{if(incomingCall){callApi?.rejectCall(incomingCall.callId);const{data:c}=await supabase.from('support_conversations').select('id').eq('user_id',incomingCall.callerId).eq('status','open').maybeSingle();if(c)await supabase.from('support_conversations').update({call_status:'declined',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',c.id)}hideCall();await loadList()};skipCall.onclick=async()=>{if(incomingCall){const{data:c}=await supabase.from('support_conversations').select('id').eq('user_id',incomingCall.callerId).eq('status','open').maybeSingle();if(c)await supabase.from('support_conversations').update({call_status:'calling',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',c.id)}hideCall();await loadList()};endCall.onclick=async()=>{callApi?.end();if(current){await supabase.from('support_conversations').update({call_status:'ended',call_updated_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',current.id)}hideCall();await loadList()};auth().then(async ok=>{if(!ok)return;await loadPresence();await loadList();await ensureCall()}).catch(e=>{convos.innerHTML='<div class="empty">'+esc(e.message)+'</div>'});</script></body></html>
